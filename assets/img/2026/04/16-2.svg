="140" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PR 57</text><text x="260" y="460" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">2025-10, 2026-01 은 0 · 2026-02 는 "add a lot of different things" 한 커밋</text><text x="740" y="460" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">3월: 38개 중 16개가 CI 시행착오 · 4월 16일: 첫 Co-Authored-By, 첫 PR CI, PR #1</text><text x="550" y="490" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">산출량이지 가치가 아니다 — 이 시리즈에서 숫자를 쓸 때는 그 한계도 같이 쓴다</text><path class="anim" d="M 880 100 L 880 160" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1250;0.2500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="3.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1250;0.1300;1" values="0;0;1;1;0;0"/><animateMotion dur="3.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1250;1" path="M 880 100 L 880 160"/></circle><path class="anim" d="M 960 100 L 960 160" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.20s" repeatCount="indefinite" keyTimes="0;0.2500;0.2600;0.3750;0.6875;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeNam