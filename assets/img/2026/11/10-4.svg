<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SSHKit은 호스트명 · IP 양쪽에 등록된 키의 교집합을 찾는다 — 호스트명만 있는 핀은 "모르는 키"가 된다</text><rect x="40" y="90" width="500" height="300" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전</text><rect x="70" y="125" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="149.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">known_hosts</text><text x="170.0" y="170.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deploy-host  ssh-ed25519 …</text><rect x="310" y="125" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="410.0" y="149.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SSHKit 조회</text><text x="410.0" y="170.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"deploy-host,10.x.x.x"</text><rect x="70" y="230" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="170.0" y="254.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deploy-host 키</text><text x="170.0" y="275.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ ed25519 }</text><rect x="310" y="230" width="200" height="70" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="410.0" y="254.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">IP 키</text><text x="410.0" y="275.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ } (등록 안 함)</text><rect x="165" y="320" width="250" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="347.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">교집합 = ∅ → SSH_HOST_KEY_UNKNOWN</text><path d="M 170 195 L 170 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 410 195 L 410 230" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 170 300 L 250 320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 410 300 L 330 320" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="560" y="90" width="500" height="300" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="574" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 — HostKeyAlias로 조회 이름 고정</text><rect x="590" y="125" width="440" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="810.0" y="151.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">KAMAL_SSH_CONFIG</text><text x="810.0" y="172.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Host *  HostKeyAlias deploy-host</text><text x="810.0" y="188.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">StrictHostKeyChecking yes · GlobalKnownHostsFile /dev/null</text><rect x="590" y="245" width="200" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="690.0" y="264.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">정상 핀</text><text x="690.0" y="285.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통과 ✓</text><rect x="830" y="245" width="200" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="930.0" y="264.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">다른 키</text><text x="930.0" y="285.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">MISMATCH ✓</text><rect x="710" y="320" width="200" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="810.0" y="347.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">등록 안 된 호스트 → UNKNOWN ✓</text><path d="M 690 215 L 690 245" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 930 215 L 930 245" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 810 215 L 810 320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="40" y="410" width="1020" height="80" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="440.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">검증을 끄지 않고 조회 이름만 바꿨다 — 엄격함은 그대로인지 네 경우를 오프라인으로 재현해 확인</text><text x="550.0" y="459.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Kamal 2.12 · SSHKit 1.25 · Net::SSH 7.3</