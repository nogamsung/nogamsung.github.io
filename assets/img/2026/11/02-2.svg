<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">캐시 미스에 account 호출이 실패하거나 회로가 열려 있으면, 이제 허용이 아니라 503을 돌려준다</text><rect x="40" y="90" width="170" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="125.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">인증된 요청</text><rect x="280" y="90" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="390.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">허용 캐시 60s?</text><rect x="280" y="175" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="390.0" y="203.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">거부 캐시 10s?</text><rect x="280" y="260" width="220" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="390.0" y="288.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">회로 상태 (account-access)</text><rect x="280" y="345" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="390.0" y="362.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HTTP GET has-service-role</text><text x="390.0" y="382.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">timeout 10s</text><rect x="760" y="90" width="300" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통과 → 컨트롤러</text><rect x="760" y="175" width="300" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="192.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">403 접근 거부</text><text x="910.0" y="213.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SERVICE_ACCESS_DENIED</text><rect x="760" y="260" width="300" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="277.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">503 판정 불가 — HTTP 안 나감</text><text x="910.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OPEN → CallNotPermittedException 즉시</text><path d="M 210 118 L 280 118" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 500 118 L 760 118" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="630.0" y="108.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">히트</text><path d="M 390 146 L 390 175" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="160" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">미스</text><path d="M 500 203 L 760 203" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="630.0" y="193.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">히트</text><path d="M 390 231 L 390 260" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="245" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">미스</text><path d="M 500 288 L 760 288" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="630.0" y="278.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OPEN</text><path d="M 390 316 L 390 345" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="330" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CLOSED / HALF_OPEN</text><rect x="600" y="330" width="460" height="34" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="830.0" y="347.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">true → 허용 60s 캐시 → 통과</text><path d="M 500 373 L 550 373 L 550 347 L 600 347" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="600" y="372" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="389.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">false → 거부 10s 캐시 → 403</text><path d="M 500 373 L 550 373 L 550 389 L 600 389" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="600" y="414" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="431.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">연결 오류 · timeout · 5xx → 회로에 실패 기록 → 503</text><path d="M 500 373 L 550 373 L 550 431 L 600 431" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="600" y="456" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="473.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">4xx(401·403·429) → 집계 제외(ignore) → 503 + ERROR 로그(status만)</text><path d="M 500 373 L 550 373 L 550 473 L 600 473" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="40" y="520" width="490" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="285.0" y="538.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">이전 (fail-open): 모든 실패 → return true</text><text x="285.0" y="557.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">장애 15초마다 전 서비스 권한이 열리는 셈</text><rect x="570" y="520" width="490" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="815.0" y="538.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">회로: 30s 창 · 최소 10회 · 실패율 ≥ 50% → OPEN 15s</text><text x="815.0" y="557.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ HALF_OPEN 3회 시험 → CLOSED / OPEN</text><rect x="40" y="590" width="1020" height="40" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="610.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">실패 결과는 캐시하지 않는다 · 회로 OPEN 은 liveness 에 연결하지 않는다 · 회로를 꺼도 "판정 실패 = 허용" 으로는 돌아가지 않는다</text><path class="anim" d="M 210 118 L 280 118" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0526;0.0855;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0526;0.0576;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0526;1" path="M 210 118 L 280 118"/></circle><path class="anim" d="M 390 146 L 390 175" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0855;0.0955;0.1184;0.1513;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0855;0.0905;0.1184;0.1234;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0855;0.1184;1" path="M 390 146 L 390 175"/></circle><path class="anim" d="M 390 231 L 390 260" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.1513;0.1613;0.1842;0.2171;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.1513;0.1563;0.1842;0.1892;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1513;0.1842;1" path="M 390 231 L 390 260"/></circle><path class="anim" d="M 390 316 L 390 345" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.2171;0.2271;0.2500;0.2829;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.2171;0.2221;0.2500;0.2550;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2171;0.2500;1" path="M 390 316 L 390 345"/></circle><path class="anim" d="M 500 373 L 550 373 L 550 431 L 600 431" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.2829;0.2929;0.3487;0.4539;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.2829;0.2879;0.3487;0.3537;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2829;0.3487;1" path="M 500 373 L 550 373 L 550 431 L 600 431"/></circle><path class="anim" d="M 210 130 L 280 130" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.4539;0.4639;0.5066;0.5395;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.4539;0.4589;0.5066;0.5116;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4539;0.5066;1" path="M 210 130 L 280 130"/></circle><path class="anim" d="M 390 146 L 390 175" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.5395;0.5495;0.5724;0.6053;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.5395;0.5445;0.5724;0.5774;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5395;0.5724;1" path="M 390 146 L 390 175"/></circle><path class="anim" d="M 390 231 L 390 260" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.6053;0.6153;0.6382;0.6711;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.6053;0.6103;0.6382;0.6432;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6053;0.6382;1" path="M 390 231 L 390 260"/></circle><path class="anim" d="M 500 288 L 760 288" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.6711;0.6811;0.7368;0.8684;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.6711;0.6761;0.7368;0.7418;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6711;0.7368;1" path="M 500 288 L 760 288"/></circle></svg>