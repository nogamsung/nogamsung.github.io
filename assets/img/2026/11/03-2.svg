ight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">0.8초 만에 끝</text><rect x="470" y="130" width="300" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="620.0" y="144.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">컨테이너 B가 0.9초에 깨어남</text><text x="620.0" y="166.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">락이 비어 있다 → 또 실행</text><text x="120" y="270" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle">lockAtLeastFor = 30초</text><rect x="120" y="290" width="190" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="215.0" y="304.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">컨테이너 A 실행</text><text x="215.0" y="326.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">23:50:00.000</text><rect x="330" y="290" width="460" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="560.0" y="313.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">끝났지만 락은 23:50:30까지 유지</text><rect x="470" y="360" width="320" height="46" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="630.0" y="374.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">컨테이너 B가 0.9초에 깨어남</text><text x="630.0" y="396.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">락이 잡혀 있다 → 건너뜀</text><path d="M 630 360 L 630 336" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><text x="950" y="313" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle">lockAtMostFor</text><text x="950" y="336" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">컨테이너가 죽어도</text><text x="950" y="354" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">락이 영원히 남지 않게</text><text x="550" y="470" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">같은 cron이라도 두 컨테이너가 깨어나는 시각은 수 밀리초~초 단위로 어긋난다</text><text x="550" y="500" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">&quot;실행하는 동안만 락&quot;으로는 부족하고, 짧은 작업일수록 lockAtLeastFor가 중복을 막는다</text><g class="anim"><line x1="0" y1="118" x2="0" y2="410" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="0" cy="118" r="6" fill="#2563eb"/><text x="0" y="104" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">시간</text><animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.85;1" values="120 0;790 0;790 0"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.03;0.85;0.95;1" values="0;1;1;0;0"/></g></svg>