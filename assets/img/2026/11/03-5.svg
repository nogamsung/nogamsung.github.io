<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">커밋 전에 캐시를 비우면 다른 요청이 옛 DB 값으로 캐시를 다시 채우고, 그 뒤 발급된 토큰은 옛 권한에 새 pv를 단다</text><text x="150" y="120" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">관리자 A 트랜잭션</text><path d="M 170 120 L 1060 120" fill="none" stroke="#6b7280" stroke-width="1"/><text x="150" y="200" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">정책 캐시</text><path d="M 170 200 L 1060 200" fill="none" stroke="#6b7280" stroke-width="1"/><text x="150" y="280" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">사용자 B·C 재발급</text><path d="M 170 280 L 1060 280" fill="none" stroke="#6b7280" stroke-width="1"/><text x="150" y="360" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redis 변경 시각</text><path d="M 170 360 L 1060 360" fill="none" stroke="#6b7280" stroke-width="1"/><text x="250" y="92" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">T0</text><text x="400" y="92" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">T1</text><text x="550" y="92" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">T2</text><text x="700" y="92" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">T3</text><text x="880" y="92" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">T4</text><rect x="200" y="100" width="100" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="250.0" y="120.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BEGIN · 수정</text><rect x="350" y="100" width="100" height="40" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="400.0" y="120.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">evictAll</text><rect x="650" y="100" width="100" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="700.0" y="120.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">COMMIT</text><rect x="350" y="180" width="100" height="40" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="400.0" y="200.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(빈 캐시)</text><rect x="500" y="180" width="130" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="565.0" y="200.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">옛 정책 재적재</text><text x="640" y="200" font-size="11" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TTL 30초</text><rect x="500" y="260" width="100" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="280.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B: pv=T2</text><rect x="830" y="260" width="110" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="885.0" y="280.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">C: pv=T4</text><rect x="650" y="340" width="100" height="40" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="700.0" y="360.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">tenant=T3</text><path d="M 550 260 L 550 220" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="560" y="240" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">캐시 미스 → DB (미커밋 = 옛 값)</text><path d="M 885 260 L 640 200" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="762.5" y="220.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">캐시 히트 (옛 정책)</text><rect x="170" y="420" width="890" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="615.0" y="445.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">게이트: T3 &gt; T4 ?  아니오 → 통과.  C의 토큰 = { roles = 옛 권한, pv = T4 }  — 옛 권한이 새 pv를 달고 30분 굳는다</text><rect x="170" y="500" width="890" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="615.0" y="535.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 순서:  COMMIT → afterCommit ① 캐시 비우기 → ② 시각 기록 (T3')</text><text x="615.0" y="554.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 뒤의 캐시 적재는 전부 커밋된 새 정책.  pv &lt; T3' 인 토큰(B 포함)은 전부 낡음 → 재발급 때는 새 캐시.</text><path class="anim" d="M 300 120 L 350 120" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0640;0.1040;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0640;0.0690;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0640;1" path="M 300 120 L 350 120"/></circle><path class="anim" d="M 400 140 L 400 180" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.1040;0.1140;0.1520;0.1920;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.1040;0.1090;0.1520;0.1570;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1040;0.1520;1" path="M 400 140 L 400 180"/></circle><path class="anim" d="M 550 260 L 550 220" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.1920;0.2020;0.2720;0.3120;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.1920;0.1970;0.2720;0.2770;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1920;0.2720;1" path="M 550 260 L 550 220"/></circle><path class="anim" d="M 450 120 L 650 120" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.3120;0.3220;0.3920;0.4320;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.3120;0.3170;0.3920;0.3970;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3120;0.3920;1" path="M 450 120 L 650 120"/></circle><path class="anim" d="M 700 140 L 700 340" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.4320;0.4420;0.5120;0.5520;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.4320;0.4370;0.5120;0.5170;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4320;0.5120;1" path="M 700 140 L 700 340"/></circle><path class="anim" d="M 885 260 L 640 200" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.5520;0.5620;0.6480;0.8400;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.25s" repeatCount="indefinite" keyTimes="0;0.5520;0.5570;0.6480;0.6530;1" values="0;0;1;1;0;0"/><animateMotion dur="6.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5520;0.6480;1" path="M 885 260 L 640 200"/></circle></svg>