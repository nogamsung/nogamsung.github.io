<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스 API마다 인증 요청이 지나는 게이트가 account 서비스를 부른다 — 캐시가 비면 스레드가 응답을 기다린다</text><rect x="40" y="90" width="560" height="330" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스 API (×9, 각각 같은 구조)</text><rect x="70" y="130" width="150" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="145.0" y="149.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">인증 필터</text><text x="145.0" y="170.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">JWT 서명 검증</text><rect x="70" y="220" width="150" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="145.0" y="239.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">접근 판정 게이트</text><text x="145.0" y="260.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Caffeine 60s / 10s</text><rect x="70" y="310" width="150" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="145.0" y="340.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">업무 서비스</text><path d="M 145 190 L 145 220" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 145 280 L 145 310" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="300" y="125" width="270" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="435.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WebClient (.block())</text><text x="435.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">connect 3s · response 10s</text><path d="M 220 250 L 260 250 L 260 155 L 300 155" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="268" y="215" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">캐시 미스</text><rect x="300" y="290" width="270" height="60" rx="10" fill="#fffbeb"