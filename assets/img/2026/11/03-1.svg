ze="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">23:50:00 applyStockIoJob() 실행 → 재고 반영</text><path d="M 540 155 L 540 205" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"  /><text x="550" y="300" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">같은 날짜의 재고가 두 번 반영되고, 알림은 두 번 간다</text><rect x="160" y="350" width="760" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" /><text x="540.0" y="380.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">배포가 23:49 ~ 23:51 사이에 걸리면 생긴다 (겹치는 시간은 수십 초)</text><text x="550" y="455" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">@Scheduled는 인스턴스마다 따로 돈다 — 인스턴스가 둘이면 둘 다 실행한다</text><g class="anim"><line x1="0" y1="92" x2="0" y2="262" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="0" cy="92" r="6" fill="#dc2626"/><text x="0" y="78" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">23:50:00</text><animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.85;1" values="160 0;920 0;920 0"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.03;0.85;0.95;1" values="0;1;1;0;0"/></g></svg>