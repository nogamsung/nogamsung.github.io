<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OS가 캡처만 멈추면 상대는 정지 화면을 보고, 앱이 먼저 카메라를 끄면 상대는 아바타를 본다</text><text x="40" y="110" font-size="15" font-weight="800" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전</text><rect x="40" y="130" width="220" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="164.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iPhone 홈으로</text><text x="150.0" y="185.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">AppLifecycle: paused</text><rect x="320" y="130" width="240" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="440.0" y="156.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iOS가 캡처 강제 정지</text><text x="440.0" y="177.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">트랙은 publish 상태</text><text x="440.0" y="193.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">mute 신호 없음</text><rect x="620" y="130" width="200" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="720.0" y="164.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit SFU</text><text x="720.0" y="185.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">프레임이 안 올 뿐</text><rect x="880" y="130" width="180" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="970.0" y="164.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">상대 화면</text><text x="970.0" y="185.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">마지막 장면 정지</text><path d="M 260 175 L 320 175" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 560 175 L 620 175" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 820 175 L 880 175" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="40" y="270" font-size="15" font-weight="800" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 (iOS)</text><rect x="40" y="290" width="220" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="324.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iPhone 홈으로</text><text x="150.0" y="345.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">AppLifecycleListener</text><rect x="320" y="290" width="240" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="440.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">setCameraEnabled(false)</text><text x="440.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">앱이 먼저 끈다</text><text x="440.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">cameraEnabled 선택값은 유지</text><rect x="620" y="290" width="200" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="720.0" y="324.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit SFU</text><text x="720.0" y="345.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TrackMuted 이벤트</text><rect x="880" y="290" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="970.0" y="324.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">상대 화면</text><text x="970.0" y="345.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">아바타 타일</text><path d="M 260 335 L 320 335" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 560 335 L 620 335" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 820 335 L 880 335" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="40" y="410" width="1020" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="432.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">돌아오면(resumed) 백그라운드 때문에 끈 경우에만 다시 켠다 · 연결 중 백그라운드면 connect 직후 한 번 더 끈다</text><text x="550.0" y="451.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Android는 OS 통화 등록으로 FGS에 camera 타입이 붙어 백그라운드에서도 송출</text><path class="anim" d="M 260 175 L 320 175" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0600;0.1100;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0600;0.0650;1" values="0;