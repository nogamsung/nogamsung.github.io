t="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="366.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">http://kamal-proxy</text><text x="140.0" y="388.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">dev 서비스끼리</text><rect x="40" y="450" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="476.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">http://kamal-proxy-prd</text><text x="140.0" y="498.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">prd 서비스끼리 (별칭)</text><rect x="420" y="230" width="220" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="530.0" y="311.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">kamal-proxy</text><text x="530.0" y="333.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">127.0.0.1:11080</text><text x="530.0" y="352.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">모든 앱에 proxy.hosts</text><text x="530.0" y="371.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">명시 (빈 Host 없음)</text><rect x="760" y="90" width="300" height="210" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 6"/><text x="776" y="110" font-size="14" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle">dev</text><rect x="790" y="130" width="240" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="910.0" y="151.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">&lt;서비스&gt;-web-dev-&lt;7자&gt;</text><text x="910.0" y="173.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">hosts: dev.example.com · kamal-proxy</text><rect x="790" y="210" width="240" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="910.0" y="240.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">… 23개</text><rect x="760" y="330" width="300" height="210" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 6"/><text x="776" y="350" font-size="14" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle">prd</text><rect x="790" y="370" width="240" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" /><text x="910.0" y="391.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">&lt;서비스&gt;-web-prd-&lt;7자&gt;</text><text x="910.0" y="413.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">hosts: example.com · kamal-proxy-prd</text><rect x="790" y="450" width="240" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" /><text x="910.0" y="480.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">… 23개</text><path d="M 240 155 L 330 155 L 330 320 L 420 320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 240 265 L 330 265 L 330 320 L 420 320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"  /><path d="M 240 375 L 330 375 L 330 320 L 420 320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 240 485 L 330 485 L 330 320 L 420 320" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"  /><path d="M 640 290 L 700 290 L 700 160 L 790 160" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 640 350 L 700 350 L 700 400 L 790 400" fill="none" stroke="#d97706" stroke-width="