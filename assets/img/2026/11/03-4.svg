t-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">MGET user:, tenant:</text><rect x="660" y="120" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="760.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">컨트롤러</text><text x="760.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">200 OK</text><rect x="660" y="400" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="760.0" y="424.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account 재발급</text><text x="760.0" y="445.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">roles 재계산, 새 pv</text><rect x="920" y="400" width="150" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="995.0" y="424.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">관리자 콘솔</text><text x="995.0" y="445.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">권한 변경</text><path d="M 220 155 L 320 155" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="270.0" y="145.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 요청</text><path d="M 440 190 L 440 240" fill="none" stroke="#1f2937" strok