<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">토큰의 roles는 발급 시점 값이다 — 권한을 바꿔도 토큰이 만료될 때까지는 옛 권한이 통한다</text><text x="80" y="110" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">09:00</text><text x="1020" y="110" font-size="13" font-weight="700" fill="#6b7280" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">09:30</text><path d="M 80 130 L 1020 130" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><text x="550" y="150" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">← access 토큰 수명 30분 →</text><rect x="60" y="180" width="300" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="206.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">09:00 로그인</text><text x="210.0" y="227.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">access 토큰 발급</text><text x="210.0" y="243.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">roles = [A, B, C]  (발급 시점 값)</text><rect x="400" y="180" width="300" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="206.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">09:10 관리자가 권한 변경</text><text x="550.0" y="227.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DB: roles = [A]</text><text x="550.0" y="243.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(B, C 회수)</text><rect x="740" y="180" width="300" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="890.0" y="206.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">09:10 ~ 09:30 요청</text><text x="890.0" y="227.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스 필터는 토큰의 roles만 본다</text><text x="890.0" y="243.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">roles = [A, B, C] → 통과 ❌</text><path d="M 360 225 L 400 225" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 700 225 L 740 225" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="60" y="320" width="980" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="350" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스 API 9개는 account에 묻지 않고 서명만 검증한다 (stateless) — 빠르고 account 장애에 강하지만, 토큰 안의 권한은 갱신되지 않는다</text><rect x="60" y="410" width="470" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="295.0" y="434.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">지연 ① API</text><text x="295.0" y="455.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">회수한 권한이 30분간 통과, 부여한 권한이 30분간 403</text><rect x="570" y="410" width="470" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="805.0" y="434.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">지연 ② 화면</text><text x="805.0" y="455.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">사이드바가 session_claims 쿠키를 마운트 때 한 번만 읽는다</text><path class="anim" d="M 360 225 L 400 225" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1639;0.2459;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="3.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1639;0.1689;1" values="0;0;1;1;0;0"/><animateMotion dur="3.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1639;1" path="M 360 225 L 400 225"/></circle><path class="anim" d="M 700 225 L 740 225" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.05s" repeatCount="indefinite" keyTimes="0;0.2459;0.2559;0.4098;0.6721;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="3.05s" repeatCount="indefinite" keyTimes="0;0.2459;0.2509;0.4098;0.4148;1" values="0;0;1;1;0;0"/><animateMotion dur="3.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2459;0.4098;1" path="M 700 225 L 740 225"/></circle></svg>