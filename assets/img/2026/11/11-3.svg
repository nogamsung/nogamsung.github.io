<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">오디오 엔진은 CallKit이 세션을 활성화한 동안에만 돈다 — 세션의 주인은 CallKit 하나</text><text x="165" y="140" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CallKit</text><path d="M 180 140 L 1070 140" fill="none" stroke="#6b7280" stroke-width="1"/><text x="165" y="230" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">AVAudioSession</text><path d="M 180 230 L 1070 230" fill="none" stroke="#6b7280" stroke-width="1"/><text x="165" y="320" font-size="13" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit 오디오 엔진</text><path d="M 180 320 L 1070 320" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="195" y="292" width="150" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="270.0" y="302.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">앱 시작</text><text x="270.0" y="322.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">externalCallSystem</text><text x="270.0" y="337.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">engine: none</text><rect x="355" y="112" width="150" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="430.0" y="129.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">startCall</text><text x="430.0" y="149.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통화 등록</text><rect x="515" y="202" width="150" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="590.0" y="219.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">didActivate</text><text x="590.0" y="239.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">세션 활성</text><rect x="515" y="292" width="150" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="590.0" y="309.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">engine: default</text><text x="590.0" y="329.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">소리 남</text><rect x="715" y="202" width="150" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="790.0" y="219.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">다른 오디오 끼어듦</text><text x="790.0" y="239.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">세션 비활성 이벤트</text><rect x="715" y="292" width="150" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="790.0" y="309.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">무시</text><text x="790.0" y="329.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔진 켠 채로</text><rect x="910" y="112" width="150" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="985.0" y="129.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endCall</text><text x="985.0" y="149.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">didDeactivate</text><rect x="910" y="292" width="150" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="985.0" y="320.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">engine: none</text><path d="M 430 168 L 430 190 L 590 190 L 590 202" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 590 258 L 590 292" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 790 258 L 790 292" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-amber)"/><path d="M 985 168 L 985 292" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="40" y="395" width="500" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290.0" y="446.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">3초 대체 경로</text><text x="290.0" y="465.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">didActivate를 놓치면(앱이 깨어나기 전 등)</text><text x="290.0" y="484.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">3초 뒤 엔진을 직접 연다 — 무음 통화 방지</text><rect x="560" y="395" width="500" height="140" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="810.0" y="446.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통화 중 비활성화는 무시</text><text x="810.0" y="465.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">플러그인 3.1.6은 연결된 통화의 재활성화를</text><text x="810.0" y="484.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Dart에 알리지 않는다 → 여기서 끄면 끝까지 무음</text><path class="anim" d="M 430 168 L 430 190 L 590 190 L 590 202" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1075;0.1613;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1075;0.1125;1" values="0;0;1;1;0;0"/><animateMotion dur="4.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1075;1" path="M 430 168 L 430 190 L 590 190 L 590 202"/></circle><path class="anim" d="M 590 258 L 590 292" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.1613;0.1713;0.2473;0.3333;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.1613;0.1663;0.2473;0.2523;1" values="0;0;1;1;0;0"/><animateMotion dur="4.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1613;0.2473;1" path="M 590 258 L 590 292"/></circle><path class="anim" d="M 790 258 L 790 292" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.3333;0.3433;0.4194;0.5054;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.3333;0.3383;0.4194;0.4244;1" values="0;0;1;1;0;0"/><animateMotion dur="4.65s" repeatCount="indefinite" calcMode