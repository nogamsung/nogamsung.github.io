reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="s-fill" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="a-bluebg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="s-bluebg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="a-greenbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="s-greenbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="a-redbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="s-redbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="a-ambbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="s-ambbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="a-graybg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="s-graybg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="a-purbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker><marker id="s-purbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">HTTP가 아닌 SMTP(465) — HAProxy 뒤에 둘을 두고 한쪽씩 다시 띄운다</text><rect x="40" y="200" width="190" height="80" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="135.0" y="231.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">메일 프로그램</text><text x="135.0" y="253.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">앱 비밀번호로 465</text><rect x="330" y="190" width="230" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text x="445.0" y="231.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">HAProxy</text><text x="445.0" y="253.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">TCP 그대로 · TLS 안 풂</text><text x="445.0" y="272.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">send-proxy (원래 IP)</text><rect x="700" y="100" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="865.0" y="131.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">smtp-a</text><text x="865.0" y="153.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">PROXY 헤더 읽고 → TLS (직접 구현)</text><rect x="700" y="300" width="330" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="865.0" y="331.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">smtp-b</text><text x="865.0" y="353.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">같은 이미지 · SMTP만 켬</text><path d="M 230 240 L 330 240" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-line)"  /><rect x="256.88" y="217.0" width="46.24" height="22" rx="4" fill="#ffffff"/><text x="280.0" y="228.0" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">:465</text><path d="M 560 225 L 630 225 L 630 140 L 700 140" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 560 255 L 630 255 L 630 340 L 700 340" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><text x="865" y="240" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle">배포: a 재기동 → &quot;SMTP started&quot; 로그 확인 → b 재기동</text><text x="550" y="450" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">한쪽이 내려가 있는 동안 HAProxy가 다른 쪽으로 보낸다 — 포트가 닫히는 순간이 없다</text><path class="anim" d="M 230 240 L 330 240" fill="none" str