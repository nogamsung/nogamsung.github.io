<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit room과 트랙은 살아 있는데, 오디오 엘리먼트만 옛 컨테이너와 함께 문서에서 빠졌다</text><rect x="40" y="85" width="500" height="370" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="101" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전 — /chat → /download 이동</text><rect x="70" y="120" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="170.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Room · 원격 트랙</text><text x="170.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">모듈 레벨 · 살아 있음</text><rect x="70" y="240" width="200" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="170.0" y="276.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">옛 CallHost</text><text x="170.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">숨김 컨테이너</text><text x="170.0" y="313.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">└ &lt;audio&gt; (track.attach)</text><rect x="310" y="240" width="200" height="110" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="410.0" y="276.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">새 CallHost</text><text x="410.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">숨김 컨테이너</text><text x="410.0" y="313.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">└ (비어 있음)</text><path d="M 170 190 L 170 240" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="170.0" y="215.0" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TrackSubscribed 때 1회</text><text x="290" y="395" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">옛 컨테이너가 언마운트 → &lt;audio&gt;도 함께 제거</text><text x="290" y="420" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통화는 연결된 채 상대 소리만 끊김</text><rect x="560" y="85" width="500" height="370" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="574" y="101" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 — 트랙을 들고 있다가 다시 붙인다</text><rect x="590" y="120" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="690.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">remoteAudioTracks</text><text x="690.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Set&lt;RemoteAudioTrack&gt;</text><rect x="830" y="120" width="200" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="930.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">새 CallHost 마운트</text><text x="930.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">setLiveKitContainer(el)</text><rect x="700" y="240" width="230" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="815.0" y="276.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">setAudioContainer(el)</text><text x="815.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">track.detach() → remove</text><text x="815.0" y="313.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">el.appendChild(track.attach())</text><path d="M 690 190 L 690 215 L 760 215 L 760 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 930 190 L 930 215 L 870 215 L 870 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="810" y="395" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">자동 재생이 막히면(canPlaybackAudio=false)</text><text x="810" y="420" font-size="13" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">다음 pointerdown / keydown에 room.startAudio() 1회</text><rect x="40" y="470" width="1020" height="46" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="493.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">track.attach()로 만든 엘리먼트를 다시 마운트되는 컴포넌트의 DOM에 두면, 컴포넌트와 수명이 묶인다</text><path class="anim" d="M 170 190 L 170 240" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.30s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0930;0.1512;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.30s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0930;0.0980;1" values="0;0;1;1;0;0"/><animateMotion dur="4.30s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0930;1" path="M 170 190 L 170 240"/></circle><path class="anim" d="M 170 3