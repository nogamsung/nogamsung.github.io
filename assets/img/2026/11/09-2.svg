<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">COPY 뒤의 chown -R은 복사한 파일 전체를 새 레이어로 다시 쓴다 — 코드만 바뀌어도 145MB가 올라간다</text><rect x="40" y="90" width="490" height="330" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전 — RUN chown -R app:app /app</text><rect x="70" y="330" width="430" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="285.0" y="349.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dependencies 130.5MB</text><text x="285.0" y="370.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">그대로면 캐시 ✓</text><rect x="70" y="260" width="430" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="285.0" y="279.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">application 14.3MB</text><text x="285.0" y="300.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">코드가 바뀌면 새로</text><rect x="70" y="130" width="430" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="285.0" y="163.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown 레이어 144.9MB</text><text x="285.0" y="184.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">의존성 + 앱을 소유자만 바꿔 통째로 다시 씀</text><text x="285.0" y="200.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ 매 빌드 새 레이어 → 매번 push</text><text x="285.0" y="216.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스당 push 중앙 55초 (최대 117초)</text><rect x="570" y="90" width="490" height="330" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 — COPY --chown=app:app</text><rect x="600" y="330" width="430" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="815.0" y="349.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dependencies 130.5MB</text><text x="815.0" y="370.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">소유자 지정해 복사 · 그대로면 캐시 ✓</text><rect x="600" y="260" width="430" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="815.0" y="279.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">application 14.3MB</text><text x="815.0" y="300.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">코드가 바뀌면 이것만 push</text><rect x="600" y="130" width="430" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/><text x="815.0" y="163.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown 레이어 없음</text><text x="815.0" y="184.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">사용자를 먼저 만들고</text><text x="815.0" y="200.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WORKDIR 만 chown (빈 디렉터리)</text><text x="815.0" y="216.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스당 push 약 4초</text><rect x="40" y="440" width="1020" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="465.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BuildKit 캐시도 mode=max → mode=min: 빌드마다 달라 재사용 안 되는 extract 단계를 내보내느라 60초 → 11초</text><path class="anim" d="M 285 250 L 285 215" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.90s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1026;0.1667;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" d