<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">같은 이름의 쿠키 둘 — 브라우저는 둘 다 보내고, BFF 는 하나만 읽고, 401 이 반복된다</text><rect x="40" y="96" width="280" height="170" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="112" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브라우저 쿠키 저장소</text><rect x="55" y="126" width="250" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="180" y="146" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">refresh_token  (옛 토큰)</text><text x="180" y="164" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">Domain=.example.com</text><rect x="55" y="196" width="250" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="180" y="216" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">refresh_token  (새 토큰)</text><text x="180" y="234" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">Domain=svc-a.example.com</text><rect x="430" y="96" width="300" height="170" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="444" y="112" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BFF  app/api/account/auth/token</text><rect x="450" y="126" width="260" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="580.0" y="140.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RequestCookies</text><text x="580.0" y="160.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Map(name → value): 같은 이름은 하나만</text><rect x="450" y="196" width="260" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="580.0" y="212.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">getRefreshToken(req)</text><text x="580.0" y="232.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ 옛 토큰이 읽힘</text><rect x="820" y="126" width="240" height="124" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="940.0" y="169.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Account API</text><text x="940.0" y="190.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">POST /auth/token</text><text x="940.0" y="206.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">옛 토큰 → 401</text><path d="M 320 181 L 430 181" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="375" y="138" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">Cookie:</text><text x="375" y="151" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">refresh_token=옛;</text><text x="375" y="164" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">refresh_token=새</text><path d="M 580 176 L 580 196" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 710 223 L 820 223" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="765.0" y="215.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Bearer 옛 토큰</text><path d="M 940 250 L 940 300 L 190 300 L 190 266" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="565.0" y="314.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">401 TOKEN_UNAUTHENTICATED — 호스트 쿠키만 지움, apex 쿠키는 남음 → 다음 요청이 같은 길</text><text x="565" y="320" font-size="1" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"></text><rect x="40" y="350" width="1020" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="372" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RFC 6265: 쿠키의 식별자는 (이름, 도메인, 경로) — Domain 이 다르면 다른 쿠키라 공존하고 둘 다 전송된다</text><text x="550" y="394" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Next.js RequestCookies: 이름으로만 키잉된 Map — 둘 중 하나만 읽힌다. 어느 쪽인지는 브라우저의 헤더 순서에 달렸다</text><rect x="40" y="430" width="1020" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550" y="456" font-size="13" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정(#374): 토큰 쿠키를 쓰는 모든 응답에 옛 apex 쿠키를 만료시키는 Set-Cookie 를 함께 보낸다</text><text x="550" y="482" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">Set-Cookie: refresh_token=; Domain=.example.com; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT</text><text x="550" y="508" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ 한 번의 로그인·재발급·로그아웃 뒤 옛 쿠키가 사라진다. 그런데 이 "함께 보낸다"가 다음 사고를 불렀다 (그림 2)</text><path class="anim" d="M 320 181 L 430 181" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1481;0.2099;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1481;0.1531;1" values="0;0;1;1;0;0"/><animateMotion dur="4.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1481;1" path="M 320 181 L 430 181"/></circle><path class="anim" d="M 580 176 L 580 196" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.2099;0.2199;0.2840;0.3457;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.2099;0.2149;0.2840;0.2890;1" values="0;0;1;1;0;0"/><animateMotion dur="4.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2099;0.2840;1" path="M 580 176 L 580 196"/></circle><path class="anim" d="M 710 223 L 820 223" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.3457;0.3557;0.4691;0.5309;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.3457;0.3507;0.4691;0.4741;1" values="0;0;1;1;0;0"/><animateMotion dur="4.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3457;0.4691;1" path="M 710 223 L 820 223"/></circle><path class="anim" d="M 940 250 L 940 300 L 190 300 L 190 266" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.5309;0.5409;0.8272;0.9259;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.5309;0.5359;0.8272;0.8322;1" values="0;0;1;1;0;0"/><animateMotion dur="4.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5309;0.8272;1" path="M 940 250 L 940 300 L 190 300 L 190 266"/></circle></svg>