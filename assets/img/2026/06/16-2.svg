<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ResponseCookies 의 Map 은 이름 하나에 슬롯 하나 — 두 번째 set 이 방금 발급한 토큰을 덮어쓴다</text><rect x="40" y="86" width="1020" height="250" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전 (#384): res.cookies.set 두 번</text><rect x="60" y="120" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="210.0" y="139.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① res.cookies.set("access_token", 토큰,</text><text x="210.0" y="159.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ domain: "svc-a-dev.example.com" })</text><rect x="60" y="200" width="300" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="210.0" y="219.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② res.cookies.set("access_token", "",</text><text x="210.0" y="239.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ domain: ".example.com", expires: 0 })</text><rect x="440" y="120" width="240" height="140" rx="14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="454" y="136" font-size="13" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">_parsed: Map</text><rect x="460" y="160" width="200" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/><text x="560" y="185" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token → 토큰</text><rect x="460" y="210" width="200" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="560" y="235" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token → ""</text><text x="560" y="150" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">키 = 이름</text><rect x="760" y="120" width="280" height="140" rx="14" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/><text x="774" y="136" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Set-Cookie 헤더 (전선)</text><text x="900" y="170" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">replace(): headers.delete("set-cookie")</text><text x="900" y="190" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ Map 에서 다시 쓴다</text><rect x="780" y="205" width="240" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="900" y="230" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token=; Domain=.example.com</text><path d="M 360 150 L 440 180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 360 230 L 440 230" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 680 190 L 760 190" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="560" y="300" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">로그인 200, 백엔드는 토큰을 발급했지만 브라우저에 닿은 Set-Cookie 는 만료된 apex 쿠키 하나 — Domain 이 달라도 슬롯은 하나다</text><text x="560" y="322" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">먼저 붙여 둔 원시 Set-Cookie 헤더도 replace() 의 delete 에 함께 지워진다</text><rect x="40" y="356" width="1020" height="260" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="372" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 (#389): 두 번째 쿠키는 Map 을 거치지 않는다</text><rect x="60" y="390" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="210.0" y="409.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① res.cookies.set("access_token", 토큰,</text><text x="210.0" y="429.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ domain: "svc-a-dev.example.com" })</text><rect x="60" y="470" width="300" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="489.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② res.headers.append("set-cookie",</text><text x="210.0" y="509.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"access_token=; Domain=.example.com; Expires=…")</text><rect x="440" y="384" width="240" height="66" rx="14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="454" y="400" font-size="13" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">_parsed: Map</text><rect x="460" y="418" width="200" height="26" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="560" y="435" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token → 토큰</text><rect x="760" y="390" width="280" height="140" rx="14" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/><text x="774" y="406" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Set-Cookie 헤더 (전선)</text><rect x="780" y="430" width="240" height="36" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="900" y="453" font-size="10" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token=토큰; Domain=svc-a-dev…</text><rect x="780" y="476" width="240" height="36" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="900" y="499" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">access_token=; Domain=.example.com</text><path d="M 360 420 L 440 420" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 680 420 L 760 448" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 360 500 L 720 500 L 780 494" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="540.0" y="514.0" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Map 우회, 원시 헤더로 직접</text><text x="550" y="566" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">순서가 중요하다: append 는 마지막 cookies.set 뒤에. 그 뒤에 cookies.set 이 한 번이라도 더 오면 replace() 가 원시 헤더를 지운다</text><text x="550" y="592" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">테스트도 바꿨다: res.cookies.set 을 jest.fn() 으로 모킹하면 Map 을 흉내 내지 못한다 → 실제 NextResponse + headers.getSetCookie() 로 검증</text><path class="anim" d="M 360 150 L 440 180" fill="none" stroke="#059669" stroke-width="5" str