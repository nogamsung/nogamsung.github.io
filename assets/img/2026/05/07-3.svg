<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">API 계약 한 소스 — Kotlin 컨트롤러에서 TypeScript 타입까지, CI 가 양쪽을 다시 만들어 비교한다</text><rect x="60" y="110" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Kotlin 컨트롤러 · DTO</text><text x="210.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">backend/</text><rect x="400" y="110" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">./gradlew generateOpenApi</text><text x="550.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">springdoc, H2 프로파일로 앱 기동</text><path d="M 360 145 L 400 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="740" y="110" width="300" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="890.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">backend/openapi/*.json</text><text x="890.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">모듈 4개</text><path d="M 700 145 L 740 145" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="60" y="230" width="300" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="210.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">정규화</text><text x="210.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">description 합치기 · 키 정렬 (내일)</text><rect x="400" y="230" width="300" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="550.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">openapi-typescript</text><text x="550.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">npm run gen:api</text><path d="M 360 265 L 400 265" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="740" y="230" width="300" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="890.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">frontend/types/api/*.gen.ts</text><text x="890.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">프론트엔드가 import</text><path d="M 700 265 L 740 265" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 1020 180 L 1020 200 L 210 200 L 210 230" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="60" y="360" width="1000" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="560.0" y="379.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CI api-contract.yml — PR 마다 양쪽을 다시 생성해 커밋된 산출물과 git diff --exit-code</text><text x="560.0" y="399.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">한쪽만 커밋된 PR 은 실패한다. 에이전트가 컨트롤러를 고치면 타입 재생성까지가 한 작업</text><text x="550" y="460" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">하루 만에 드러난 비용: springdoc 출력이 비결정적 — 같은 코드에서 키 순서가 바뀌어 거짓 diff</text><text x="550" y="486" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">합친 본질적 이유 — 백엔드 컨트롤러 변경이 프론트엔드 타입에 즉시 반영되도록 강제</text><path class="anim" d="M 360 145 L 400 145" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" rep