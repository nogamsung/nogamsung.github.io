<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"프레임이 오면 +1" 이 틀리는 세 가지 방식 — 초깃값 없음, 두 토픽 팬아웃, 좀비 소켓</text><rect x="40" y="86" width="330" height="440" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 콜드 로드 (06-16)</text><rect x="385" y="86" width="330" height="440" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="399" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② DM 두 토픽 (07-24)</text><rect x="730" y="86" width="330" height="440" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="744" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ 메일 좀비 소켓 (07-28)</text><rect x="60" y="130" width="130" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="125.0" y="154.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버 DB</text><text x="125.0" y="174.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">안읽음 5</text><rect x="240" y="130" width="110" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="295.0" y="154.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">counts</text><text x="295.0" y="174.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{}  → 0</text><path d="M 190 165 L 240 165" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-muted)"/><text x="215.0" y="157.0" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">집계 API 없음 ✕</text><rect x="60" y="230" width="290" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="205.0" y="272.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">배지는 "이 세션에서 받은 프레임 수".</text><text x="205.0" y="290.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">새로고침하면 0. 다른 기기에서 읽어도</text><text x="205.0" y="308.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">줄지 않는다. 알고 넘어간 한계.</text><text x="205" y="400" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">필요한 것: 서버가 세는 숫자</text><rect x="405" y="130" width="130" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="470.0" y="144.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버</text><text x="470.0" y="164.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DM 메시지 1건</text><rect x="585" y="110" width="110" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="640.0" y="130.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/topic/dm.7</text><rect x="585" y="170" width="110" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="640.0" y="190.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/topic/user.42</text><path d="M 535 150 L 585 130" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 535 160 L 585 190" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="425" y="250" width="270" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="560.0" y="269.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">increment("dm:7")  ×2</text><text x="560.0" y="289.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">메시지 id 를 모른다 → dedup 불가</text><path d="M 695 130 L 712 130 L 712 262 L 695 262" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 620 210 L 620 250" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="425" y="330" width="270" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="560.0" y="352.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">배지 2  (말풍선은 id dedup 으로 1개)</text><rect x="405" y="400" width="290" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550.0" y="441.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정: user 이벤트는 "아직 목록에 없는 신규</text><text x="550.0" y="459.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DM 방"만 센다. 기존 방은 dm 토픽에 맡긴다.</text><rect x="750" y="130" width="130" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="815.0" y="144.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브로커</text><text x="815.0" y="164.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NEW_MAIL 1프레임</text><rect x="930" y="110" width="110" height="36" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="985.0" y="128.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">클라이언트 B</text><rect x="930" y="156" width="110" height="36" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="985.0" y="174.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A (좀비)</text><rect x="930" y="202" width="110" height="36" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="985.0" y="220.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A′ (좀비)</text><path d="M 880 155 L 930 128" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 880 155 L 930 174" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 880 155 L 930 220" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="770" y="260" width="270" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="905.0" y="279.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">incrementUnread()  ×(1 + 좀비 수)</text><text x="905.0" y="299.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">resetUnread 호출 운영 코드 0건</text><path d="M 985 238 L 985 260" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="770" y="340" width="270" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="905.0" y="362.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">실제 1통 → 배지 4</text><rect x="750" y="400" width="290" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="895.0" y="432.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">StrictMode 를 의심했지만 결백.</text><text x="895.0" y="450.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">진짜 중복: 가드 없는 재연결 → 좀비 소켓.</text><text x="895.0" y="468.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결론: 카운터 삭제, 서버 집계로.</text><rect x="40" y="546" width="1020" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="566" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">공통 뿌리: "이벤트 도착 횟수"를 "읽지 않은 개수"로 착각했다</text><text x="550" y="586" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">숫자는 서버가 세고, 실시간 이벤트는 "다시 물어보라"는 신호일 뿐이어야 한다</text><path class="anim" d="M 535 150 L 585 130" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0602;0.0977;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attribute