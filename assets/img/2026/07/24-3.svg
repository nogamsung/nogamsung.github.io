<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">첫 입장 레이스 — 직결 WebSocket 의 CONNECTED 가 BFF 경유 REST 보다 먼저 와서 빈 스토어에 쓰이고 사라진다</text><text x="60" y="120" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WS</text><text x="60" y="240" font-size="14" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">REST</text><path d="M 130 130 L 330 130" fill="none" stroke="#2563eb" stroke-width="6"/><text x="230" y="92" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브라우저 → 백엔드 직결 1홉, JWT 서명만 검증</text><rect x="330" y="100" width="150" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="405.0" y="117.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECTED</text><text x="405.0" y="137.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">setConnectionStatus()</text><rect x="540" y="100" width="230" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="655.0" y="117.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">conversations: {}</text><text x="655.0" y="137.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔트리 없음 → 순회할 게 없음</text><text x="800" y="134" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✕ 유실 (no-op)</text><path d="M 480 128 L 540 128" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 130 250 L 640 250" fill="none" stroke="#d97706" stroke-width="6"/><text x="385" y="238" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브라우저 → BFF 라우트 → 백엔드 → DB (30건 + 멘션·첨부·반응 조립) → BFF → 브라우저</text><rect x="640" y="220" width="170" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="725.0" y="237.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">mergeHistory()</text><text x="725.0" y="257.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔트리 생성</text><rect x="850" y="220" width="210" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="955.0" y="237.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">connectionStatus:</text><text x="955.0" y="257.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"DISCONNECTED" (기본값)</text><path d="M 810 248 L 850 248" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="550" y="310" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">연결은 이미 CONNECTED 라 상태 이벤트는 다시 오지 않는다 → 배너 고착 + 입력창 disabled. 방을 옮기면 REST 가 빨라져(워밍) 순서가 뒤집히므로 "처음 들어왔을 때만"</text><rect x="40" y="340" width="500" height="230" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="356" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전: 연결 상태가 대화별 엔트리 안에</text><text x="290" y="380" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">conversations: {</text><text x="290" y="402" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">  "dm:7": { messages, readState,</text><text x="290" y="424" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">            connectionStatus }   ← 리소스별 복제</text><text x="290" y="446" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">}</text><text x="290" y="468" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">setConnectionStatus: 기존 엔트리만 순회</text><text x="290" y="520" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔트리 생성 vs 상태 이벤트 도착의 순서 레이스</text><rect x="580" y="340" width="480" height="230" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="594" y="356" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 (#753): 스토어 최상위 필드</text><text x="820" y="380" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">conversations: { "dm:7": { messages, readState } }</text><text x="820" y="402" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">connectionStatus: "CONNECTED"   ← 클라이언트 단위</text><text x="820" y="424" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace"></text><text x="820" y="446" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">setConnectionStatus: (s) =&gt; set({ connectionStatus: s })</text><text x="820" y="468" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">useMessageStore((s) =&gt; s.connectionStatus)</text><text x="820" y="520" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔트리가 있든 없든 기록된다 → 레이스 소멸</text><path class="anim" d="M 130 130 L 330 130" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1500;0.1500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1500;0.1550;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1500;1" path="M 130 130 L 330 130"/></circle><path class="anim" d="M 480 128 L 540 128" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.1500;0.1600;0.2250;0.7500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.1500;0.1550;0.2250;0.2300;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1500;0.2250;1" path="M 480 128 L 540 128"/></circle><path class="anim" d="M 130 250 L 640 250" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.5500;0.5500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.5500;0.5550;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.5500;1" path="M 130 250 L 640 250"/></circle><path class="anim" d="M 810 248 L 850 248" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.5500;0.5600;0.6250;0.7500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.5500;0.5550;0.6250;0.6300;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5500;0.6250;1" path="M 810 248 L 850 248"/></circle></svg>