lues="0;0;1;1;0;0"/><animateMotion dur="8.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6592;0.7151;1" path="M 830 490 L 170 490"/></circle><path class="anim" d="M 170 525 L 830 525" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.7430;0.7530;0.7989;0.8883;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.7430;0.7480;0.7989;0.8039;1" values="0;0;1;1;0;0"/><animateMotion dur="8.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7430;0.7989;1" path="M 170 525 L 830 525"/></circle></svg>