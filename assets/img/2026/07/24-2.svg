<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">STOMP 하트비트는 협상제 — 서버가 0,0 을 광고하면 클라이언트 설정은 무효가 된다</text><rect x="60" y="86" width="220" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="170.0" y="100.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브라우저 (stompjs)</text><text x="170.0" y="120.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">heartbeat 기본 10000,10000</text><path d="M 170 136 L 170 570" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="390" y="86" width="220" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="500.0" y="100.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">프록시</text><text x="500.0" y="120.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">idle 타임아웃 ≈ 60초</text><path d="M 500 136 L 500 570" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="720" y="86" width="220" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="830.0" y="100.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Spring SimpleBroker</text><text x="830.0" y="120.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TaskScheduler 없음</text><path d="M 830 136 L 830 570" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><text x="60" y="170" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전</text><path d="M 170 180 L 830 180" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="500.0" y="172.0" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECT  heart-beat:10000,10000</text><path d="M 830 215 L 170 215" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="500.0" y="207.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECTED  heart-beat:0,0   ← 서버값이 0 이면 그 방향은 없음</text><rect x="70" y="240" width="200" height="40" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="170" y="265" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pinger ✕   ponger ✕</text><text x="500" y="262" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">… 60초 동안 바이트 0 …</text><path d="M 500 300 L 170 300" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="335.0" y="292.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">FIN (idle) → onWebSocketClose → 배너 → 재연결 → 다시 idle …</text><path d="M 60 335 L 940 335" fill="none" stroke="#6b7280" stroke-width="1"/><text x="60" y="365" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 (#471)</text><path d="M 170 380 L 830 380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="500.0" y="372.0" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECT  heart-beat:25000,25000</text><path d="M 830 415 L 170 415" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="500.0" y="407.0" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECTED  heart-beat:25000,25000   → 양방향 max(25000, 25000) = 25초</text><path d="M 170 455 L 830 455" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6 5"/><text x="650" y="449" font-size="10" font-weight="600" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">25초 · LF ●  (양방향)  — 프록시 타이머 리셋</text><path d="M 170 490 L 830 490" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6 5"/><text x="650" y="484" font-size="10" font-weight="600" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">25초 · LF ●  (양방향)  — 프록시 타이머 리셋</text><path d="M 170 525 L 830 525" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6 5"/><text x="650" y="519" font-size="10" font-weight="600" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">25초 · LF ●  (양방향)  — 프록시 타이머 리셋</text><rect x="40" y="560" width="1020" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550" y="580" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Spring: setHeartbeatValue(longArrayOf(25_000, 25_000)) 와 setTaskScheduler(ThreadPoolTaskScheduler) 둘 다 필요 — 하나만 넣으면 기동 시 Assert</text><text x="550" y="600" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">stompjs: heartbeatOutgoing≠0 &amp;&amp; serverIncoming≠0 일 때만 PING, heartbeatIncoming≠0 &amp;&amp; serverOutgoing≠0 일 때만 PONG 감시</text><path class="anim" d="M 170 180 L 830 180" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0782;0.1061;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0782;0.0832;1" values="0;0;1;1;0;0"/><animateMotion dur="8.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0782;1" path="M 170 180 L 830 180"/></circle><path class="anim" d="M 830 215 L 170 215" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.1061;0.1161;0.1844;0.2514;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.1061;0.1111;0.1844;0.1894;1" values="0;0;1;1;0;0"/><animateMotion dur="8.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1061;0.1844;1" path="M 830 215 L 170 215"/></circle><path class="anim" d="M 500 300 L 170 300" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.2514;0.2614;0.3073;0.3631;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.2514;0.2564;0.3073;0.3123;1" values="0;0;1;1;0;0"/><animateMotion dur="8.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2514;0.3073;1" path="M 500 300 L 170 300"/></circle><path class="anim" d="M 170 380 L 830 380" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.3631;0.3731;0.4413;0.4693;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.95s" repeatCount="indefinite" keyTimes="0;0.3631;0.3681;0.4413;0.4463;1" values="0;0;1;1;0;0"/><animateMot