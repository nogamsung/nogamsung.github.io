<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">재연결 플래핑 — deactivate() 가 onWebSocketClose 를 다시 부르고, onConnect 가 횟수를 0 으로 되돌린다</text><rect x="40" y="86" width="300" height="300" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">stompjs ActivationState</text><rect x="90" y="120" width="200" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190.0" y="135.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ACTIVE</text><text x="190.0" y="155.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">activate() 뒤. 소켓 끊김으로는 안 바뀜</text><rect x="90" y="210" width="200" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="190.0" y="225.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEACTIVATING</text><text x="190.0" y="245.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate() 호출 직후</text><rect x="90" y="300" width="200" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="190.0" y="315.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">INACTIVE</text><text x="190.0" y="335.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">소켓 닫힘 확인 뒤</text><path d="M 190 170 L 190 210" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="190.0" y="186.0" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate()</text><path d="M 190 260 L 190 300" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 290 325 L 320 325 L 320 145 L 290 145" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="320.0" y="231.0" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">activate()</text><text x="190" y="372" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">client.active === (state === ACTIVE)</text><rect x="400" y="110" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="490.0" y="138.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">네트워크 끊김 ✕</text><rect x="640" y="110" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="740.0" y="127.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onWebSocketClose</text><text x="740.0" y="147.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt 0 → 1, 배너 ON</text><rect x="900" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="980.0" y="138.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">1초 타이머</text><rect x="900" y="230" width="160" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="980.0" y="247.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate()</text><text x="980.0" y="267.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ACTIVE → DEACTIVATING</text><rect x="640" y="230" width="200" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="740.0" y="247.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onWebSocketClose (다시)</text><text x="740.0" y="267.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt 1 → 2, 타이머 또</text><rect x="900" y="350" width="160" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="980.0" y="378.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">activate()</text><rect x="640" y="350" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="740.0" y="367.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onConnect</text><text x="740.0" y="387.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt = 0  ← 상한이 영원히 안 찬다</text><path d="M 580 138 L 640 138" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 840 138 L 900 138" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 980 166 L 980 230" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 900 258 L 840 258" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="870" y="306" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">앱 콜백을 보존해 그대로 호출</text><path d="M 980 286 L 980 350" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="980.0" y="314.0" font-size="10" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.then(() =&gt; activate())</text><path d="M 900 378 L 840 378" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 740 406 L 740 440 L 490 440 L 490 166" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="615.0" y="454.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">다음 끊김 → 처음부터</text><rect x="400" y="480" width="660" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="730" y="506" font-size="13" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정(#349): onWebSocketClose 입구와 타이머 본문에  if (!client.active) return;</text><text x="730" y="530" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate 중이면 state 가 DEACTIVATING → active=false → 재연결 안 함. 네트워크 끊김이면 ACTIVE 유지 → 한 번만 재연결</text><text x="730" y="554" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">언마운트의 deactivate 도 같은 길이라 좀비 소켓까지 함께 사라졌다</text><path class="anim" d="M 580 138 L 640 138" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0721;0.1171;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0721;0.0771;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0721;1" path="M 580 138 L 640 138"/></circle><path class="anim" d="M 840 138 L 900 138" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.1171;0.1271;0.1712;0.2162;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.1171;0.1221;0.1712;0.1762;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1171;0.1712;1" path="M 840 138 L 900 138"/></circle><path class="anim" d="M 980 166 L 980 230" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.2162;0.2262;0.2883;0.3333;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.2162;0.2212;0.2883;0.2933;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2162;0.2883;1" path="M 980 166 L 980 230"/></circle><path class="anim" d="M 900 258 L 840 258" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.3333;0.3433;0.4054;0.4775;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefini