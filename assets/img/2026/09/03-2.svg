<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">webhook이 먼저 참가자를 LEFT로 바꾸면, 뒤이어 온 REST leave가 "이미 LEFT"라며 조기 반환해 종료 판정과 CALL_ENDED 방송을 건너뛴다</text><rect x="65" y="80" width="170" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수신자 B 브라우저</text><path d="M 150 124 L 150 600" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="315" y="80" width="170" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="400.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit</text><path d="M 400 124 L 400 600" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="565" y="80" width="170" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="650.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">메신저 API</text><path d="M 650 124 L 650 600" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="865" y="80" width="170" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="950.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">발신자 A</text><path d="M 950 124 L 950 600" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><text x="60" y="150" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전</text><path d="M 150 170 L 400 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="275.0" y="160.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① LiveKit disconnect</text><path d="M 400 205 L 650 205" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="525.0" y="195.0" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② webhook participant_left(B)</text><text x="760" y="225" font-size="11" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B.state = LEFT  (종료 판정 없음)</text><path d="M 150 250 L 650 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="400.0" y="240.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ POST /calls/{id}/leave</text><text x="760" y="270" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">state == LEFT → return  (1ms)</text><path d="M 650 300 L 950 300" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="800.0" y="290.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CALL_ENDED 없음</text><rect x="760" y="320" width="280" height="36" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="900.0" y="338.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A 화면 통화 중 · 유령 배너 · 409</text><text x="60" y="390" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후</text><path d="M 150 410 L 400 410" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="275.0" y="400.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① disconnect</text><path d="M 400 445 L 650 445" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="525.0" y="435.0" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② participant_left(B)</text><text x="760" y="465" font-size="11" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LEFT 전이 → settleIfNoLongerViable → joined ≤ 1 → ENDED</text><path d="M 650 495 L 950 495" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="800.0" y="485.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CALL_ENDED</text><path d="M 150 540 L 650 540" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="400.0" y="530.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ POST /leave</text><text x="760" y="560" font-size="11" font-weight="600" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">settleIfNoLongerViable → isFinished() → return  (멱등)</text><path class="anim" d="M 150 170 L 400 170" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="8.35s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0479;0.0778;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="8.35s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0479;0.0529;1" values="0;0;1;1;0;0"/><animateMotion dur="8.35s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0479;1" path="M 150 170 L 400 170"/></circle><path class="anim" d="M 400 205 L 650 205" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attrib