<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">회전 뒤 60초가 지나 옛 토큰을 든 다른 보유자가 재발급을 요청하면 "탈취"로 판정되어 전 세션이 폐기된다</text><rect x="80" y="80" width="160" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">웹앱 D 미들웨어</text><path d="M 160 124 L 160 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="340" y="80" width="160" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="420.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">웹앱 B 미들웨어</text><path d="M 420 124 L 420 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="620" y="80" width="160" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="700.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account 서비스</text><path d="M 700 124 L 700 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="880" y="80" width="160" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="960.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redis 원장</text><path d="M 960 124 L 960 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><path d="M 160 170 L 700 170" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="430.0" y="160.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 30분 뒤 /auth/token (A)</text><path d="M 700 200 L 960 200" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="190.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEL active:A = 1 (승자)</text><path d="M 960 230 L 700 230" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="242.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">새 jti B 등록, rotated:A = DONE(B)  TTL 60s</text><path d="M 700 260 L 160 260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="430.0" y="272.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② 새 쌍 (refresh = B) — 웹앱 D 쿠키만 B</text><rect x="80" y="300" width="940" height="36" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="318.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">… 61초 뒤. 사용자가 이제야 웹앱 B 탭을 연다. 쿠키의 refresh 는 여전히 A …</text><path d="M 420 370 L 700 370" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="560.0" y="360.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ /auth/token (A)</text><path d="M 700 400 L 960 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="390.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEL active:A = 0, GET rotated:A = nil (TTL 만료)</text><path d="M 960 440 L 700 440" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="830.0" y="457.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ "재사용 = 탈취" → revokeAll: active:B 삭제, rotated:A = REVOKED</text><path d="M 700 480 L 420 480" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="560.0" y="470.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">401</text><path d="M 700 520 L 160 520" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="430.0" y="532.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤ 다음 재발급(B)도 401 — 여섯 곳 모두 로그아웃</text><rect x="80" y="575" width="940" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="550.0" y="600.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">탈취로 보이는 것은 사실 내가 심어 둔 사본이었다 — 동시 탭 경합(60초 유예)은 잘 처리했지만, 시차가 상한 없는 독립 보유자는 상정 밖이었다</text><path class="anim" d="M 160 170 L 700 170" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0656;0.0929;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0656;0.0706;1" values="0;0;1;1;0;0"/><animateMotion dur="9.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0656;1" path="M 160 170 L 700 170"/></circle><path class="anim" d="M 700 200 L 960 200" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0929;0.1029;0.1366;0.1639;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0929;0.0979;0.1366;0.1416;1" values="0;0;1;1;0;0"/><animateMotion dur="9.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0929;0.1366;1" path="M 700 200 L 960 2