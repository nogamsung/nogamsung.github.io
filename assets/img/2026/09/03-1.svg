<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">백엔드는 통화 수명주기만 관리한다 — 미디어는 LiveKit, 신호는 STOMP와 푸시, 정산은 webhook</text><rect x="40" y="120" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="139.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">웹 · 앱 · 데스크톱</text><text x="115.0" y="160.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">클라이언트</text><rect x="380" y="110" width="260" height="80" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="510.0" y="131.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">메신저 API (CallService)</text><text x="510.0" y="152.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">통화 생성·수락·거절·leave</text><text x="510.0" y="168.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">상태기계 · 정산</text><rect x="380" y="300" width="260" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="510.0" y="321.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LiveKit SFU (자체 호스팅)</text><text x="510.0" y="342.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WebRTC · TURN 내장</text><text x="510.0" y="358.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">방·참가자 관리</text><rect x="800" y="110" width="240" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="920.0" y="129.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redis pub/sub</text><text x="920.0" y="150.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">STOMP 팬아웃 (다중 인스턴스)</text><rect x="800" y="210" width="240" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="920.0" y="229.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">푸시 (FCM / APNs VoIP)</text><text x="920.0" y="250.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">백그라운드 착신</text><rect x="800" y="310" width="240" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="920.0" y="329.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">MySQL</text><text x="920.0" y="350.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">call_session · call_participant</text><path d="M 190 140 L 380 140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="285.0" y="130.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① REST POST /calls, /join, /leave</text><path d="M 380 165 L 190 165" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="285.0" y="177.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② STOMP /topic/user.{id} CALL_*</text><path d="M 640 140 L 800 140" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/><path d="M 640 160 L 800 240" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#a-amber)"/><text x="720.0" y="190.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③</text><path d="M 640 180 L 680 180 L 680 340 L 800 340" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a-muted)"/><path d="M 510 190 L 510 300" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="498" y="245" font-size="11" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">토큰 서명 · createRoom / deleteRoom</text><path d="M 540 300 L 540 190" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="700" y="286" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">webhook (LiveKit 서명 JWT)</text><text x="700" y="302" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">participant_joined / left · room_finished</text><path d="M 190 180 L 115 180 L 115 340 L 380 340" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="115.0" y="250.0" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ WebRTC 미디어 (UDP/TCP)</text><rect x="40" y="430" width="1020" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="450.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">토큰은 서버만 서명 (identity = userId, 방 고정, TTL 1h).  신호는 기존 유저 토픽에 CALL_* 타입을 additive 로 추가.</text><text x="550.0" y="469.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">정산의 진실은 webhook — REST leave 는 안 올 수도 있다 (탭 강제 종료·앱 크래시).</text><rect x="40" y="510" width="1020" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550.0" y="535.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RINGING ─(join)→ ACTIVE ─(leave, 남은 참가자 ≤ 1)→ ENDED   |   (decline 1:1)→ DECLINED   |   (45초 무응답)→ MISSED</text><path class="anim" d="M 190 140 L 380 140" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0752;0.1128;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0752;0.0802;1" values="0;0;1;1;0;0"/><animateMotion dur="6.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0752;1" path="M 190 140 L 380 140"/></circle><path class="anim" d="M 640 140 L 800 140" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.65s" repeatCount="indefinite" keyTimes="0;0.1128;0.1228;0.1729;0.2105;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.65s" repeatCount="indefinite" keyTimes="0;0.1128;0.1178;0.1729;0.1779;1" values="0;0;1;1;0;0"/><animateMotion dur="6.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1128;0.1729;1" path="M 640 140 L 800 140"/></circle><path class="anim" d="M 640 160 L 800 240" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate 