" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">없음 → 경고 없이 기본값</text><rect x="820" y="252" width="220" height="36" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="930.0" y="270.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">basePath = ""</text><rect x="820" y="298" width="220" height="36" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="930.0" y="316.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">images.remotePatterns = []</text><rect x="820" y="344" width="220" height="24" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="930" y="360" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">loadConfig: findUp → 기본값</text><path d="M 740 150 L 820 145" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 740 210 L 820 210" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><rect x="40" y="400" width="500" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="427.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 08-27  이미지 400</text><text x="290.0" y="447.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">remotePatterns 기본값 → /_next/image 가 외부 URL 거부</text><text x="290.0" y="462.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">설정은 required-server-files 에 있었지만 거기서 읽지 않는다</text><rect x="560" y="400" width="500" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="810.0" y="427.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② 10-02  /admin/* 전부 404</text><text x="810.0" y="447.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">redirects(매니페스트)는 살아 /health → 307 → /admin/health</text><text x="810.0" y="462.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">basePath(설정) 는 없어 404. 리다이렉트만 동작하는 반쪽 상태</text><rect x="40" y="510" width="1020" height="100" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="550" y="536" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">추기 (11-04): output: "standalone" — 설정이 server.js 안에 직렬화되어 __NEXT_PRIVATE_STANDALONE_CONFIG 로 들어간다</text><text x="550" y="560" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">loadConfig() 는 파일을 찾지 않고 그 값을 쓴다 → 런타임에 설정 파일도, pnpm 도, TypeScript 도 필요 없음</text><text x="550" y="584" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">이미지 1~1.6GB → 약 300MB (339 / 312 / 310MB 로컬 측정)</text><path class="anim" d="M 210 155 L 270 155" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.45s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0734;0.1193;1" valu