<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">루트가 빌드하고 node 가 실행한다 — $HOME 캐시와 디렉터리 소유권이 USER 경계를 넘지 못한다</text><rect x="40" y="86" width="500" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③-1  corepack 캐시 미스 → 기동 멈춤</text><rect x="60" y="120" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="170.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RUN pnpm install --prod</text><text x="170.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">root 로 실행</text><rect x="300" y="120" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="410.0" y="137.5" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/root/.cache/node/corepack</text><text x="410.0" y="156.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pnpm@9.15.9 저장</text><path d="M 280 148 L 300 148" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 60 196 L 520 196" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="290" y="190" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">USER node</text><rect x="60" y="214" width="220" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CMD pnpm … start</text><text x="170.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">node 로 실행</text><rect x="300" y="214" width="220" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="410.0" y="231.5" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/home/node/.cache/…</text><text x="410.0" y="250.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">비어 있음 → 네트워크로</text><path d="M 280 242 L 300 242" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="300" y="290" width="220" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="410.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">registry.npmjs.org  ✕</text><text x="410.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dev 호스트에서 차단 → 영원히 대기</text><path d="M 410 270 L 410 290" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="170" y="320" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">"! Corepack is about to download …"</text><text x="170" y="340" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">next start 에 도달하지 못함</text><rect x="580" y="86" width="480" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="594" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③-2  루트 소유 cwd → 모든 BFF 가 HTML 500</text><rect x="600" y="120" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="700.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">COPY apps/&lt;app&gt;/</text><text x="700.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">root 소유</text><rect x="840" y="120" width="200" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="940.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown .next 만</text><text x="940.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(#1931)</text><path d="M 600 196 L 1040 196" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="820" y="190" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">USER node</text><rect x="600" y="214" width="200" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">utils/logger.ts</text><text x="700.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">모듈 로드 시 mkdir &lt;cwd&gt;/log</text><rect x="840" y="214" width="200" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="940.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">EACCES</text><text x="940.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">라우트 모듈 로드 실패</text><path d="M 800 242 L 840 242" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="600" y="290" width="200" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="700.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/api/** → HTML 500</text><text x="700.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">핸들러 JSON 이 아니다 = 모듈이 안 올라옴</text><rect x="840" y="290" width="200" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="940.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/health → 200</text><text x="940.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">로거를 import 하지 않는 페이지</text><path d="M 940 270 L 940 290" fill="none" stroke="#059669" stroke-width="1"/><path d="M 700 270 L 700 290" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="40" y="400" width="500" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="290.0" y="424.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 (#1935)</text><text x="290.0" y="444.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ENV COREPACK_HOME=/opt/corepack   — root 홈 밖, 공유 경로</text><text x="290.0" y="459.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ENV COREPACK_ENABLE_NETWORK=0     — 캐시 미스를 "멈춤"이 아니라 "즉시 실패"로</text><text x="290.0" y="474.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">최소 node:20-slim + packageManager 이미지로 재현</text><rect x="580" y="400" width="480" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="820.0" y="432.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 (#1939)</text><text x="820.0" y="452.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RUN mkdir -p apps/&lt;app&gt;/log &amp;&amp; chown -R node:node .next log</text><text x="820.0" y="467.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">헬스체크는 실제 의존성(로거·BFF)을 지나는 경로여야 한다 — 아직 못 함</text><rect x="40" y="520" width="1020" height="90" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="546" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">비루트 전환 점검 목록</text><text x="550" y="570" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① $HOME 에 의존하는 캐시(corepack · npm · pnpm store)는 공유 경로로 빼거나 런타임에 쓰지 않는다   ② cwd 아래 쓰기 디렉터리(.next/cache · log · 임시)는 미리 만들고 소유권을 준다</text><text x="550" y="592" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ 세 사고 모두 로컬 재현 불가 — 레지스트리의 이미지를 받아 띄워 본다</text><path class="anim" d="M 280 148 L 300 148" fill="none" stroke="#1f2937" stroke-w