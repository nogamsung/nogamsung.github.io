<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">접두는 어디서 붙나 — Next 가 붙여 주는 것, 우리가 붙여야 하는 것, 미들웨어에서 벗겨지는 것</text><rect x="40" y="86" width="300" height="420" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">브라우저 (basePath: "/svc")</text><rect x="60" y="120" width="260" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190" y="142" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">&lt;Link href="/x"&gt;</text><text x="190" y="162" font-size="11" font-weight="600" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✓ Next</text><rect x="60" y="192" width="260" height="54" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190" y="214" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">router.push("/x")</text><text x="190" y="234" font-size="11" font-weight="600" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✓ Next</text><rect x="60" y="264" width="260" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190" y="286" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">fetch("/api/x")</text><text x="190" y="306" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ → 전역 패치</text><rect x="60" y="336" width="260" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190" y="358" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">&lt;img src="/logo.png"&gt;</text><text x="190" y="378" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ → withBasePath()</text><rect x="60" y="408" width="260" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190" y="430" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">window.location = "/login"</text><text x="190" y="450" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ → withBasePath()</text><rect x="400" y="264" width="200" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="500.0" y="281.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">installBasePathFetch()</text><text x="500.0" y="300.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">instrumentation-client.ts</text><rect x="400" y="336" width="200" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="500.0" y="353.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">withBasePath()</text><text x="500.0" y="372.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"/…" 만, //host·https: 제외</text><path d="M 320 291 L 400 291" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 320 363 L 400 363" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 320 435 L 380 435 L 380 376 L 400 376" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="680" y="200" width="160" height="220" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760.0" y="277.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Caddy</text><text x="760.0" y="297.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">path /svc /svc/*</text><text x="760.0" y="312.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">접두 유지 (handle)</text><text x="760.0" y="327.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"></text><text x="760.0" y="342.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">그 외 → 포털</text><path d="M 320 147 L 680 247" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 320 219 L 680 319" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 600 291 L 680 300" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 600 363 L 680 340" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="500" y="170" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">/svc/x</text><text x="640" y="283" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">/svc/api/x</text><rect x="900" y="160" width="160" height="300" rx="14" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/><text x="914" y="176" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Next 서버</text><text x="980" y="206" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">basePath: "/svc"</text><rect x="915" y="230" width="130" height="210" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/><text x="980" y="258" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">미들웨어</text><text x="980" y="278" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">nextUrl.pathname</text><text x="980" y="298" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">= "/x"</text><text x="980" y="318" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(접두 벗겨짐)</text><text x="980" y="338" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"></text><text x="980" y="358" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">절대 URL 만들 때</text><text x="980" y="378" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">nextUrl.basePath</text><text x="980" y="398" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">다시 붙이기</text><path d="M 840 310 L 900 310" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="400" y="460" width="660" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="730" y="484" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">리다이렉트가 누락을 가린다: 옛 서브도메인에서는 접두 없는 /api/x 가 307 로 /svc/api/x 에 가서 멀쩡히 동작</text><text x="730" y="506" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">포털 호스트에서는 같은 요청이 포털에 가 404 — Jest 는 basePath 없이 돈다</text><rect x="40" y="540" width="1020" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550" y="566" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">검증: `/svc/*` 만 넘기고 나머지는 404 인 프록시 뒤에서 Chrome 으로 화면을 전부 돌고 프록시 로그의 404 를 본다 (접두 밖 요청 0건 확인)</text><text x="550" y="592" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">재발 방지: src= · window.open · &lt;a href&gt; · XHR 의 접두 없는 "/…" 리터럴을 grep 하는 테스트</text><path class="anim" d="M 320 147 L 680 247" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.35s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1308;0.1776;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.35s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1308;0.1358;1" values="0;0;1;1;0;0"/><animateMotion dur="5.35s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1308;1" path="M 320 147 L 680 247"/></circle><path class="anim" d="M 320 291 L 400 291" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.35s" repeatCount="indefinite" keyTimes="0;0.1776;0.1876;0.2336;0.2804;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attribut