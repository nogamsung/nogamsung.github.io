<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SQL은 같아 보여도 HQL의 조인 종류가 다르다 — 엔티티 조인은 연관을 채우지 않고, 연관 경로 조인만 채운다</text><text x="60" y="100" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">가짜 fetch join (179곳)</text><rect x="40" y="120" width="500" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="155.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.innerJoin(QClient).on(QClient.id.eq(p.client.id)).fetchJoin()</text><rect x="40" y="215" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="290.0" y="232.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HQL: join ClientEntity c on c.id = p.client.id</text><text x="290.0" y="252.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔티티 조인 — Hibernate 는 p.client 와의 관계를 모른다</text><rect x="40" y="296" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="290.0" y="324.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SQL: ... INNER JOIN client c ON c.id = p.client_id</text><rect x="40" y="377" width="500" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="401.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결과 매핑: p.client = 프록시 (미초기화)</text><text x="290.0" y="421.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">final 시절엔 보조 select 가 채워 가려짐 → open 이 되자 예외 / N+1</text><text x="580" y="100" font-size="14" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">진짜 fetch join</text><rect x="560" y="120" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="810.0" y="144.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.innerJoin(p.client, client).fetchJoin()</text><text x="810.0" y="164.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">on 의 필터 조건은 where 로</text><rect x="560" y="215" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="232.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HQL: join fetch p.client c</text><text x="810.0" y="252.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">연관 경로 조인</text><rect x="560" y="296" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="324.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SQL: ... INNER JOIN client c ON c.id = p.client_id  (동일)</text><rect x="560" y="377" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="810.0" y="401.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결과 매핑: p.client 를 같은 ResultSet 행에서 채움</text><text x="810.0" y="421.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">트랜잭션 밖에서도 안전, 쿼리 1개</text><path d="M 290 190 L 290 215" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 290 271 L 290 296" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 290 352 L 290 377" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 190 L 810 215" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 271 L 810 296" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 352 L 810 377" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="40" y="475" width="1020" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="496.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">inner join 이면 on 의 필터(reportDate·companyId)를 where 로 옮겨도 동치.  중간 엔티티를 거치면 상위 연관도 fetch 해야 한다.</text><text x="550.0" y="514.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@Transactional 테스트는 이 결함을 못 잡는다 — 트랜잭션 없이 돌리는 테스트 하나가 유일하게 잡았다.</text><path class="anim" d="M 290 190 L 290 215" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0536;0.0982;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0536;0.0586;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0536;1" path="M 290 190 L 290 215"/></circle><path class="anim" d="M 290 271 L 290 296" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0982;0.1082;0.1518;0.1964;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0982;0.1032;0.1518;0.1568;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0982;0.1518;1" path="M 290 271 L 290 296"/></circle><path class="anim" d="M 290 352 L 290 377" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1964;0.2064;0.2500;0.3929;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1964;0.2014;0.2500;0.2550;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1964;0.2500;1" path="M 290 352 L 290 377"/></circle><path class="anim" d="M 810 190 L 810 215" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.3929;0.4029;0.4464;0.4911;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.3929;0.3979;0.4464;0.4514;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3929;0.4464;1" path="M 810 190 L 810 215"/></circle><path class="anim" d="M 810 271 L 810 296" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.5011;0.5446;0.5893;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.4961;0.5446;0.5496;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4911;0.5446;1" path="M 810 271 L 810 296"/></circle><path class="anim" d="M 810 352 L 810 377" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.5893;0.5993;0.6429;0.8214;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.5893;0.5943;0.6429;0.6479;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5893;0.6429;1" path="M 810 352 L 810 377"/></circle></svg>