<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">한 출처에 서비스워커 4개 — 같은 appId 의 토큰 레코드 하나를 서로 덮어쓴다</text><rect x="40" y="86" width="1020" height="240" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 전: 앱마다 /&lt;svc&gt;/firebase-messaging-sw.js 등록 (scope /&lt;svc&gt;/)</text><rect x="60" y="120" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="133.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /svc-a/</text><text x="140.0" y="152.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription</text><text x="140.0" y="166.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #1</text><path d="M 140 180 L 140 220 L 880 220 L 880 240" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="240" y="120" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="320.0" y="133.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /messenger/</text><text x="320.0" y="152.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription</text><text x="320.0" y="166.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #2</text><path d="M 320 180 L 320 220 L 880 220 L 880 240" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="420" y="120" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="500.0" y="133.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /mail/</text><text x="500.0" y="152.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription</text><text x="500.0" y="166.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #3</text><path d="M 500 180 L 500 220 L 880 220 L 880 240" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="600" y="120" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="680.0" y="133.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /svc-b/</text><text x="680.0" y="152.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription</text><text x="680.0" y="166.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #4</text><path d="M 680 180 L 680 220 L 880 220 L 880 240" fill="none" stroke="#2563eb" stroke-width="1" marker-end="url(#a-blue)"/><rect x="780" y="240" width="260" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="258.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">IndexedDB 토큰 레코드</text><text x="910.0" y="277.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">키 = appId (출처당 하나)</text><text x="910.0" y="291.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #4 ≠ 저장된 #3 → 삭제 후 재발급</text><rect x="60" y="240" width="680" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="400.0" y="266.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">getToken(): 현재 등록의 endpoint/auth/p256dh 가 저장된 것과 다르면 requestDeleteToken 뒤 새 토큰.</text><text x="400.0" y="284.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">사용자가 앱을 옮길 때마다 직전 앱의 토큰이 서버에서 지워진다 → 마지막에 연 앱만 푸시를 받는다.</text><rect x="40" y="350" width="1020" height="250" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="366" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">수정 후 (#1635): 포털이 서빙하는 루트 서비스워커 하나 (scope /)</text><rect x="60" y="384" width="260" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190.0" y="397.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /</text><text x="190.0" y="416.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/firebase-messaging-sw.js (포털)</text><text x="190.0" y="430.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription 하나</text><rect x="380" y="384" width="260" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="510.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">IndexedDB 토큰 레코드</text><text x="510.0" y="423.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">키 = appId, 등록 하나 → 안정</text><path d="M 320 414 L 380 414" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="700" y="384" width="340" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="870.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">notificationclick</text><text x="870.0" y="423.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">payload.data.service 로 /&lt;svc&gt;/… 라우팅</text><rect x="60" y="470" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="482.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/svc-a</text><text x="170.0" y="501.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath() → 포털 호스트면 루트</text><path d="M 170 470 L 170 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="310" y="470" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="420.0" y="482.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/messenger</text><text x="420.0" y="501.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath() → 포털 호스트면 루트</text><path d="M 420 470 L 420 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="560" y="470" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="670.0" y="482.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/mail</text><text x="670.0" y="501.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath() → 포털 호스트면 루트</text><path d="M 670 470 L 670 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="810" y="470" width="220" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="920.0" y="482.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/svc-b</text><text x="920.0" y="501.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath() → 포털 호스트면 루트</text><path d="M 920 470 L 920 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><path d="M 870 444 L 870 470" fill="none" stroke="#d97706" stroke-width="1"/><text x="550" y="545" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">소스는 공유 패키지에 하나, 각 앱 public/ 으로 동기화. 자기 출처의 다른 scope 에 남은 우리 워커 등록은 unregisterStale() 로 해제</text><text x="550" y="570" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서비스워커는 PATH_HOSTED_SERVICES 를 모른다 → 푸시를 쓰는 4개 앱은 ①과 ③을 한 PR 로 함께 옮겼다</text><path class="anim" d="M 140 180 L 140 220 L 880 220 L 880 240" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.2000;0.2600;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.2000;0.2050;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.2000;1" path="M 140 180 L 140 220 L 880 220 L 880 240"/></circle><path class="anim" d="M 680 180 L 680 220 L 880 220 L 880 240" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.2600;0.2700;0.4000;0.5600;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.2600;0.2650;0.4000;0.4050;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2600;0.4000;1" path="M 680 180 L 680 220 L 880 220 L 880 240"/></circle><path class="anim" d="M 320 414 L 380 414" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.5600;0.5700;0.6400;0.8000;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.5600;0.5650;0.6400;0.6450;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5600;0.6400;1" path="M 320 414 L 380 414"/></circle></svg>