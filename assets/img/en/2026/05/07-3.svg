<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">One source for the API contract — Kotlin controllers to TypeScript types, with CI regenerating both</text><rect x="60" y="110" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="210.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Kotlin controllers · DTOs</text><text x="210.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">backend/</text><rect x="400" y="110" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="550.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">./gradlew generateOpenApi</text><text x="550.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">springdoc, boots the app with the H2 profile</text><path d="M 360 145 L 400 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="740" y="110" width="300" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="890.0" y="135.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">backend/openapi/*.json</text><text x="890.0" y="154.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">4 modules</text><path d="M 700 145 L 740 145" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="60" y="230" width="300" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="210.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Normalize</text><text x="210.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">merge descriptions · sort keys (tomorrow)</text><rect x="400" y="230" width="300" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="550.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">openapi-typescript</text><text x="550.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">npm run gen:api</text><path d="M 360 265 L 400 265" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><rect x="740" y="230" width="300" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="890.0" y="255.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">frontend/types/api/*.gen.ts</text><text x="890.0" y="274.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">imported by the frontend</text><path d="M 700 265 L 740 265" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 1020 180 L 1020 200 L 210 200 L 210 230" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="60" y="360" width="1000" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="560.0" y="379.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CI api-contract.yml — every PR regenerates both sides and runs git diff --exit-code against the committed output</text><text x="560.0" y="399.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A PR that commits only one side fails. When the agent changes a controller, regenerating the types is part of the same task</text><text x="550" y="460" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The cost, within a day: springdoc output is non-deterministic — key order changes on the same code, causing false diffs</text><text x="550" y="486" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The real reason for the merge — force backend controller changes to show up in frontend types immediately</text><path class="anim" d="M 360 145 L 400 145" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0650;0.1057;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0650;0.0700;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0650;1" path="M 360 145 L 400 145"/></circle><path class="anim" d="M 700 145 L 740 145" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.1057;0.1157;0.1707;0.2114;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.1057;0.1107;0.1707;0.1757;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1057;0.1707;1" path="M 700 145 L 740 145"/></circle><path class="anim" d="M 1020 180 L 1020 200 L 210 200 L 210 230" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.2114;0.2214;0.3577;0.3984;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.2114;0.2164;0.3577;0.3627;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2114;0.3577;1" path="M 1020 180 L 1020 200 L 210 200 L 210 230"/></circle><path class="anim" d="M 360 265 L 400 265" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.3984;0.4084;0.4634;0.5041;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.3984;0.4034;0.4634;0.4684;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3984;0.4634;1" path="M 360 265 L 400 265"/></circle><path class="anim" d="M 700 265 L 740 265" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.5041;0.5141;0.5691;0.6098;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.5041;0.5091;0.5691;0.5741;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5041;0.5691;1" path="M 700 265 L 740 265"/></circle><path class="anim" d="M 900 300 L 900 360" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.6098;0.6198;0.6748;0.8374;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.15s" repeatCount="indefinite" keyTimes="0;0.6098;0.6148;0.6748;0.6798;1" values="0;0;1;1;0;0"/><animateMotion dur="6.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6098;0.6748;1" path="M 900 300 L 900 360"/></circle></svg>