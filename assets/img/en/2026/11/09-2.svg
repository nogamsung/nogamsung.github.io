<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown -R after COPY rewrites every copied file into a new layer — a code-only change pushes 145MB</text><rect x="40" y="90" width="490" height="330" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Before — RUN chown -R app:app /app</text><rect x="70" y="330" width="430" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="285.0" y="349.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dependencies 130.5MB</text><text x="285.0" y="370.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">cached if unchanged ✓</text><rect x="70" y="260" width="430" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="285.0" y="279.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">application 14.3MB</text><text x="285.0" y="300.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">rebuilt when code changes</text><rect x="70" y="130" width="430" height="120" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="285.0" y="163.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown layer 144.9MB</text><text x="285.0" y="184.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">rewrites deps + app wholesale just to change the owner</text><text x="285.0" y="200.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ new layer every build → pushed every time</text><text x="285.0" y="216.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">median push per service 55s (max 117s)</text><rect x="570" y="90" width="490" height="330" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After — COPY --chown=app:app</text><rect x="600" y="330" width="430" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="815.0" y="349.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dependencies 130.5MB</text><text x="815.0" y="370.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">copied with owner set · cached if unchanged ✓</text><rect x="600" y="260" width="430" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="815.0" y="279.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">application 14.3MB</text><text x="815.0" y="300.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">the only layer pushed when code changes</text><rect x="600" y="130" width="430" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/><text x="815.0" y="163.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no chown layer</text><text x="815.0" y="184.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">create the user first</text><text x="815.0" y="200.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown only the WORKDIR (empty directory)</text><text x="815.0" y="216.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">about 4s push per service</text><rect x="40" y="440" width="1020" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="465.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BuildKit cache mode=max → mode=min: exporting the extract stage (different every build, never reused) 60s → 11s</text><path class="anim" d="M 285 250 L 285 215" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opa