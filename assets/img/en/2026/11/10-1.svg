<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">One source of truth in GitHub Environments — the deploy job rewrites the server file, Kamal reads it</text><rect x="40" y="85" width="1020" height="135" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="101" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Before</text><rect x="70" y="120" width="180" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160.0" y="147.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Person</text><text x="160.0" y="168.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SSH into server → vi</text><rect x="330" y="120" width="240" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="450.0" y="139.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">server ~/app/env/*</text><text x="450.0" y="160.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">which copy is the source?</text><text x="450.0" y="176.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">local copy 9 keys · server 43</text><rect x="650" y="120" width="170" height="76" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="735.0" y="147.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">kamal deploy</text><text x="735.0" y="168.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">reads env-file</text><rect x="880" y="120" width="150" height="76" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="955.0" y="158.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Container</text><path d="M 250 158 L 330 158" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 570 158 L 650 158" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 820 158 L 880 158" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="735" y="207" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Forget to redeploy and nothing changes</text><rect x="40" y="250" width="1020" height="250" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="266" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After</text><rect x="70" y="290" width="200" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">GitHub Environment</text><text x="170.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">development / production</text><text x="170.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">bundle Secrets (BACKEND_ENV…)</text><rect x="330" y="290" width="200" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="430.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Deploy job</text><text x="430.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">validate · mask</text><text x="430.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dev / main branches only</text><rect x="590" y="290" width="200" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="690.0" y="324.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">server ~/.app-env/*</text><text x="690.0" y="345.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">700 / 600 · atomic replace</text><rect x="850" y="290" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="940.0" y="324.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">kamal deploy</text><text x="940.0" y="345.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">env-file → container</text><path d="M 270 335 L 330 335" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 530 335 L 590 335" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="560.0" y="325.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SSH stdin</text><path d="M 790 335 L 850 335" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="70" y="410" width="200" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="170.0" y="431.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Person</text><text x="170.0" y="452.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">edits the Secret in GitHub</text><path d="M 170 410 L 170 380" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="330" y="410" width="700" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="680" y="432" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Next.js also needs env at build time → BuildKit secret mount, build stage only</text><text x="680" y="455" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">never in image layers · no-cache-filters: builder (secrets aren't part of the cache key)</text><rect x="40" y="515" width="1020" height="44" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="537.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Splitting dev and prd onto two servers only means changing the Environment Variable KAMAL_HOST</text><path class="anim" d="M 170 410 L 170 380" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0741;0.1358;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0741;0.0791;1" values="0;0;1;1;0;0"/><animateMotion dur="4.05s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0