bg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="s-ambbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="a-graybg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="s-graybg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="a-purbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker><marker id="s-purbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">One kamal-proxy per server — dev and prd are split by Host</text><rect x="40" y="120" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="146.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">dev.example.com</text><text x="140.0" y="168.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Caddy passes Host as is</text><rect x="40" y="230" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="265.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">example.com</text><rect x="40" y="340" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="366.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">http://kamal-proxy</text><text x="140.0" y="388.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">dev, service to service</text><rect x="40" y="450" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="140.0" y="476.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">http://kamal-proxy-prd</text><text x="140.0" y="498.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">prd, service to service (alias)</text><rect x="420" y="230" width="220" height="180" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="530.0" y="311.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">kamal-proxy</text><text x="530.0" y="333.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">127.0.0.1:11080</text><text x="530.0" y="352.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">proxy.hosts set on every app</text><text x="530.0" y="371.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">(no empty Host)</text><rect x="760" y="90" width="300" height="210" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 6"/><text x="776" y="110" font-size="14" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle">dev</text><rect x="790" y="130" width="240" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="910.0" y="151.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">&lt;service&gt;-web-dev-&lt;sha7&gt;</text><text x="910.0" y="173.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">hosts: dev.example.com · kamal-proxy</text><rect x="790" y="210" width="240" height="60" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="910.0" y="240.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">… 23 of them</text><rect x="760" y="330" width="300" height="210" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 6"/><text x="776" y="350" font-size="14" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle">prd</text><rect x="790" y="370" width="240" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" /><text x="910.0" y="391.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">&lt;service&gt;-web-prd-&lt;sha7&gt;</text><text x="910.0" y="413.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">hosts: example.com · kamal-proxy-prd</text><rect x="790" y="450" width="240" height="60" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" /><text x="910.0" y="480.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">… 23 of them</text><path d="M 240 155 L 360 155 L 360 280 L 420 280" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 240 265 L 330 265 L 330 305 L 420 305" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"  /><path d="M 240 375 L 330 375 L 330 335 L 420 335" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 240 485 L 360 485 L 360 360 L 420 360" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"  /><path d="M 640 290 L 700 290 L 700 160 L 790 160" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><path d="M 640 350 L 700 350 L 700 400 L 790 400" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"  /><text x="550" y="570" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">If no app matches the Host, kamal-proxy falls back to a Host-less app — leave one blank and the other env's requests leak</text><path class="anim" d="M 240 155 L 360 155 L 360 280 L 420 280" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0902;0.1189;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0902;0.0952;1" values="0;0;1;1;0;0"/><animateMotion dur="12.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0902;1" path="M 240 155 L 360 155 L 360 280 L 420 280"/></circle><path class="anim" d="M 640 290 L 700 290 L 700 160 L 790 160" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" keyTimes="0;0.1107;0.1207;0.2008;0.2295;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="12.20s" repeatCount="indefinite" keyTimes="0;0.1107;0.1157;0.2008;0.2058;1" values="0;0;1;1;0;0"/><animateMotion dur="12.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1107;0.2008;1" path="M 640 290 L 700 290 L 700 160 L 790 160"/></circle><path class="anim" d="M 240 265 L 330 265 L 330 305 L 420 305" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeNa