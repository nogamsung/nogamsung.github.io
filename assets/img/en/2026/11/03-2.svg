<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="s-line" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="s-muted" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="s-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="s-fill" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="a-bluebg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="s-bluebg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="a-greenbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="s-greenbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="a-redbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="s-redbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="a-ambbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="s-ambbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="a-graybg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="s-graybg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="a-purbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker><marker id="s-purbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">lockAtLeastFor — keep the lock for a minimum time even if the job ends fast</text><text x="120" y="110" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle">Lock held only while running</text><rect x="120" y="130" width="190" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="215.0" y="144.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Container A runs</text><text x="215.0" y="166.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">23:50:00.000</text><rect x="330" y="130" width="120" height="46" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" /><text x="390.0" y="153.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">done in 0.8s</text><rect x="470" y="130" width="300" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="620.0" y="144.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Container B wakes at 0.9s</text><text x="620.0" y="166.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">lock is free → runs again</text><text x="120" y="270" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle">lockAtLeastFor = 30s</text><rect x="120" y="290" width="190" height="46" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="215.0" y="304.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Container A runs</text><text x="215.0" y="326.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">23:50:00.000</text><rect x="330" y="290" width="460" height="46" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="560.0" y="313.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">done, but the lock is held until 23:50:30</text><rect x="470" y="360" width="320" height="46" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" /><text x="630.0" y="374.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Container B wakes at 0.9s</text><text x="630.0" y="396.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">lock is taken → skips</text><path d="M 630 360 L 630 336" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"  /><text x="950" y="313" font-size="14" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle">lockAtMostFor</text><text x="950" y="336" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">so a container that dies</text><text x="950" y="354" font-size="12" font-weight="400" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">doesn't hold the lock forever</text><text x="550" y="470" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Even on the same cron, two containers wake up anywhere from milliseconds to a second apart</text><text x="550" y="500" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">&quot;Lock only while running&quot; isn't enough — the shorter the job, the more lockAtLeastFor matters</text><g class="anim"><line x1="0" y1="118" x2="0" y2="410" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="0" cy="118" r="6" fill="#2563eb"/><text x="0" y="104" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">time</text><animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.85;1" values="120 0;790 0;790 0"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.03;0.85;0.95;1" values="0;1;1;0;0"/></g></svg>