<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">If roles changed after the token's pv, the request gets a 401 and the client refreshes and retries once</text><rect x="40" y="120" width="180" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="130.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Browser</text><text x="130.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">global fetch wrapper</text><rect x="320" y="120" width="240" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="440.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Service API filter</text><text x="440.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">verify signature → read pv</text><rect x="320" y="240" width="240" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="440.0" y="264.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PermissionFreshnessGate</text><text x="440.0" y="285.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Caffeine 5s cache</text><rect x="660" y="240" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760.0" y="264.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account service</text><text x="760.0" y="285.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/permission-changed-at</text><rect x="920" y="240" width="150" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="995.0" y="264.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redis</text><text x="995.0" y="285.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">MGET user:, tenant:</text><rect x="660" y="120" width="200" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="760.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Controller</text><text x="760.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">200 OK</text><rect x="660" y="400" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="760.0" y="424.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account reissue</text><text x="760.0" y="445.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">recompute roles, new pv</text><rect x="920" y="400" width="150" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="995.0" y="424.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Admin console</text><text x="995.0" y="445.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">change roles</text><path d="M 220 155 L 320 155" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="270.0" y="145.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① request</text><path d="M 440 190 L 440 240" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="452" y="215" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② isStale?</text><path d="M 560 275 L 660 275" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-purple)"/><text x="610.0" y="265.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ fetch on miss</text><path d="M 860 275 L 920 275" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-amber)"/><text x="890.0" y="265.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④</text><path d="M 560 155 L 660 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="610.0" y="145.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤a pass</text><path d="M 320 300 L 250 300 L 250 175 L 220 175" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="240" y="330" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤b 401 TOKEN_PERMISSION_CHANGED</text><path d="M 130 190 L 130 435 L 660 435" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="142" y="415" font-size="11" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑥ refresh once (many concurrent 401s → 1 refresh)</text><path d="M 920 435 L 860 435" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 995 400 L 995 310" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="985" y="385" font-size="11" font-weight="700" fill="#d97706" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">afterCommit: evict cache → Lua SET max</text><rect x="40" y="520" width="1020" height="80" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="550.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑦ Retry the original request exactly once with the new token (new pv) → 200. Concurrent 401s share one refresh.</text><text x="550.0" y="569.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Lookup failed (account blip, circuit OPEN)? Let it through (fail-open): that's just how things worked before this gate.</text><path class="anim" d="M 220 155 L 320 155" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="9.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0503;0.0754;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0503;0.0553;1" values="0;0;1;1;0;0"/><animateMotion dur="9.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0503;1" path="M 220 155 L 320 155"/></circle><path class="anim" d="M 440 190 L 440 240" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opa