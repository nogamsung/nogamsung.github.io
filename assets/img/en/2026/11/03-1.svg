reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="s-amber" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="s-fill" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker><marker id="a-bluebg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="s-bluebg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eff6ff"/></marker><marker id="a-greenbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="s-greenbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ecfdf5"/></marker><marker id="a-redbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="s-redbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fef2f2"/></marker><marker id="a-ambbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="s-ambbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fffbeb"/></marker><marker id="a-graybg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="s-graybg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9fafb"/></marker><marker id="a-purbg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker><marker id="s-purbg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5f3ff"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">During a zero-downtime deploy there are two batch servers — both run the same @Scheduled job</text><text x="140" y="130" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle">old batch</text><rect x="160" y="105" width="760" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="540.0" y="130.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">23:50:00 applyStockIoJob() runs → stock applied</text><text x="140" y="230" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle">new batch</text><rect x="160" y="205" width="760" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="540.0" y="230.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">23:50:00 applyStockIoJob() runs → stock applied</text><text x="940" y="180" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">same time,</text><text x="940" y="198" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">each runs it</text><path d="M 930 130 L 935 130 L 935 230 L 930 230" fill="none" stroke="#dc2626" stroke-width="2"/><text x="550" y="300" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">The same day's stock is applied twice, and notifications go out twice</text><rect x="160" y="350" width="760" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" /><text x="540.0" y="380.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Happens if a deploy lands between 23:49 and 23:51 (overlap: tens of seconds)</text><text x="550" y="455" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">@Scheduled runs separately on every instance — two instances, two runs</text><path class="anim" d="M 175 146 L 905 146" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.6027;0.6986;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="3.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.6027;0.6077;1" values="0;0;1;1;0;0"/><animateMotion dur="3.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.6027;1" path="M 175 146 L 905 146"/></circle><path class="anim" d="M 175 246 L 905 246" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="3.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.6027;0.6986;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="3.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.6027;0.6077;1" values="0;0;1;1;0;0"/><animateMotion dur="3.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.6027;1" path="M 175 246 L 905 246"/></circle></svg>