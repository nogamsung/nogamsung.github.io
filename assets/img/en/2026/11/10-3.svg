<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">First cutover only: if the old server file differs, stop before swapping containers — a human decides</text><rect x="40" y="250" width="180" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="130.0" y="290.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Bundle validated</text><rect x="280" y="100" width="220" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="390.0" y="124.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">New-path file exists</text><text x="390.0" y="145.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ the bundle is the source</text><rect x="280" y="200" width="220" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="390.0" y="224.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Neither (new server)</text><text x="390.0" y="245.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ create from the bundle</text><rect x="280" y="330" width="220" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="390.0" y="354.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Only the old file</text><text x="390.0" y="375.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">first cutover</text><rect x="840" y="110" width="220" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="950.0" y="166.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Write the file</text><text x="950.0" y="187.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">temp file → os.replace</text><text x="950.0" y="203.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ kamal deploy</text><rect x="570" y="330" width="200" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="670.0" y="346.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Compare in memory</text><text x="670.0" y="367.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">old keys ⊆ bundle?</text><text x="670.0" y="383.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">values equal?</text><rect x="570" y="450" width="200" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="670.0" y="476.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Stop before swap</text><text x="670.0" y="497.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LEGACY_VALUE_MISMATCH</text><text x="670.0" y="513.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">image built fine · no impact</text><rect x="840" y="450" width="220" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="950.0" y="476.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Manual adopt workflow</text><text x="950.0" y="497.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">main · prd · value diffs only</text><text x="950.0" y="513.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">stops if a deploy is running</text><path d="M 220 290 L 250 290 L 250 135 L 280 135" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 250 235 L 280 235" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 250 290 L 250 365 L 280 365" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 500 135 L 840 135" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 500 235 L 840 235" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 500 365 L 570 365" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 770 365 L 950 365 L 950 260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="860.0" y="353.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">equal</text><path d="M 670 400 L 670 450" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="682" y="425" font-size="12" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">differs · key missing</text><path d="M 770 495 L 840 495" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 1040 450 L 1040 260" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-purple)"/><text x="1030" y="420" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">adopt</text><text x="550" y="565" font-size="14" font-weight="800" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Rule: never delete the old file or loosen validation just to get past the comparison</text><text x="550" y="588" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A human decides which side is right, registers the correct values as the Secret, then adopts</text><path class="anim" d="M 220 290 L 250 290 L 250 365 L 280 365" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0860;0.1398;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0860;0.0910;1" values="0;0;1;1;0;0"/><animateMotion dur="4.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0860;1" path="M 220 290 L 250 290 L 250 365 L 280 365"/></circle><path class="anim" d="M 500 365 L 570 365" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.1398;0.1498;0.2043;0.2581;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.65s" repeatCount="indefinite" keyTimes="0;0.1398;0.1448;0.2043;0.2093;1" values="0;0;1;1;0;0"/><animateMotion dur="4.65s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1398;0.2043;1" path="M 500 365 L 570 365"/></circle><path class="anim" d="M 670 400 L 670 450" fill="none" stroke="#dc2626" strok