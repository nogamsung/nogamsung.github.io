<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The bundle never shows up in argv or logs — it reaches the server only through SSH stdin</text><rect x="40" y="90" width="560" height="400" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">GitHub Actions runner</text><rect x="70" y="125" width="240" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="190.0" y="146.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① take the flock</text><text x="190.0" y="167.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">per server · waits up to 30 min</text><rect x="70" y="210" width="240" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="190.0" y="231.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② write SSH config</text><text x="190.0" y="252.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">umask 077 temp dir · trap cleanup</text><rect x="70" y="295" width="240" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="190.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ sync.py</text><text x="190.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">parse · validate the bundle</text><text x="190.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">every value → ::add-mask::</text><rect x="340" y="295" width="230" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="455.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ ssh … python3 -</text><text x="455.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">remote script (base64)</text><text x="455.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">+ bundle JSON → stdin</text><rect x="70" y="400" width="500" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="320.0" y="421.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑥ kamal deploy</text><text x="320.0" y="442.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">env -u BUNDLE … — child processes get no bundle variables</text><rect x="660" y="90" width="400" height="400" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="674" y="106" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Server</text><rect x="690" y="295" width="340" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="860.0" y="316.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤ remote_sync.py</text><text x="860.0" y="337.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">~/.app-env/ (deploy 700, files 600)</text><text x="860.0" y="353.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">rejects symlinks · temp file → os.replace</text><rect x="690" y="400" width="340" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="860.0" y="421.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">kamal-proxy · new container</text><text x="860.0" y="442.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">reads env-file → health check → switch</text><rect x="690" y="125" width="340" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="860" y="150" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">What ends up in the logs</text><text x="860" y="180" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">line 51: duplicate variable name …</text><text x="860" y="198" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">category=SSH_HOST_KEY_UNKNOWN</text><text x="860" y="216" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Environment sync failed: LEGACY_…</text><text x="860" y="234" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">values · raw commands · SSH output dropped</text><path d="M 190 189 L 190 210" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 190 274 L 190 295" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 310 335 L 340 335" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 570 335 L 690 335" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="630.0" y="325.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">stdin</text><path d="M 860 375 L 860 400" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 570 432 L 690 432" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="40" y="510" width="1020" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="532.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The server script reports why only through its exit code: 40 SYMLINK_REJECTED · 44 LEGACY_FILE_MISSING ·</text><text x="550.0" y="551.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">46 LEGACY_KEY_MISSING_FROM_BUNDLE · 47 LEGACY_VALUE_MISMATCH · 48 REMOTE_PERMISSION_DENIED …</text><path class="anim" d="M 190 189 L 190 210" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0625;0.1146;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0625;0.0675;1" values="0;0;1;1;0;0"/><animateMotion dur="4.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0625;1" path="M 190 189 L 190 210"/></circle><path class="anim" d="M 190 274 L 190 295" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.1146;0.1246;0.1771;0.2292;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.1146;0.1196;0.1771;0.1821;1" values="0;0;1;1;0;0"/><animateMotion dur="4.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1146;0.1771;1" path="M 190 274 L 190 295"/></circle><path class="anim" d="M 310 335 L 340 335" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.2292;0.2392;0.2917;0.3438;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.2292;0.2342;0.2917;0.2967;1" values="0;0;1;1;0;0"/><animateMotion dur="4.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2292;0.2917;1" path="M 310 335 L 340 335"/></circle><path class="anim" d="M 570 335 L 690 335" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.3438;0.3538;0.4688;0.5208;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.3438;0.3488;0.4688;0.4738;1" values="0;0;1;1;0;0"/><animateMotion dur="4.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3438;0.4688;1" path="M 570 335 L 690 335"/></circle><path class="anim" d="M 570 432 L 690 432" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.5208;0.5308;0.6250;0.7917;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.80s" repeatCount="indefinite" keyTimes="0;0.5208;0.5258;0.6250;0.6300;1" values="0;0;1;1;0;0"/><animateMotion dur="4.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5208;0.6250;1" path="M 570 432 L 690 432"/></circle></svg>