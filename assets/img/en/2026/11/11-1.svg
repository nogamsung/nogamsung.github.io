<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Only calls registered with the OS survive in the background — of three paths, only VoIP push used CallKit</text><rect x="40" y="110" width="260" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Incoming, app not running</text><text x="170.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">VoIP push → accept on OS call screen</text><rect x="40" y="250" width="260" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="170.0" y="284.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Calls I place</text><text x="170.0" y="305.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CallController.start()</text><rect x="40" y="390" width="260" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="170.0" y="424.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Accepted on in-app screen</text><text x="170.0" y="445.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">while the app is in front</text><rect x="400" y="110" width="280" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="540.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Registered as an OS call</text><text x="540.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iOS CallKit · Android Telecom + FGS</text><rect x="400" y="310" width="280" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="540.0" y="346.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Not registered</text><text x="540.0" y="367.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">a call only the app knows about</text><text x="540.0" y="383.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">the OS sees a backgrounded app</text><rect x="780" y="110" width="280" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="920.0" y="144.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Even after going home</text><text x="920.0" y="165.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">audio stays · Dynamic Island</text><rect x="780" y="310" width="280" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="920.0" y="346.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After going home</text><text x="920.0" y="367.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iOS: audio drops · no Island</text><text x="920.0" y="383.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Android 14+: mic drops</text><path d="M 300 155 L 400 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 300 295 L 350 295 L 350 350 L 400 350" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 300 435 L 350 435 L 350 380 L 400 380" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 680 155 L 780 155" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 680 365 L 780 365" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="40" y="495" width="1020" height="46" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="518.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Declaring audio · voip in UIBackgroundModes only says "this app may" — you still have to tell the OS a call is live</text><path class="anim" d="M 300 155 L 400 155" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0941;0.1529;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0941;0.0991;1" values="0;0;1;1;0;0"/><animateMotion dur="4.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0941;1" path="M 300 155 L 400 155"/></circle><path class="anim" d="M 680 155 L 780 155" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.1529;0.1629;0.2471;0.3059;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.1529;0.1579;0.2471;0.2521;1" values="0;0;1;1;0;0"/><animateMotion dur="4.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1529;0.2471;1" path="M 680 155 L 780 155"/></circle><path class="anim" d="M 300 295 L 350 295 L 350 350 L 400 350" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.3059;0.3159;0.4235;0.4824;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.3059;0.3109;0.4235;0.4285;1" values="0;0;1;1;0;0"/><animateMotion dur="4.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3059;0.4235;1" path="M 300 295 L 350 295 L 350 350 L 400 350"/></circle><path class="anim" d="M 680 365 L 780 365" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.4824;0.4924;0.5765;0.7647;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.25s" repeatCount="indefinite" keyTimes="0;0.4824;0.4874;0.5765;0.5815;1" values="0;0;1;1;0;0"/><animateMotion dur="4.25s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4824;0.5765;1" path="M 680 365 L 780 365"/></circle></svg>