<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Reporter: app state → OS. Event handler: OS buttons → app. Same path however the call started</text><rect x="40" y="140" width="260" height="120" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="181.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Call state machine</text><text x="170.0" y="202.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">idle → outgoing → active → ended</text><text x="170.0" y="218.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">micEnabled · cameraEnabled</text><rect x="420" y="140" width="260" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="550.0" y="173.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Native call reporter</text><text x="550.0" y="194.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">subscribes via ref.listen</text><text x="550.0" y="210.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">server callId ↔ OS call ID</text><text x="550.0" y="226.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ends calls by registered list</text><rect x="800" y="140" width="260" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="930.0" y="181.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OS call</text><text x="930.0" y="202.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">iOS CallKit · Dynamic Island</text><text x="930.0" y="218.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Android Telecom + call FGS</text><rect x="420" y="350" width="260" height="120" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="383.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Event handler</text><text x="550.0" y="404.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ACTION_CALL_ENDED → leave()</text><text x="550.0" y="420.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TOGGLE_MUTE → setMicrophoneEnabled</text><text x="550.0" y="436.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">TOGGLE_AUDIO_SESSION → audio engine</text><path d="M 300 200 L 420 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="360.0" y="190.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">state change</text><path d="M 680 200 L 800 200" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="740" y="120" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">startCall · setCallConnected</text><text x="740" y="136" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">muteCall · endCall</text><path d="M 930 260 L 930 410 L 680 410" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="918" y="335" font-size="12" font-weight="700" fill="#d97706" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Buttons pressed on Island · lock screen · notification</text><path d="M 420 410 L 170 410 L 170 260" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="40" y="505" width="1020" height="64" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="527.5" font-size="13" font-weight="700" fill="#1f2