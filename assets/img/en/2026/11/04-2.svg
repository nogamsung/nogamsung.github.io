 y="105" width="300" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" /><text x="890.0" y="130.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">new container up</text><text x="580" y="180" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle">← 40–60s →</text><text x="100" y="260" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle">Others</text><text x="100" y="282" font-size="12" font-weight="400" fill="#6b7280" text-anchor="end" dominant-baseline="middle">(service A·B…)</text><rect x="120" y="240" width="300" height="50" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2" /><text x="270.0" y="265.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">auth check → calls account ✓</text><rect x="420" y="240" width="320" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="580.0" y="265.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Connection refused → circuit OPEN</text><rect x="740" y="240" width="300" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" /><text x="890.0" y="265.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">503 until the circuit closes</text><path d="M 580 155 L 580 240" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"  /><text x="100" y="380" font-size="15" font-weight="700" fill="#1f2937" text-anchor="end" dominant-baseline="middle">Users</text><rect x="420" y="355" width="620" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="730.0" y="380.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle">Can't get in — almost every screen returns 503</text><path d="M 730 290 L 730 355" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"  /><text x="550" y="470" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle">The deploy method itself (stop and recreate) left a gap, and the circuit breaker spread it to other services</text><g class="anim"><line x1="0" y1="92" x2="0" y2="410" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="0" cy="92" r="6" fill="#dc2626"/><text x="0" y="78" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">time</text><animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.85;1" values="120 0;1040 0;1040 0"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.03;0.85;0.95;1" values="0;1;1;0;0"/></g></svg>