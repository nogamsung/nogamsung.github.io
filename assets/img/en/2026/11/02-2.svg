<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">On a cache miss, if the account call fails or the circuit is open, we now return 503 instead of allowing</text><rect x="40" y="90" width="170" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="125.0" y="107.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Request</text><text x="125.0" y="128.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(authenticated)</text><rect x="280" y="90" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="390.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Allow cache 60s?</text><rect x="280" y="175" width="220" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="390.0" y="203.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Deny cache 10s?</text><rect x="280" y="260" width="220" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="390.0" y="277.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Circuit state</text><text x="390.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account-access</text><rect x="280" y="345" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="390.0" y="362.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HTTP GET has-service-role</text><text x="390.0" y="382.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">timeout 10s</text><rect x="760" y="90" width="300" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="118.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Pass → controller</text><rect x="760" y="175" width="300" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="192.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">403 access denied</text><text x="910.0" y="213.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SERVICE_ACCESS_DENIED</text><rect x="760" y="260" width="300" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="277.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">503 can't decide, no HTTP call</text><text x="910.0" y="297.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OPEN → CallNotPermittedException at once</text><path d="M 210 118 L 280 118" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 500 118 L 760 118" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="630.0" y="108.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">hit</text><path d="M 390 146 L 390 175" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="160" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">miss</text><path d="M 500 203 L 760 203" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="630.0" y="193.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">hit</text><path d="M 390 231 L 390 260" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="245" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">miss</text><path d="M 500 288 L 760 288" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="630.0" y="278.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">OPEN</text><path d="M 390 316 L 390 345" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="400" y="330" font-size="11" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CLOSED / HALF_OPEN</text><rect x="600" y="330" width="460" height="34" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="830.0" y="347.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">true → cache allow for 60s → pass</text><path d="M 500 373 L 550 373 L 550 347 L 600 347" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="600" y="372" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="389.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">false → cache deny for 10s → 403</text><path d="M 500 373 L 550 373 L 550 389 L 600 389" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="600" y="414" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="431.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">connection error · timeout · 5xx → recorded as failure → 503</text><path d="M 500 373 L 550 373 L 550 431 L 600 431" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="600" y="456" width="460" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="830.0" y="473.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">4xx (401·403·429) → not counted (ignored) → 503 + ERROR log (status only)</text><path d="M 500 373 L 550 373 L 550 473 L 600 473" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><rect x="40" y="520" width="490" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="285.0" y="538.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Before (fail-open): every failure → return true</text><text x="285.0" y="557.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">every 15s of outage opened access to all services</text><rect x="570" y="520" width="490" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="815.0" y="538.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Circuit: 30s window · min 10 calls · failure ≥ 50% → OPEN 15s</text><text x="815.0" y="557.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ HALF_OPEN, 3 trial calls → CLOSED / OPEN</text><rect x="40" y="590" width="1020" height="40" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="610.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Failures aren't cached · an OPEN circuit isn't tied to liveness · turning the circuit off doesn't bring back "failed check = allow"</text><path class="anim" d="M 210 118 L 280 118" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0526;0.0855;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0526;0.0576;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0526;1" path="M 210 118 L 280 118"/></circle><path class="anim" d="M 390 146 L 390 175" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0855;0.0955;0.1184;0.1513;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.0855;0.0905;0.1184;0.1234;1" values="0;0;1;1;0;0"/><animateMotion dur="7.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0855;0.1184;1" path="M 390 146 L 390 175"/></circle><path class="anim" d="M 390 231 L 390 260" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTimes="0;0.1513;0.1613;0.1842;0.2171;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.60s" repeatCount="indefinite" keyTime