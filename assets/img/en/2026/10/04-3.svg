hic Neo','Noto Sans KR',sans-serif">/messenger</text><text x="420.0" y="498.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath()</text><text x="420.0" y="512.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ root on the portal host</text><path d="M 420 470 L 420 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="560" y="470" width="220" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="670.0" y="479.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/mail</text><text x="670.0" y="498.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath()</text><text x="670.0" y="512.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ root on the portal host</text><path d="M 670 470 L 670 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="810" y="470" width="220" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="920.0" y="479.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/svc-b</text><text x="920.0" y="498.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">serviceWorkerPath()</text><text x="920.0" y="512.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ root on the portal host</text><path d="M 920 470 L 920 456 L 190 456 L 190 444" fill="none" stroke="#6b7280" stroke-width="1"/><path d="M 870 444 L 870 470" fill="none" stroke="#d97706" stroke-width="1"/><text x="550" y="548" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">One source file in a shared package, synced to each app's public/. unregisterStale() removes our leftover registrations at other scopes</text><text x="550" y="573" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Service workers don't know PATH_HOSTED_SERVICES → the 4 push apps did ① and ③ together in one PR</text><path class="anim" d="M 140 180 L 140 220 L 880 220 L 880 240" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.2000;0.2600;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.2000;0.2050;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.2000;1" path="M 140 180 L 140 220 L 880 220 L 880 240"/></circle><path class="anim" d="M 680 180 L 680 220 L 880 220 L 880 240" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.2600;0.2700;0.4000;0.5600;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" str