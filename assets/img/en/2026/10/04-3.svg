 #3</text><path d="M 500 180 L 500 220 L 880 220 L 880 240" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="600" y="120" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="680.0" y="133.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /svc-b/</text><text x="680.0" y="152.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PushSubscription</text><text x="680.0" y="166.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #4</text><path d="M 680 180 L 680 220 L 880 220 L 880 240" fill="none" stroke="#2563eb" stroke-width="1" marker-end="url(#a-blue)"/><rect x="780" y="240" width="260" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="910.0" y="258.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">IndexedDB token record</text><text x="910.0" y="277.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">key = appId (one per origin)</text><text x="910.0" y="291.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">endpoint #4 ≠ stored #3 → delete, reissue</text><rect x="60" y="236" width="680" height="78" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="400.0" y="257.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">getToken(): if endpoint/auth/p256dh differ from the stored record → requestDeleteToken, then a new token.</text><text x="400.0" y="275.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Every app switch deletes the previous app's token on the server</text><text x="400.0" y="293.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ only the app opened last receives push.</text><rect x="40" y="350" width="1020" height="250" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="366" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After (#1635): one root service worker served by the portal (scope /)</text><rect x="60" y="384" width="260" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190.0" y="397.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SW scope /</text><text x="190.0" y="416.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/firebase-messaging-sw.js (portal)</text><text x="190.0" y="430.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">one PushSubscription</text><rect x="380" y="384" width="260" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="510.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',