'Apple SD Gothic Neo','Noto Sans KR',sans-serif">claude -p --tools Read,Grep,Glob</text><text x="650" y="283.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no shell · diff in a file · opus/sonnet</text><path d="M 330 166 L 430 230" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="380.0" y="192.0" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">working in Claude</text><path d="M 640 166 L 700 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="670.0" y="192.0" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">working in Codex</text><rect x="40" y="350" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190.0" y="368.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">exit 0</text><text x="190.0" y="387.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">VERDICT: PASS | REVIEW | BLOCK</text><text x="190.0" y="401.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Critical → BLOCK, High → REVIEW</text><rect x="380" y="350" width="340" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="368.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">exit 3 — reviewer unavailable</