<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A final entity can't be proxied, so its associations load right away</text><text x="550.0" y="62" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Once it is open, a proxy goes in instead, and touching it outside the transaction throws</text><rect x="40" y="110" width="240" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="129.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">repo.findById(purchase)</text><text x="160.0" y="150.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">inside a transaction</text><rect x="340" y="110" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="490.0" y="129.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SELECT * FROM stock_purchase</text><text x="490.0" y="150.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WHERE id = ?</text><rect x="700" y="110" width="360" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="880.0" y="129.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Is clientEntity final?</text><text x="880.0" y="150.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@ManyToOne(fetch = LAZY): the code is identical</text><path d="M 280 140 L 340 140" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 640 140 L 700 140" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="60" y="215" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">final (Kotlin 1.9 plugin.jpa)</text><rect x="40" y="235" width="480" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="280.0" y="254.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">No proxy possible → secondary select runs now</text><text x="280.0" y="275.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SELECT * FROM client WHERE id = ?</text><rect x="40" y="325" width="480" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="280.0" y="350.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">purchase.clientEntity = real object</text><rect x="40" y="405" width="480" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="280.0" y="430.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Transaction ends (S3 upload etc., no persistence context)</text><rect x="40" y="485" width="480" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="280.0" y="504.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">purchase.clientEntity.name → works</text><text x="280.0" y="525.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">effectively EAGER</text><text x="600" y="215" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">open (Kotlin 2.x plugin.jpa / allOpen)</text><rect x="580" y="235" width="480" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="820.0" y="254.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ByteBuddy subclass proxy created</text><text x="820.0" y="275.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">holds only the id, no select</text><rect x="580" y="325" width="480" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="820.0" y="350.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">purchase.clientEntity = Proxy(id = …)</text><rect x="580" y="405" width="480" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="820.0" y="430.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Transaction ends</text><rect x="580" y="485" width="480" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="820.0" y="504.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">purchase.clientEntity.name → LazyInitializationException</text><text x="820.0" y="525.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no session</text><path d="M 280 295 L 280 325" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 280 375 L 280 405" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 280 455 L 280 485" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 820 295 L 820 325" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 820 375 L 820 405" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 820 455 L 820 485" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 880 170 L 880 200 L 280 200 L 280 235" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a-red)"/><text x="580.0" y="190.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">yes</text><path d="M 880 170 L 880 235" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/><text x="892" y="215" font-size="11" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no</text><rect x="40" y="565" width="1020" height="40" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="585.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">All 67 @ManyToOne said LAZY, but because all 232 entities were final, every one of the 67 was loading eagerly</text><path class="anim" d="M 280 140 L 340 140" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.50s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0400;0.0733;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.50s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0400;0.0450;1" values="0;0;1;1;0;0"/><animateMotion dur="7.50s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0400;1" path="M 280 140 L 340 140"/></circle><path class="anim" d="M 640 140 L 700 140" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.50s" repeatCount="indefinite" keyTimes="0;0.0733;0.0833;0.1133;0.1467;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attribute