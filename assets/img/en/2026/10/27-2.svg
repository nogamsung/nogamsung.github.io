<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The SQL looks the same, but the HQL join is a different kind</text><text x="550.0" y="62" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">An entity join doesn't populate the association; only an association-path join does</text><text x="60" y="100" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fake fetch join (179 places)</text><rect x="40" y="120" width="500" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="155.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.innerJoin(QClient).on(QClient.id.eq(p.client.id)).fetchJoin()</text><rect x="40" y="215" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="290.0" y="232.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HQL: join ClientEntity c on c.id = p.client.id</text><text x="290.0" y="252.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">entity join: Hibernate doesn't know it relates to p.client</text><rect x="40" y="296" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="290.0" y="324.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SQL: ... INNER JOIN client c ON c.id = p.client_id</text><rect x="40" y="377" width="500" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="290.0" y="401.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Result mapping: p.client = proxy (uninitialized)</text><text x="290.0" y="421.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">hidden by the secondary select while final → exception / N+1 once open</text><text x="580" y="100" font-size="14" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Real fetch join</text><rect x="560" y="120" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="810.0" y="144.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.innerJoin(p.client, client).fetchJoin()</text><text x="810.0" y="164.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">filter conditions from on move to where</text><rect x="560" y="215" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="232.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HQL: join fetch p.client c</text><text x="810.0" y="252.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">association-path join</text><rect x="560" y="296" width="500" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="810.0" y="324.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SQL: ... INNER JOIN client c ON c.id = p.client_id  (same)</text><rect x="560" y="377" width="500" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="810.0" y="401.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Result mapping: p.client filled from the same ResultSet row</text><text x="810.0" y="421.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">safe outside a transaction, one query</text><path d="M 290 190 L 290 215" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 290 271 L 290 296" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 290 352 L 290 377" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 190 L 810 215" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 271 L 810 296" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 810 352 L 810 377" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="40" y="475" width="1020" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="496.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">With an inner join, moving the on filters (reportDate · companyId) to where is equivalent. Via an intermediate entity, fetch the parent too.</text><text x="550.0" y="514.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@Transactional tests can't catch this. The only test that did was one that ran without a transaction.</text><path class="anim" d="M 290 190 L 290 215" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0536;0.0982;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0536;0.0586;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0536;1" path="M 290 190 L 290 215"/></circle><path class="anim" d="M 290 271 L 290 296" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0982;0.1082;0.1518;0.1964;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0982;0.1032;0.1518;0.1568;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0982;0.1518;1" path="M 290 271 L 290 296"/></circle><path class="anim" d="M 290 352 L 290 377" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1964;0.2064;0.2500;0.3929;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1964;0.2014;0.2500;0.2550;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1964;0.2500;1" path="M 290 352 L 290 377"/></circle><path class="anim" d="M 810 190 L 810 215" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.3929;0.4029;0.4464;0.4911;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.3929;0.3979;0.4464;0.4514;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3929;0.4464;1" path="M 810 190 L 810 215"/></circle><path class="anim" d="M 810 271 L 810 296" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.5011;0.5446;0.5893;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.4961;0.5446;0.5496;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4911;0.5446;1" path="M 810 271 L 810 296"/></circle><path class="anim" d="M 810 352 L 810 377" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.5893;0.5993;0.6429;0.8214;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.5893;0.5943;0.6429;0.6479;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5893;0.6429;1" path="M 810 352 L 810 377"/></circle></svg>