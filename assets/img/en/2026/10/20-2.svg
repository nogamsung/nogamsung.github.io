<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Root builds, node runs — the $HOME cache and directory ownership don't cross the USER boundary</text><rect x="40" y="86" width="500" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③-1  corepack cache miss → startup hangs</text><rect x="60" y="120" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="170.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RUN pnpm install --prod</text><text x="170.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">runs as root</text><rect x="300" y="120" width="220" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="410.0" y="137.5" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/root/.cache/node/corepack</text><text x="410.0" y="156.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pnpm@9.15.9 stored here</text><path d="M 280 148 L 300 148" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 60 196 L 520 196" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="290" y="190" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">USER node</text><rect x="60" y="214" width="220" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CMD pnpm … start</text><text x="170.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">runs as node</text><rect x="300" y="214" width="220" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="410.0" y="231.5" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/home/node/.cache/…</text><text x="410.0" y="250.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">empty → goes to the network</text><path d="M 280 242 L 300 242" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="300" y="290" width="220" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="410.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">registry.npmjs.org  ✕</text><text x="410.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">blocked on the dev host → waits forever</text><path d="M 410 270 L 410 290" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="170" y="320" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">"! Corepack is about to download …"</text><text x="170" y="340" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">never reaches next start</text><rect x="580" y="86" width="480" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="594" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③-2  root-owned cwd → every BFF returns HTML 500</text><rect x="600" y="120" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="700.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">COPY apps/&lt;app&gt;/</text><text x="700.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">owned by root</text><rect x="840" y="120" width="200" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="940.0" y="137.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">chown .next only</text><text x="940.0" y="157.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(#1931)</text><path d="M 600 196 L 1040 196" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="820" y="190" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">USER node</text><rect x="600" y="214" width="200" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">utils/logger.ts</text><text x="700.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">mkdir &lt;cwd&gt;/log at module load</text><rect x="840" y="214" width="200" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="940.0" y="231.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">EACCES</text><text x="940.0" y="251.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">route module fails to load</text><path d="M 800 242 L 840 242" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="600" y="290" width="200" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="700.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/api/** → HTML 500</text><text x="700.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">not handler JSON = module not loaded</text><rect x="840" y="290" width="200" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="940.0" y="305.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/health → 200</text><text x="940.0" y="324.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">a page that skips the logger</text><path d="M 940 270 L 940 290" fill="none" stroke="#059669" stroke-width="1"/><path d="M 700 270 L 700 290" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="40" y="400" width="500" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="290.0" y="424.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fix (#1935)</text><text x="290.0" y="444.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ENV COREPACK_HOME=/opt/corepack   — shared path outside root's home</text><text x="290.0" y="459.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ENV COREPACK_ENABLE_NETWORK=0     — a cache miss fails fast, no hang</text><text x="290.0" y="474.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">reproduced with a minimal node:20-slim + packageManager image</text><rect x="580" y="400" width="480" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="820.0" y="432.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fix (#1939)</text><text x="820.0" y="452.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RUN mkdir -p apps/&lt;app&gt;/log &amp;&amp; chown -R node:node .next log</text><text x="820.0" y="467.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">health check should hit real deps (logger, BFF) — not done yet</text><rect x="40" y="520" width="1020" height="96" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="540" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Non-root checklist</text><text x="550" y="561" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① caches tied to $HOME (corepack · npm · pnpm store): move them to a shared path, or don't use them at runtime</text><text x="550" y="580" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② writable dirs under cwd (.next/cache · log · temp): create them in advance and hand over ownership</text><text x="550" y="599" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ none of the three incidents reproduced locally — pull the image from the registry and run it</text><path class="anim" d="M 280 148 L 300 148" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0606;0.1111;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.95s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0606;0.0656;1" values="0;0;1;1;0;0"/><animateMotion dur="4.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0606;1" path="M 280 148 L 300 148"/></circle><path class="anim" d="M 280 242 L 300 242" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.95s" repeatCount="indefinite" keyTimes="0;0.1111;0.1211;0.1717;0.2222;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.95s" repeatCount="indefinite" keyTimes="0;0.1111;0.1161;0.1717;0.1767;1" values="0;0;1;1;0;0"/><animateMotion dur="4.95s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1111;0.1717;1" path="M 280 242 L 300 242"/></circle><path class="anim" d="M 410 270 L 410 290" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName=