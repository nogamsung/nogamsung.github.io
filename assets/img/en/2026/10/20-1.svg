-serif">required-server-files.json</text><text x="610.0" y="326.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">whole config serialized —</text><text x="610.0" y="341.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">next start reads one experimental flag</text><path d="M 420 140 L 480 150" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 420 160 L 480 248" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 420 180 L 480 325" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="800" y="86" width="260" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="814" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Container: next start</text><rect x="820" y="120" width="220" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="930.0" y="135.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">routes-manifest ✓</text><text x="930.0" y="154.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">always there → redirects work</text><rect x="820" y="186" width="220" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="930.0" y="201.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">next.config.* (cwd)</text>