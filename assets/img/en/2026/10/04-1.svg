<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Four zero-downtime stages — when each one finishes, the old and the new address both work</text><rect x="170" y="90" width="210" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="275.0" y="108.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① App deploy</text><text x="275.0" y="128.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">basePath + redirects(basePath:false)</text><rect x="400" y="90" width="210" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="505.0" y="101.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② Caddy</text><text x="505.0" y="121.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">path /svc /svc/* → container</text><text x="505.0" y="135.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(prefix kept)</text><rect x="630" y="90" width="210" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="735.0" y="108.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ Switch links</text><text x="735.0" y="128.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">add to PATH_HOSTED_SERVICES</text><rect x="860" y="90" width="210" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="965.0" y="108.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ Clean up</text><text x="965.0" y="128.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">remove the old host block</text><text x="40" y="200" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Old URL</text><text x="40" y="218" font-size="10" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">svc.example.com</text><text x="40" y="330" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">New URL</text><text x="40" y="348" font-size="10" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">example.com/svc</text><rect x="170" y="170" width="210" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="275.0" y="199.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/x → 307 → /svc/x</text><text x="275.0" y="219.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">works</text><rect x="170" y="300" width="210" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="275.0" y="329.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no Caddy handle yet</text><text x="275.0" y="349.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ portal 404 / login</text><rect x="400" y="170" width="210" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="505.0" y="199.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">unchanged</text><text x="505.0" y="219.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">works</text><rect x="400" y="300" width="210" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="505.0" y="329.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">handle @svc → container</text><text x="505.0" y="349.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">works</text><rect x="630" y="170" width="210" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="735.0" y="199.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no longer linked</text><text x="735.0" y="219.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">still responds</text><rect x="630" y="300" width="210" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="735.0" y="329.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">every link points here</text><text x="735.0" y="349.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">works</text><rect x="860" y="170" width="210" height="80" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="965.0" y="199.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">host removed</text><text x="965.0" y="219.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(gone)</text><rect x="860" y="300" width="210" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="965.0" y="329.5" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">the only address</text><text x="965.0" y="349.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">works</text><path d="M 380 210 L 400 210" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 380 340 L 400 340" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 610 210 L 630 210" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 610 340 L 630 340" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 840 210 L 860 210" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 840 340 L 860 340" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="40" y="420" width="1020" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="440" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Who ships what:  ① app image   ② Caddy reload   ③ shared package → app image   ④ Caddy reload (+ DNS)</text><text x="550" y="460" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">No two stages have to happen at the same moment — the service stays up in the minutes between them</text><rect x="40" y="486" width="1020" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550.0" y="513.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Actual order: 10-02 night admin ① → 10-03 small hours admin + ops ③ → other 4 ① (push apps in one PR) → morning all 6 ③ → afternoon ④ (dev, prd)</text><text x="550.0" y="531.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Prerequisite: add the portal host to the messenger/mail backend CORS allowed origins (WebSocket handshake 403 → 101)</text><text x="550.0" y="549.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Bonus: the new address is derived from the request Host, not env vars — dev, prd and local run the same code</text><path class="anim" d="M 170 160 L 380 160" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1356;0.1864;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1356;0.1406;1" values="0;0;1;1;0;0"/><animateMotion dur="5.90s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1356;1" path="M 170 160 L 380 160"/></circle><path class="anim" d="M 400 160 L 610 160" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.1864;0.1964;0.3220;0.3729;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.1864;0.1914;0.3220;0.3270;1" values="0;0;1;1;0;0"/><animateMotion dur="5.90s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1864;0.3220;1" path="M 400 160 L 610 160"/></circle><path class="anim" d="M 630 160 L 840 160" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.3729;0.3829;0.5085;0.5593;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.3729;0.3779;0.5085;0.5135;1" values="0;0;1;1;0;0"/><animateMotion dur="5.90s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3729;0.5085;1" path="M 630 160 L 840 160"/></circle><path class="anim" d="M 860 160 L 1070 160" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.5593;0.5693;0.6949;0.8305;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.90s" repeatCount="indefinite" keyTimes="0;0.5593;0.5643;0.6949;0.6999;1" values="0;0;1;1;0;0"/><animateMotion dur="5.90s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5593;0.6949;1" path="M 860 160 L 1070 160"/></circle></svg>