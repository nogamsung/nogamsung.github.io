gh · 10-min timeout · $0.23/doc</text><path d="M 890 134 L 890 140" fill="none" stroke="#059669" stroke-width="1"/><path d="M 1060 112 L 1080 112 L 1080 375 L 820 375" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 1060 274 L 1075 274 L 1075 370" fill="none" stroke="#059669" stroke-width="2"/><rect x="40" y="340" width="200" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="358.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Capacity calculator</text><text x="140.0" y="377.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Deterministic code —</text><text x="140.0" y="391.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">the LLM never sizes capacity</text><rect x="260" y="340" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="360.0" y="358.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Resolver</text><text x="360.0" y="377.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Document value, else calculator</text><text x="360.0" y="391.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">blank cells only</text><path d="M 480 375 L 460 375" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 260 375 L 240 375" fill="none" stroke="#1f2937" stroke-width="2"/><path d="M 2