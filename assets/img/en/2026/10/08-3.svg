<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Every day at 05:30 — candidates, extraction, judge-model gate, Claude, calculator, blank cells</text><rect x="40" y="100" width="180" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="115.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① Pick candidates</text><text x="130.0" y="134.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Design/construction bids</text><text x="130.0" y="148.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">≤ 180 days · 100 a day</text><rect x="260" y="100" width="180" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="350.0" y="115.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② Extract attachments</text><text x="350.0" y="134.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PDF · HWP · DOCX → text</text><text x="350.0" y="148.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SOW &gt; notice &gt; other</text><rect x="480" y="100" width="200" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="580.0" y="115.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ Jev scoring (gate)</text><text x="580.0" y="134.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">2 questions per 25,000 chars</text><text x="580.0" y="148.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">$0.042/1M tokens · 0.3–0.5 s</text><path d="M 220 132 L 260 132" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 440 132 L 480 132" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><rect x="720" y="90" width="340" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="890.0" y="112.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Retention keyword OR retention ≥ 0.3  → Claude</text><rect x="720" y="144" width="340" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="890.0" y="166.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pipe ≥ 0.7 → SCREENED_PIPE (no Claude, cells left blank)</text><rect x="720" y="198" width="340" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="890.0" y="220.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pipe &lt; 0.3 · all read · no product name → SCREENED_OUT</text><rect x="720" y="252" width="340" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="890.0" y="274.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Everything else (0.3 ≤ pipe &lt; 0.7)  → Claude</text><path d="M 680 132 L 700 132 L 700 112 L 720 112" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><path d="M 680 132 L 700 132 L 700 166 L 720 166" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><path d="M 680 132 L 700 132 L 700 220 L 720 220" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><path d="M 680 132 L 700 132 L 700 274 L 720 274" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><rect x="480" y="340" width="340" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><g transform="translate(494,362.0) scale(1.0833)"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032