<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Guard layers as of 2026-06-30 — none hard-blocks the incident path (push → pr create → pr merge)</text><rect x="40" y="92" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="122.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Edit</text><rect x="150" y="92" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="300.0" y="112.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">worktree-guard.sh</text><text x="300.0" y="131.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PreToolUse(Edit|Write) · exit 2</text><rect x="470" y="92" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="127" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Blocks source edits in the hub (06-18)</text><rect x="790" y="92" width="270" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="925" y="127" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Edits were in a worktree → n/a</text><rect x="40" y="168" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="198.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Command</text><rect x="150" y="168" width="300" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="300.0" y="188.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">safety-guard.sh</text><text x="300.0" y="207.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PreToolUse(Bash) · exit 2</text><rect x="470" y="168" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="203" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">rm -rf · destructive SQL · force push to main (05-07)</text><rect x="790" y="168" width="270" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="925" y="203" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dev and gh not covered</text><rect x="40" y="244" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="274.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Push</text><rect x="150" y="244" width="300" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="300.0" y="264.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pre-push.sh</text><text x="300.0" y="283.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PreToolUse(Bash) · exit 1</text><rect x="470" y="244" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="279" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Tests + 90% coverage "block" (05-07)</text><rect x="790" y="244" width="270" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="925" y="279" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ message only, push goes out</text><rect x="40" y="320" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="350.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Intent</text><rect x="150" y="320" width="300" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="300.0" y="340.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Delegation prompt rule</text><text x="300.0" y="359.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"No git · gh · PR · merge; edit + tsc/jest only"</text><rect x="470" y="320" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="355" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Added the day of the incident (06-23)</text><rect x="790" y="320" width="270" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="925" y="355" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Only as long as it's obeyed</text><rect x="40" y="396" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="426.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Tools</text><rect x="150" y="396" width="300" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="300.0" y="416.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">agents tools:</text><text x="300.0" y="435.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">unset on 9 modifiers/generators</text><rect x="470" y="396" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="431" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">= inherits everything (still)</text><rect x="790" y="396" width="270" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="925" y="431" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ all of Bash</text><rect x="40" y="472" width="90" height="60" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="85.0" y="502.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Server</text><rect x="150" y="472" width="300" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="300.0" y="492.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">dev branch protection</text><text x="300.0" y="511.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">none</text><rect x="470" y="472" width="300" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="620" y="507" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CI is not a required check (still)</text><rect x="790" y="472" width="270" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="925" y="507" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✗ a 7-second merge is possible</text><text x="550" y="572" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">You need a guard per threat model — the guard against index tangles doesn't stop an agent from merging</text><path class="anim" d="M 120 122 L 150 122" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0750;0.1250;1" values="0;0;0.35;0.35;0;0"/></path><circle class=