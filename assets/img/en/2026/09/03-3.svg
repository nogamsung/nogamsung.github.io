<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">STOMP topics are per user, so excludeUserId can't leave out just one of the responder's devices</text><text x="550.0" y="62" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Send to everyone and let each client recognize its own echo</text><text x="60" y="110" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Before</text><rect x="60" y="130" width="160" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="147.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B's device A (web)</text><text x="140.0" y="167.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Accept button</text><rect x="330" y="130" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="430.0" y="140.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Messenger API</text><text x="430.0" y="160.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CALL_ACCEPTED</text><text x="430.0" y="175.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">excludeUserId = B</text><rect x="640" y="130" width="180" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="730.0" y="147.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/topic/user.{B}</text><text x="730.0" y="167.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">all of B's devices subscribe</text><rect x="880" y="100" width="190" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="975.0" y="125.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B's device A (web)</text><rect x="880" y="170" width="190" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="975.0" y="195.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B's device B (phone) 🔔</text><path d="M 220 158 L 330 158" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="275.0" y="148.0" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">POST /join</text><path d="M 530 158 L 640 158" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="585.0" y="148.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B excluded</text><text x="585" y="172" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">not sent</text><path d="M 820 150 L 880 125" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><path d="M 820 165 L 880 195" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#a-muted)"/><text x="560" y="240" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The server has no way to say "all of B's devices except A" → the phone keeps ringing</text><text x="60" y="280" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After</text><rect x="60" y="300" width="160" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="317.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B's device A (web)</text><text x="140.0" y="337.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">_acceptingCallId = id</text><rect x="330" y="300" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="430.0" y="310.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Messenger API</text><text x="430.0" y="330.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CALL_ACCEPTED</text><text x="430.0" y="345.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">excludeUserId = null (all)</text><rect x="640" y="300" width="180" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="730.0" y="328.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">/topic/user.{B}</text><rect x="880" y="270" width="190" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="975.0" y="295.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Device A: own echo → ignore</text><rect x="880" y="340" width="190" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="975.0" y="355.0" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Device B: my userId JOINED</text><text x="975.0" y="373.5" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ dismiss ringing 🔕</text><path d="M 220 328 L 330 328" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="275.0" y="318.0" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">POST /join</text><path d="M 530 328 L 640 328" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="585.0" y="318.0" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">published</text><path d="M 820 320 L 880 295" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/><path d="M 820 335 L 880 365" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#a-green)"/><rect x="60" y="410" width="1020" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="570.0" y="428.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">+ CALL_CANCELLED push to every participant → clears CallKit / service worker ringing.</text><text x="570.0" y="447.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(Two months later: iOS VoIP push was narrowed back to CALL_RINGING only)</text><rect x="60" y="480" width="1020" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="570.0" y="498.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The server can't tell "this device" from "my other device" (same userId).</text><text x="570.0" y="517.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Only the client's in-progress flag can.</text><path class="anim" d="M 220 158 L 330 158" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0645;0.1048;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0645;0.0695;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0645;1" path="M 220 158 L 330 158"/></circle><path class="anim" d="M 530 158 L 640 158" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.1048;0.1148;0.1694;0.2984;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.1048;0.1098;0.1694;0.1744;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1048;0.1694;1" path="M 530 158 L 640 158"/></circle><path class="anim" d="M 220 328 L 330 328" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.2984;0.3084;0.3629;0.4032;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.2984;0.3034;0.3629;0.3679;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2984;0.3629;1" path="M 220 328 L 330 328"/></circle><path class="anim" d="M 530 328 L 640 328" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.4032;0.4132;0.4677;0.5081;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.4032;0.4082;0.4677;0.4727;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4032;0.4677;1" path="M 530 328 L 640 328"/></circle><path class="anim" d="M 820 320 L 880 295" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.5081;0.5181;0.5565;0.5968;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.5081;0.5131;0.5565;0.5615;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5081;0.5565;1" path="M 820 320 L 880 295"/></circle><path class="anim" d="M 820 335 L 880 365" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.5968;0.6068;0.6452;0.8387;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="6.20s" repeatCount="indefinite" keyTimes="0;0.5968;0.6018;0.6452;0.6502;1" values="0;0;1;1;0;0"/><animateMotion dur="6.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5968;0.6452;1" path="M 820 335 L 880 365"/></circle></svg>