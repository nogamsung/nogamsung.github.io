<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Another holder shows up with the old token 61s after rotation: flagged as theft, every session revoked</text><rect x="65" y="80" width="190" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="160.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Web app D middleware</text><path d="M 160 124 L 160 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="325" y="80" width="190" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="420.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Web app B middleware</text><path d="M 420 124 L 420 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="605" y="80" width="190" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="700.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account service</text><path d="M 700 124 L 700 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="865" y="80" width="190" height="44" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="960.0" y="102.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redis ledger</text><path d="M 960 124 L 960 560" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><path d="M 160 170 L 700 170" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="430.0" y="160.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 30 min later: /auth/token (A)</text><path d="M 700 200 L 960 200" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="190.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEL active:A = 1 (winner)</text><path d="M 960 230 L 700 230" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="242.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">register new jti B, rotated:A = DONE(B)  TTL 60s</text><path d="M 700 260 L 160 260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="430.0" y="272.0" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② new pair (refresh = B): only web app D's cookie has B</text><rect x="80" y="300" width="940" height="36" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="318.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">… 61 seconds later, the user finally opens the web app B tab. Its refresh cookie still holds A …</text><path d="M 420 370 L 700 370" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="560.0" y="360.0" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ /auth/token (A)</text><path d="M 700 400 L 960 400" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="830.0" y="390.0" font-size="11" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEL active:A = 0, GET rotated:A = nil (TTL expired)</text><path d="M 960 440 L 700 440" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="830.0" y="457.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ "reuse = theft" → revokeAll: delete active:B, rotated:A = REVOKED</text><path d="M 700 480 L 420 480" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="560.0" y="470.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">401</text><path d="M 700 520 L 160 520" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="430.0" y="532.0" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤ the next reissue (B) also gets 401: all six are signed out</text><rect x="80" y="575" width="940" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="550.0" y="590.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The "theft" was a copy I had planted myself. Concurrent tabs (60s grace) were handled,</text><text x="550.0" y="609.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">but independent holders with no upper bound on timing were never considered.</text><path class="anim" d="M 160 170 L 700 170" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0656;0.0929;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0656;0.0706;1" values="0;0;1;1;0;0"/><animateMotion dur="9.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0656;1" path="M 160 170 L 700 170"/></circle><path class="anim" d="M 700 200 L 960 200" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="9.