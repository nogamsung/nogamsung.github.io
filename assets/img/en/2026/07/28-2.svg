<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Zombie socket — client A, closed by a folder switch, revives 1 s later via an unguarded close handler</text><rect x="50" y="86" width="160" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="106.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">React effect</text><path d="M 130 126 L 130 500" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="320" y="86" width="160" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="400.0" y="106.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Client A</text><path d="M 400 126 L 400 500" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="540" y="86" width="160" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="620.0" y="106.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Client B</text><path d="M 620 126 L 620 500" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><rect x="800" y="86" width="160" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="880.0" y="106.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Spring broker</text><path d="M 880 126 L 880 500" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 5"/><path d="M 130 150 L 400 150" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="271.0" y="142" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① folder switch → cleanup → A.deactivate()</text><path d="M 400 185 L 880 185" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="640.0" y="177" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② DISCONNECT receipt:close-1</text><path d="M 880 220 L 400 220" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><text x="640.0" y="212" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ RECEIPT → socket close → onWebSocketClose (no guard)</text><path d="M 130 265 L 620 265" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="375.0" y="257" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ new effect → B.activate() → SUBSCRIBE /topic/mail.42</text><path d="M 400 296 L 520 296 L 520 324 L 400 324" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="530" y="314" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑤ 1 s later A.deactivate().then(A.activate())  ← zombie</text><path d="M 400 350 L 880 350" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="640.0" y="342" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑥ A: CONNECT → stale closure's subscribe(A) → SUBSCRIBE /topic/mail.42</text><path d="M 880 410 L 620 410" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="750.0" y="402" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑦ NEW_MAIL → B: incrementUnread()</text><path d="M 880 445 L 400 445" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="640.0" y="437" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">⑦ NEW_MAIL → A (zombie): incrementUnread()  → +2</text><text x="1060" y="490" font-size="11" font-weight="600" fill="#6b7280" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Provider mounted in 3 layouts → every section switch adds a permanent zombie</text><rect x="40" y="520" width="1020" height="120" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="536" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">StrictMode was innocent (checked in the source)</text><text x="550" y="560" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">React 18.3.1 runs mount → cleanup → mount synchronously inside flushPassiveEffectsImpl — no microtask can slip in between</text><text x="550" y="582" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">stompjs 7.3.0 _connect() rechecks if (!this.active) return after await beforeConnect — a sync deactivate means no socket is opened</text><text x="550" y="604" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">→ StrictMode only causes a duplicate backfill() call. The real duplicate subscription came from the unguarded reconnect in ③→⑤</text><path class="anim" d="M 130 150 L 400 150" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.45s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0537;0.0872;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.45s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0537;0.0587;1" values="0;0;1;1;0;0"/><animateMotion dur="7.45s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0537;1" path="M 130 150 L 400 150"/></circle><path class="anim" d="M 400 185 L 880 185" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity