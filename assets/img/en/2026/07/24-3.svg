<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">First-entry race — the direct WebSocket's CONNECTED beats the BFF-routed REST call and is lost</text><text x="60" y="120" font-size="14" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">WS</text><text x="60" y="240" font-size="14" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">REST</text><path d="M 130 130 L 330 130" fill="none" stroke="#2563eb" stroke-width="6"/><text x="230" y="92" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">browser → backend direct: 1 hop, JWT signature check only</text><rect x="330" y="100" width="150" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="405.0" y="117.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CONNECTED</text><text x="405.0" y="137.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">setConnectionStatus()</text><rect x="540" y="100" width="230" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="655.0" y="117.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">conversations: {}</text><text x="655.0" y="137.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">no entries → nothing to update</text><text x="800" y="134" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">✕ lost (no-op)</text><path d="M 480 128 L 540 128" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 130 250 L 640 250" fill="none" stroke="#d97706" stroke-width="6"/><text x="380" y="236" font-size="10" font-weight="600" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">browser → BFF route → backend → DB (30 rows + mentions, attachments, reactions) → BFF → browser</text><rect x="640" y="220" width="170" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="725.0" y="237.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">mergeHistory()</text><text x="725.0" y="257.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">creates the entry</text><rect x="850" y="220" width="210" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="955.0" y="237.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">connectionStatus:</text><text x="955.0" y="257.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"DISCONNECTED" (default)</text><path d="M 810 248 L 850 248" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="550" y="300" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">The socket is already CONNECTED, so no status event comes again → the banner sticks and the input stays disabled.</text><text x="550" y="320" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">In the next room REST is faster (warmed up) and the order flips — hence "only on first entry".</text><rect x="40" y="340" width="500" height="230" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="356" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Before: connection status inside each conversation entry</text><text x="290" y="380" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">conversations: {</text><text x="290" y="402" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">  "dm:7": { messages, readState,</text><text x="290" y="424" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">            connectionStatus }   ← copied per resource</text><text x="290" y="446" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">}</text><text x="290" y="468" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">setConnectionStatus: loops over existing entries only</text><text x="290" y="520" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">race: entry creation vs. status event arrival</text><rect x="580" y="340" width="480" height="230" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="594" y="356" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">After (#753): a top-level store field</text><text x="820" y="380" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">conversations: { "dm:7": { messages, readState } }</text><text x="820" y="402" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">connectionStatus: "CONNECTED"   ← per client</text><text x="820" y="424" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace"></text><text x="820" y="446" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">setConnectionStatus: (s) =&gt; set({ connectionStatus: s })</text><text x="820" y="468" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">useMessageStore((s) =&gt; s.connectionStatus)</text><text x="820" y="520" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">recorded whether or not an entry exists → no race</text><path class="anim" d="M 130 130 L 330 130" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1500;0.1500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1500;0.1550;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1500;1" path="M 130 130 L 330 130"/></circle><path class="anim" d="M 480 128 L 540 128" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.1500;0.1600;0.2250;0.7500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.1500;0.1550;0.2250;0.2300;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1500;0.2250;1" path="M 480 128 L 540 128"/></circle><path class="anim" d="M 130 250 L 640 250" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.5500;0.5500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.5500;0.5550;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.5500;1" path="M 130 250 L 640 250"/></circle><path class="anim" d="M 810 248 L 850 248" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.5500;0.5600;0.6250;0.7500;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.00s" repeatCount="indefinite" keyTimes="0;0.5500;0.5550;0.6250;0.6300;1" values="0;0;1;1;0;0"/><animateMotion dur="4.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5500;0.6250;1" path="M 810 248 L 850 248"/></circle></svg>