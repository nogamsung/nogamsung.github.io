<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Reconnect flapping — deactivate() calls onWebSocketClose again, and onConnect resets the count to 0</text><rect x="40" y="86" width="300" height="300" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">stompjs ActivationState</text><rect x="90" y="116" width="200" height="58" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="190.0" y="128.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ACTIVE</text><text x="190.0" y="148.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">after activate();</text><text x="190.0" y="162.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">a socket drop doesn't change it</text><rect x="90" y="210" width="200" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="190.0" y="225.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DEACTIVATING</text><text x="190.0" y="245.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">right after deactivate()</text><rect x="90" y="300" width="200" height="50" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="190.0" y="315.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">INACTIVE</text><text x="190.0" y="335.0" font-size="10" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">once the socket is closed</text><path d="M 190 174 L 190 210" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="190.0" y="190.0" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate()</text><path d="M 190 260 L 190 300" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 290 325 L 320 325 L 320 145 L 290 145" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="316" y="235" font-size="11" font-weight="700" fill="#059669" text-anchor="end" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">activate()</text><text x="190" y="372" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">client.active === (state === ACTIVE)</text><rect x="400" y="110" width="180" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="490.0" y="138.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Network drop ✕</text><rect x="640" y="110" width="200" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="740.0" y="127.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onWebSocketClose</text><text x="740.0" y="147.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt 0 → 1, banner ON</text><rect x="900" y="110" width="160" height="56" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="980.0" y="138.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">1 s timer</text><rect x="900" y="230" width="160" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="980.0" y="247.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivate()</text><text x="980.0" y="267.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">ACTIVE → DEACTIVATING</text><rect x="640" y="230" width="200" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="740.0" y="247.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onWebSocketClose (again)</text><text x="740.0" y="267.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt 1 → 2, another timer</text><rect x="900" y="350" width="160" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="980.0" y="378.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">activate()</text><rect x="640" y="350" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="740.0" y="367.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">onConnect</text><text x="740.0" y="387.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">attempt = 0  ← cap never hit</text><path d="M 580 138 L 640 138" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><path d="M 840 138 L 900 138" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 980 166 L 980 230" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 900 258 L 840 258" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="860" y="306" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">keeps the app callback and calls it</text><path d="M 980 286 L 980 350" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="986" y="318" font-size="10" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.then(() =&gt; activate())</text><path d="M 900 378 L 840 378" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 740 406 L 740 440 L 490 440 L 490 166" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-red)"/><text x="615.0" y="454.0" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">next drop → start over</text><rect x="400" y="476" width="660" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="730" y="498" font-size="13" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fix (#349): if (!client.active) return; at the top of onWebSocketClose and in the timer body</text><text x="730" y="520" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Deactivating: state is DEACTIVATING → active is false → no reconnect</text><text x="730" y="540" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Network drop: state stays ACTIVE → reconnect exactly once</text><text x="730" y="562" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Unmount's deactivate() takes the same path, so the zombie sockets went away too</text><path class="anim" d="M 580 138 L 640 138" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0721;0.1171;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0721;0.0771;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0721;1" path="M 580 138 L 640 138"/></circle><path class="anim" d="M 840 138 L 900 138" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.1171;0.1271;0.1712;0.2162;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.1171;0.1221;0.1712;0.1762;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1171;0.1712;1" path="M 840 138 L 900 138"/></circle><path class="anim" d="M 980 166 L 980 230" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.2162;0.2262;0.2883;0.3333;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.55s" repeatCount="indefinite" keyTimes="0;0.2162;0.2212;0.2883;0.2933;1" values="0;0;1;1;0;0"/><animateMotion dur="5.55s" r