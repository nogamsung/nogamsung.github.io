<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Split 10 test accounts in half — migrate 1–5 before the main query, verify 6–10 after it runs</text><rect x="40" y="90" width="330" height="330" rx="14" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#2563eb" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Pre-run test (IDs 1–5)</text><rect x="55" y="126" width="300" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205.0" y="152.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① Confirm targets (not there yet)</text><rect x="55" y="196" width="300" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205.0" y="222.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② INSERT just these 5 via IN</text><rect x="55" y="266" width="300" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205.0" y="292.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ Check the hashes in the DB</text><rect x="55" y="336" width="300" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="205.0" y="362.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ Log in on the app and web</text><path d="M 205 178 L 205 196" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 205 248 L 205 266" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 205 318 L 205 336" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="385" y="90" width="330" height="330" rx="14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="399" y="106" font-size="13" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Main query (everyone)</text><rect x="400" y="126" width="300" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="152.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① COUNT the rows to migrate</text><rect x="400" y="196" width="300" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="222.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② Confirm 6–10 are not there yet</text><rect x="400" y="266" width="300" height="52" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="292.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ Full INSERT … SELECT</text><path d="M 550 178 L 550 196" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 550 248 L 550 266" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="730" y="90" width="330" height="330" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><text x="744" y="106" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Post-run check (IDs 6–10)</text><rect x="745" y="126" width="300" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="895.0" y="152.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① Check the hashes in the DB</text><rect x="745" y="196" width="300" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="895.0" y="222.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② Log in on the app and web</text><path d="M 895 178 L 895 196" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><path d="M 370 255 L 385 255" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><path d="M 715 255 L 730 255" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="550" y="452" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">1–5 are already migrated, so the main query's LEFT JOIN … IS NULL skips them — rerunning it adds no duplicates</text><path class="anim" d="M 205 178 L 205 196 L 205 248 L 205 266 L 205 318 L 205 336" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.2308;0.2885;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.2308;0.2358;1" values="0;0;1;1;0;0"/><animateMotion dur="5.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.2308;1" path="M 205 178 L 205 196 L 205 248 L 205 266 L 205 318 L 205 336"/></circle><path class="anim" d="M 550 178 L 550 196 L 550 248 L 550 266" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.2885;0.2985;0.4615;0.5192;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.2885;0.2935;0.4615;0.4665;1" values="0;0;1;1;0;0"/><animateMotion dur="5.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2885;0.4615;1" path="M 550 178 L 550 196 L 550 248 L 550 266"/></circle><path class="anim" d="M 895 178 L 895 196" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.5192;0.5292;0.6154;0.8077;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.20s" repeatCount="indefinite" keyTimes="0;0.5192;0.5242;0.6154;0.6204;1" values="0;0;1;1;0;0"/><animateMotion dur="5.20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5192;0.6154;1" path="M 895 178 L 895 196"/></circle></svg>