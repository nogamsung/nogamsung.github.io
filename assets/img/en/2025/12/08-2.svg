(2025-12-08)</text><rect x="590" y="116" width="200" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="690.0" y="135.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BaseEntity</text><text x="690.0" y="156.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">status, audit columns</text><rect x="830" y="116" width="210" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/><text x="935.0" y="128.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Clock (now)</text><text x="935.0" y="149.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LocalDate.now() by default,</text><text x="935.0" y="164.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">injected in tests</text><rect x="590" y="206" width="105" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="642.5" y="226.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Order</text><path d="M 642 206 L 702.0 176" fill="none" stroke="#6b7280" stroke-width="1"/><rect x="705" y="206" width="105" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="757.5" y="226.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Sales</text><path d="M 757 206 L 777.0 176