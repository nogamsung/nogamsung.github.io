ext><rect x="60" y="296" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="70" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  Steel C      ACTIVE</text><rect x="60" y="322" width="290" height="26" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="205" y="339" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(row 2 is gone)</text><rect x="405" y="270" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="415" y="287.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">1  Steel A  deleted_at NULL</text><rect x="405" y="296" width="290" height="26" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="415" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">2  Steel B  deleted_at 2025-06-16</text><rect x="405" y="322" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="415" y="339.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  Steel C  deleted_at NULL</text><rect x="750" y="270" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760" y="287.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">1  Steel A      ACTIVE</text><rect x="750" y="296" width="290" height="26" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="760" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">2  Steel B      DEACTIVATE</text><rect x="750" y="322" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760" y="339.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  Steel C      ACTIVE</text><rect x="40" y="368" width="330" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="205.0" y="400.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">orders.company_id → 2 is orphaned.</text><text x="205.0" y="418.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">FK error, or cascade wipes business records.</text><text x="205.0" y="436.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">No audit trail. Ruled out from commit one.</text><rect x="385" y="368" width="330" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="391.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Only two states. IS NULL on every query.</text><text x="550.0" y="409.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">update_* audit columns already say</text><text x="550.0" y="427.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"when and who". A state like "on hold"</text><text x="550.0" y="445.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">would need yet another column.</text><rect x="730" y="368" width="330" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="895.0" y="391.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Reversible (flip back to ACTIVE).</text><text x="895.0" y="409.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">update_user_id / update_datetime</text><text x="895.0" y="427.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">are updated along with it. The same column</text><text x="895.0" y="445.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">can hold business states later.</text><rect x="40" y="490" width="1020" height="70" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="518" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Every repository spells out where status = 'ACTIVE' (10 implementations, 30 places): a visible condition, not a global guard</text><text x="550" y="542" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">No UNIQUE constraints · services deactivate children explicitly (no cascade) · not a single DELETE statement in the repo</text><path class="anim" d="M 205 222 L 205 262" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1364;0.2273;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1364;0.1414;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1364;1" path="M 205 222 L 205 262"/></circle><path class="anim" d="M 550 222 L 550 262" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.2273;0.2373;0.3636;0.4545;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.2273;0.2323;0.3636;0.3686;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2273;0.3636;1" path="M 550 222 L 550 262"/></circle><path class="anim" d="M 895 222 L 895 262" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.4545;0.4645;0.5909;0.7727;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.4545;0.4595;0.5909;0.5959;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" 