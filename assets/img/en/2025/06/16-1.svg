<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Three ways to forget a row: hard delete, deleted_at, a status column</text><rect x="40" y="86" width="330" height="38" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="205.0" y="105.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A. Hard delete</text><rect x="60" y="140" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="70" y="157.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">1  Steel A      ACTIVE</text><rect x="60" y="166" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="70" y="183.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">2  Steel B      ACTIVE</text><rect x="60" y=