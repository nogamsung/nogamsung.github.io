<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Fetch offers with one IN query, group them into a Map, attach them back to users (example ids)</text><rect x="40" y="90" width="220" height="230" rx="14" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① Page&lt;User&gt;</text><rect x="60" y="124" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="146.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 22</text><rect x="60" y="182" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="204.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 23</text><rect x="60" y="240" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="262.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 24</text><path d="M 260 205 L 300 205" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="300" y="160" width="200" height="90" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="400.0" y="194.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② userIds</text><text x="400.0" y="215.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">[22, 23, 24, …]</text><path d="M 500 205 L 540 205" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="540" y="150" width="200" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="640.0" y="187.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ One offer query</text><text x="640.0" y="207.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">offer.user.id.in(userIds)</text><text x="640.0" y="222.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">offer.team.id.eq(teamId)</text><path d="M 740 205 L 780 205" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="780" y="90" width="280" height="230" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><text x="794" y="106" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ groupingBy(user id)</text><rect x="800" y="124" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="920.0" y="146.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">22 → [Offer A]</text><rect x="800" y="182" width="240" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="920.0" y="204.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">24 → [Offer B, Offer C]</text><rect x="800" y="240" width="240" height="44" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="920.0" y="262.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">23 → none</text><rect x="40" y="350" width="1020" height="80" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="376" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">users.stream().map(u -&gt; new ProfileOfferResponse(u, oMap.getOrDefault(u.getId(), emptyList())))</text><text x="550" y="404" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 23 has no offers, so getOrDefault hands it an empty list — no extra query per user</text><path class="anim" d="M 260 205 L 300 205" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.45s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0899;0.1461;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" strok