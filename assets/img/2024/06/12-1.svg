xt><rect x="456" y="338" width="190" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="551.0" y="367.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@Table</text><text x="551.0" y="388.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">schema.table → catalog</text><rect x="658" y="338" width="190" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="753.0" y="367.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Querydsl</text><text x="753.0" y="388.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">템플릿 코드 점검</text><rect x="860" y="338" width="190" height="80" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="955.0" y="367.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">buildspec.yml</text><text x="955.0" y="388.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Java 버전 변경</text><path d="M 910 266 L 910 300" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="550" y="472" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">2.7.18에서 deprecated 경고를 먼저 걷어 내면, 3.x로 넘어갈 때 깨지는 곳이 "제거된 API"로 좁혀진다</text><path class="anim" d="M 190 181 L 340 181 L 400 181 L 550 181" fill="none" stroke="#2563eb" stroke-width="5" stro