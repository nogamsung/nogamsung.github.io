eight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">PostgreSQL :5432</text><text x="715.0" y="388.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DB: kong · konga</text><rect x="930" y="130" width="150" height="80" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="1005.0" y="159.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Spring 서버</text><text x="1005.0" y="180.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">업스트림</text><path d="M 170 170 L 240 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 620 170 L 930 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><text x="775.0" y="158.0" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Route /api/spring → Service</text><path d="M 170 365 L 240 365" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 365 325 L 365 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><text x="377" y="283" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Admin API :8001</text><path d="M 580 240 L 580 280 L 715 280 L 715 325" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="727" y="300" font-size="12" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-s