<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">락이 없으면 두 서버가 같은 상태를 읽고 둘 다 처리한다 — 분산 락은 같은 key의 요청을 한 줄로 세운다</text><rect x="30" y="84" width="1040" height="210" rx="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="100" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">락 없음 — 서버마다 따로 확인한다</text><text x="80" y="150" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버 A</text><text x="80" y="230" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버 B</text><rect x="140" y="128" width="200" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="240.0" y="150.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 조회: 아직 없음</text><rect x="300" y="208" width="200" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="400.0" y="230.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② 조회: 아직 없음</text><rect x="500" y="128" width="210" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="605.0" y="150.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ 처리하고 저장</text><rect x="680" y="208" width="220" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="790.0" y="230.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">④ 처리하고 또 저장</text><rect x="920" y="138" width="130" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="985.0" y="180.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">같은 요청이</text><text x="985.0" y="199.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">두 번 처리된다</text><text x="540" y="274" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">B가 조회한 시점에는 A가 아직 저장하지 않았다 — synchronized는 JVM 하나 안에서만 막는다</text><rect x="30" y="314" width="1040" height="210" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><text x="44" y="330" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Redisson 락 — key = 'function_' + #request.id</text><text x="80" y="380" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버 A</text><text x="80" y="460" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">서버 B</text><rect x="140" y="358" width="140" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="210.0" y="380.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">락 획득</text><rect x="300" y="358" width="230" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="415.0" y="380.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">조회 · 처리 · 저장</text><rect x="550" y="358" width="110" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="605.0" y="380.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">unlock</text><rect x="140" y="438" width="520" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/><text x="400.0" y="460.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">tryLock 대기 (최대 waitTime 5초)</text><rect x="680" y="438" width="220" height="44" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="790.0" y="460.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">락 획득 → 조회</text><rect x="920" y="368" width="130" height="104" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="985.0" y="410.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">A가 저장한</text><text x="985.0" y="429.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결과가 보인다</text><text x="540" y="504" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">같은 key를 가진 요청만 기다린다 — key가 다른 요청은 서로 막지 않는다</text><path class="anim" d="M 140 150 L 710 150" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1795;0.2115;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1795;0.1845;1" values="0;0;1;1;0;0"/><animateMotion dur="7.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1795;1" path="M 140 150 L 710 150"/></circle><path class="anim" d="M 300 230 L 900 230" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.2115;0.2215;0.3910;0.4551;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.2115;0.2165;0.3910;0.3960;1" values="0;0;1;1;0;0"/><animateMotion dur="7.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2115;0.3910;1" path="M 300 230 L 900 230"/></circle><path class="anim" d="M 140 380 L 660 380" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.4551;0.4651;0.6346;0.6667;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.4551;0.4601;0.6346;0.6396;1" values="0;0;1;1;0;0"/><animateMotion dur="7.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4551;0.6346;1" path="M 140 380 L 660 380"/></circle><path class="anim" d="M 660 460 L 900 460" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.6667;0.6767;0.7692;0.8718;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="7.80s" repeatCount="indefinite" keyTimes="0;0.6667;0.6717;0.7692;0.7742;1" values="0;0;1;1;0;0"/><animateMotion dur="7.80s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.7692;1" path="M 660 460 L 900 460"/></circle></svg>