<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">LEFT JOIN … IS NULL은 아직 옮기지 않은 회원만 고른다 — 테스트로 미리 옮긴 1~5는 INSERT 대상에서 빠진다</text><text x="160" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">users</text><text x="460" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">user_password (LEFT JOIN)</text><text x="860" y="104" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">INSERT 되는 행</text><rect x="60" y="124" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="144.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 4</text><path d="M 260 144 L 330 144" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="124" width="260" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="460.0" y="144.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 4 · 해시 있음</text><rect x="60" y="176" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="196.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 5</text><path d="M 260 196 L 330 196" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="176" width="260" height="40" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="460.0" y="196.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 5 · 해시 있음</text><rect x="60" y="228" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="248.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 6</text><path d="M 260 248 L 330 248" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="228" width="260" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="248.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NULL → 대상</text><path d="M 590 248 L 700 248" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="700" y="228" width="330" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="865.0" y="248.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(6, SHA2(password, 256))</text><rect x="60" y="280" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="300.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 7</text><path d="M 260 300 L 330 300" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="280" width="260" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="300.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NULL → 대상</text><path d="M 590 300 L 700 300" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="700" y="280" width="330" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="865.0" y="300.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(7, SHA2(password, 256))</text><rect x="60" y="332" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="352.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 8</text><path d="M 260 352 L 330 352" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="332" width="260" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="352.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NULL → 대상</text><path d="M 590 352 L 700 352" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="700" y="332" width="330" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="865.0" y="352.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(8, SHA2(password, 256))</text><rect x="60" y="384" width="200" height="40" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="160.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 9</text><path d="M 260 404 L 330 404" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="330" y="384" width="260" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="460.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NULL → 대상</text><path d="M 590 404 L 700 404" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="700" y="384" width="330" height="40" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="865.0" y="404.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(9, SHA2(password, 256))</text><text x="865" y="170" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">이미 있으니 건너뛴다</text><text x="550" y="452" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SHA2(…, 256)은 64자리 16진수 문자열을 돌려준다 · 솔트가 없어서 같은 값은 항상 같은 해시가 된다</text><path class="anim" d="M 160 248 L 260 248 L 330 248 L 590 248 L 700 248 L 865 248" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.3182;0.3864;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.3182;0.3232;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.3182;1" path="M 160 248 L 260 248 L 330 248 L 590 248 L 700 248 L 865 248"/></circle><path class="anim" d="M 160 144 L 260 144 L 330 144 L 460 144" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.3864;0.3964;0.5909;0.7727;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.3864;0.3914;0.5909;0.5959;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3864;0.5909;1" path="M 160 144 L 260 144 L 330 144 L 460 144"/></circle></svg>