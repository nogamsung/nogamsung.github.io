<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">RedissonLockAspect가 하는 일 — key 계산, tryLock, 본 메서드 실행, finally에서 unlock</text><rect x="40" y="100" width="180" height="76" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="130.0" y="127.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">메서드 호출</text><text x="130.0" y="148.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@RedissonLock</text><rect x="250" y="100" width="180" height="76" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="340.0" y="127.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">key 계산</text><text x="340.0" y="148.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SpEL: #request.id</text><rect x="460" y="100" width="180" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="127.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">tryLock</text><text x="550.0" y="148.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">waitTime 5초 · leaseTime 2초</text><rect x="670" y="100" width="180" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="760.0" y="127.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">proceed()</text><text x="760.0" y="148.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">본 메서드 실행</text><rect x="880" y="100" width="180" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="970.0" y="127.5" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">finally</text><text x="970.0" y="148.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">획득했으면 unlock()</text><path d="M 220 138 L 250 138" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 430 138 L 460 138" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 640 138 L 670 138" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 850 138 L 880 138" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><text x="655" y="116" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">성공</text><rect x="330" y="240" width="340" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="500.0" y="267.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">획득 실패 → return false</text><text x="500.0" y="288.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">void 메서드면 이 값은 버려진다 — 예외가 낫다</text><path d="M 510 176 L 510 240" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><text x="520" y="208" font-size="11" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">waitTime 초과</text><rect x="700" y="240" width="360" height="76" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="880.0" y="267.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">leaseTime 2초가 지나면</text><text x="880.0" y="288.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">메서드가 안 끝나도 락이 풀린다 · unlock()이 실패한다</text><path d="M 760 176 L 760 240" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-amber)"/><text x="550" y="370" font-size="13" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">unlock()을 try/catch로 한 번 더 감싼 이유: 이미 풀린 락을 풀려고 하면 IllegalMonitorStateException이 난다</text><path class="anim" d=