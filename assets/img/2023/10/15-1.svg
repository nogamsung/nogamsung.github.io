unt="indefinite" keyTimes="0;0.3700;0.3750;0.5100;0.5150;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3700;0.5100;1" path="M 280 240 L 320 240 L 320 315 L 360 315"/></circle><path class="anim" d="M 620 315 L 680 315" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.5600;0.5700;0.6400;0.8000;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.5600;0.5650;0.6400;0.6450;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5600;0.6400;1" path="M 620 315 L 680 315"/></circle></svg>