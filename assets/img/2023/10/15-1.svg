<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">조건 메서드가 null 을 돌려주면 Querydsl 은 그 조건을 빼고 SQL 을 만든다</text><rect x="40" y="190" width="240" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="160.0" y="219.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">positionEq(position)</text><text x="160.0" y="240.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">where(…) 안에서 호출</text><rect x="360" y="110" width="260" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="490.0" y="134.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">BACKEND 일 때</text><text x="490.0" y="155.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user.position.eq(position)</text><rect x="360" y="280" width="260" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="490.0" y="304.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">NONE 일 때</text><text x="490.0" y="325.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">null 반환 → 조건에서 빠짐</text><path d="M 280 220 L 320 220 L 320 145 L 360 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 280 240 L 320 240 L 320 315 L 360 315" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="680" y="110" width="380" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="870" y="133" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">WHERE user_id &lt; ?</text><text x="870" y="151" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">  AND position = 'BACKEND'</text><rect x="680" y="280" width="380" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="870" y="304" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">WHERE user_id &lt; ?</text><text x="870" y="322" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">(position 조건 없음)</text><path d="M 620 145 L 680 145" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 620 315 L 680 315" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><text x="550" y="410" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-ba