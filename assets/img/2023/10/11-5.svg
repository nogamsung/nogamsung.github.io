<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">팀 리더가 회원 20명을 조회할 때 — 반복문 안의 조회를 IN 절 하나로 꺼냈다</text><text x="60" y="128" font-size="14" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">개선 전</text><rect x="140" y="106" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="230.0" y="128.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 회원 페이징</text><rect x="350" y="106" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="440.0" y="128.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② 리더인 팀 조회</text><rect x="560" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="598" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="636" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="674" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="712" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="750" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="788" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><rect x="826" y="106" width="32" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="890" y="128" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">…</text><text x="712" y="172" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ 회원마다 제안 SELECT × 20</text><rect x="920" y="100" width="140" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="990.0" y="117.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">총 22번</text><text x="990.0" y="138.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">0.337초</text><path d="M 320 128 L 350 128" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 530 128 L 560 128" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><text x="60" y="258" font-size="14" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">개선 후</text><rect x="140" y="236" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="230.0" y="258.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">① 회원 페이징</text><rect x="350" y="236" width="180" height="44" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="440.0" y="258.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">② 리더인 팀 조회</text><rect x="560" y="236" width="330" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="725.0" y="258.0" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">③ offer.user.id IN (회원 id 20개)</text><rect x="920" y="230" width="140" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="990.0" y="247.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">총 3번</text><text x="990.0" y="268.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">0.039초</text><path d="M 320 258 L 350 258" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><path d="M 530 258 L 560 258" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#a-muted)"/><rect x="60" y="330" width="1000" height="90" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="560" y="360" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">개선 전은 회원 수에 비례해 쿼리가 늘고(2 + N), 개선 후는 회원 수와 상관없이 3번이다</text><text x="560" y="390" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">리더가 아니면 ②에서 팀이 없으니 ③을 건너뛰고 빈 목록을 돌려준다</text><path class="anim" d="M 140 128 L 900 128" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.4000;0.4600;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.4000;0.4050;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.4000;1" path="M 140 128 L 900 128"/></circle><path class="anim" d="M 140 258 L 890 258" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.4600;0.4700;0.6200;0.8000;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.00s" repeatCount="indefinite" keyTimes="0;0.4600;0.4650;0.6200;0.6250;1" values="0;0;1;1;0;0"/><animateMotion dur="5.00s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4600;0.6200;1" path="M 140 258 L 890 258"/></circle></svg>