<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">커서 기반 페이지네이션 — 이전 페이지의 마지막 id 가 다음 요청의 pageFrom 이 된다 (id 는 예시)</text><rect x="40" y="100" width="220" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="124.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">1페이지 요청</text><text x="150.0" y="145.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pageFrom = Long.MAX_VALUE</text><path d="M 260 135 L 300 135" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="300" y="100" width="420" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="124" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">WHERE user_id &lt; 9223372036854775807</text><text x="510" y="144" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">ORDER BY user_id DESC LIMIT 10</text><path d="M 720 135 L 760 135" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="760" y="100" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="124.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">id 100 … 91</text><text x="910.0" y="145.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">10건</text><rect x="40" y="250" width="220" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="150.0" y="274.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">2페이지 요청</text><text x="150.0" y="295.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">pageFrom = 91</text><path d="M 260 285 L 300 285" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="300" y="250" width="420" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="510" y="274" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">WHERE user_id &lt; 91</text><text x="510" y="294" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">ORDER BY user_id DESC LIMIT 10</text><path d="M 720 285 L 760 285" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><rect x="760" y="250" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="274.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">id 90 … 81</text><text x="910.0" y="295.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">10건</text><path d="M 910 170 L 910 210 L 150 210 L 150 250" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><text x="530" y="198" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">마지막 id 91 을 다음 커서로</text><rect x="40" y="360" width="500" height="90" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="290.0" y="386.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">커서 조건은 목록 쿼리에만</text><text x="290.0" y="407.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">count 쿼리는 전체 개수를 세야 하니 user_id &lt; ? 를 넣지 않는다</text><text x="290.0" y="423.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">count 가 0 이면 목록 쿼리는 아예 보내지 않는다</text><rect x="560" y="360" width="500" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="810.0" y="386.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">커서 키 = 정렬 키</text><text x="810.0" y="407.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id &lt; ? 로 자르면 user_id 로 정렬해야</text><text x="810.0" y="423.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">페이지 경계가 어긋나지 않는다</text><path class="anim" d="M 260 135 L 300 135" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0714;0.1161;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0714;0.0764;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0714;1" path="M 260 135 L 300 135"/></circle><path class="anim" d="M 720 135 L 760 135" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1161;0.1261;0.1875;0.2411;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.1161;0.1211;0.1875;0.1925;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1161;0.1875;1" path="M 720 135 L 760 135"/></circle><path class="anim" d="M 910 170 L 910 210 L 150 210 L 150 250" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.2411;0.2511;0.4554;0.4911;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.2411;0.2461;0.4554;0.4604;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2411;0.4554;1" path="M 910 170 L 910 210 L 150 210 L 150 250"/></circle><path class="anim" d="M 260 285 L 300 285" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.5011;0.5625;0.6071;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.4911;0.4961;0.5625;0.5675;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4911;0.5625;1" path="M 260 285 L 300 285"/></circle><path class="anim" d="M 720 285 L 760 285" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.6071;0.6171;0.6786;0.8214;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.60s" repeatCount="indefinite" keyTimes="0;0.6071;0.6121;0.6786;0.6836;1" values="0;0;1;1;0;0"/><animateMotion dur="5.60s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6071;0.6786;1" path="M 720 285 L 760 285"/></circle></svg>