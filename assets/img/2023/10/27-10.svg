<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">지연 로딩은 프록시가 있어야 동작한다 — 일대일에서 프록시를 못 만들면 즉시 SELECT 로 채운다</text><rect x="40" y="90" width="490" height="380" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="106" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@ManyToOne — 프록시를 만들 수 있다</text><rect x="70" y="130" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="170.0" y="154.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Skill 행</text><text x="170.0" y="175.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">user_id = 7</text><rect x="310" y="130" width="190" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="405.0" y="154.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 프록시</text><text x="405.0" y="175.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">id = 7, 아직 비어 있음</text><path d="M 270 165 L 310 165" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><text x="180" y="224" font-size="11" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">외래 키만으로 프록시 생성</text><rect x="70" y="240" width="430" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="285.0" y="259.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">skill.getUser().getName() 을 부를 때</text><text x="285.0" y="279.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">그때 처음 SELECT — 지연 로딩이 지켜진다</text><path d="M 405 200 L 405 240" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="70" y="330" width="430" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="285.0" y="367.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"연관 객체가 있다면 id 는 7" 이라는 사실만으로</text><text x="285.0" y="385.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">프록시를 넣을 수 있다. 없을 수도 있다는 가능성은</text><text x="285.0" y="403.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">외래 키가 NULL 인지로 이미 알 수 있다.</text><rect x="570" y="90" width="490" height="380" rx="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="584" y="106" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@OneToOne — 존재 여부부터 알아야 한다</text><rect x="600" y="130" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="700.0" y="154.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">User 행</text><text x="700.0" y="175.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">연락처가 있나?</text><rect x="840" y="130" width="190" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="935.0" y="154.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">null 인가, 프록시인가</text><text x="935.0" y="174.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">결정하려면 확인이 필요</text><path d="M 800 165 L 840 165" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="600" y="240" width="430" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="815.0" y="259.5" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔티티를 채우는 순간 SELECT contact …</text><text x="815.0" y="279.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">회원 한 명마다 한 번 — N+1</text><path d="M 935 200 L 935 240" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="600" y="330" width="430" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="815.0" y="367.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">특히 외래 키를 갖지 않은 쪽(mappedBy)은</text><text x="815.0" y="385.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">테이블만 보고 연관 객체가 있는지 알 수 없다.</text><text x="815.0" y="403.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">FetchType.LAZY 는 힌트일 뿐, 보장이 아니다.</text><text x="550" y="510" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">해결: default_batch_fetch_size 가 이 조회들을 IN 절 하나로 묶는다 · 관계를 @ManyToOne 으로 바꾸는 방법도 있지만 도메인이 일대일이라 고르지 않았다</text><path class="anim" d="M 270 165 L 310 165" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1064;0.1596;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1064;0.1114;1" values="0;0;1;1;0;0"/><animateMotion dur="4.70s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1064;1" path="M 270 165 L 310 165"/></circle><path class="anim" d="M 405 200 L 405 240" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.1596;0.1696;0.2660;0.3511;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.1596;0.1646;0.2660;0.2710;1" values="0;0;1;1;0;0"/><animateMotion dur="4.70s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1596;0.2660;1" path="M 405 200 L 405 240"/></circle><path class="anim" d="M 800 165 L 840 165" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.3511;0.3611;0.4574;0.5106;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.3511;0.3561;0.4574;0.4624;1" values="0;0;1;1;0;0"/><animateMotion dur="4.70s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3511;0.4574;1" path="M 800 165 L 840 165"/></circle><path class="anim" d="M 935 200 L 935 240" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.5106;0.5206;0.6170;0.7872;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.70s" repeatCount="indefinite" keyTimes="0;0.5106;0.5156;0.6170;0.6220;1" values="0;0;1;1;0;0"/><animateMotion dur="4.70s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5106;0.6170;1" path="M 935 200 L 935 240"/></circle></svg>