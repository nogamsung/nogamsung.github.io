<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">같은 질문 "이 이메일이 있나?", 세 가지 쿼리 — 가져오는 양이 다르다</text><rect x="40" y="86" width="300" height="344" rx="14" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/><text x="54" y="102" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">findByEmail</text><rect x="60" y="120" width="260" height="84" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190.0" y="144.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SELECT 컬럼 6개 전부</text><text x="190.0" y="164.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">contact_id, created_at, updated_at,</text><text x="190.0" y="179.5" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">email, is_verified, verification_code</text><path d="M 190 204 L 190 236" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="60" y="236" width="260" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="190.0" y="257.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔티티로 매핑</text><text x="190.0" y="278.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">Optional&lt;Contact&gt;</text><path d="M 190 300 L 190 332" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/><rect x="60" y="332" width="260" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="190.0" y="357.5" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">214ms</text><text x="190.0" y="380.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">쓰지 않을 값까지 전송·매핑</text><rect x="400" y="86" width="300" height="344" rx="14" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 5"/><text x="414" y="102" font-size="13" font-weight="700" fill="#d97706" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">countByEmail</text><rect x="420" y="120" width="260" height="84" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="151.5" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SELECT count(contact_id)</text><text x="550.0" y="172.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">조건에 맞는 행을 끝까지 센다</text><path d="M 550 204 L 550 236" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="420" y="236" width="260" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="550.0" y="257.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">숫자 하나</text><text x="550.0" y="278.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">int → 1</text><path d="M 550 300 L 550 332" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#a-amber)"/><rect x="420" y="332" width="260" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="357.5" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">196ms</text><text x="550.0" y="380.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">유니크라 1건, 비유니크면 전부 센다</text><rect x="760" y="86" width="300" height="344" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><text x="774" y="102" font-size="13" font-weight="700" fill="#059669" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">existsByEmail</text><rect x="780" y="120" width="260" height="84" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="151.5" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">SELECT contact_id … LIMIT 1</text><text x="910.0" y="172.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">첫 행을 찾으면 멈춘다</text><path d="M 910 204 L 910 236" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="780" y="236" width="260" height="64" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="910.0" y="257.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">참·거짓</text><text x="910.0" y="278.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">boolean → true</text><path d="M 910 300 L 910 332" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a-green)"/><rect x="780" y="332" width="260" height="72" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="910.0" y="357.5" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">166ms</text><text x="910.0" y="380.0" font-size="11" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">필요한 답만 받는다</text><text x="550" y="462" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">5만 건 · email 에 유니크 제약 · tester30000@nogamsung.com 을 한 번씩 조회한 쿼리 로그 기준</text><text x="550" y="490" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">중복 검사에 필요한 답은 "있다/없다" 하나 — 그 답만 묻는 쿼리가 existsBy 다</text><path class="anim" d="M 190 204 L 190 332" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1928;0.2410;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1928;0.1978;1" values="0;0;1;1;0;0"/><animateMotion dur="4.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1928;1" path="M 190 204 L 190 332"/></circle><path class="anim" d="M 550 204 L 550 332" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.2410;0.2510;0.3976;0.4458;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#d97706" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.2410;0.2460;0.3976;0.4026;1" values="0;0;1;1;0;0"/><animateMotion dur="4.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2410;0.3976;1" path="M 550 204 L 550 332"/></circle><path class="anim" d="M 910 204 L 910 332" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.4458;0.4558;0.5663;0.7590;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#059669" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.15s" repeatCount="indefinite" keyTimes="0;0.4458;0.4508;0.5663;0.5713;1" values="0;0;1;1;0;0"/><animateMotion dur="4.15s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4458;0.5663;1" path="M 910 204 L 910 332"/></circle></