ic Neo','Noto Sans KR',sans-serif">분리 후 (2025-12-08): 모듈 6개</text><rect x="560" y="120" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="635.0" y="139.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">erp-api</text><text x="635.0" y="160.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">bootJar</text><rect x="730" y="120" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="805.0" y="139.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account-api</text><text x="805.0" y="160.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">bootJar</text><rect x="900" y="120" width="140" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="970.0" y="139.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">batch-api</text><text x="970.0" y="160.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">bootJar</text><rect x="560" y="240" width="220" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="670.0" y="259.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">erp-domain</text><text x="670.0" y="280.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔티티 21 · 리포지토리 · DTO · jar</text><rect x="810" y="240" width="230" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="925.0" y="259.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">account-domain</text><text x="925.0" y="280.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">엔티티 9 · 리포지토리 · DTO · jar</text><rect x="560" y="360" width="480" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="800.0" y="379.0" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">core</text><text x="800.0" y="400.0" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">enum · BaseEntity · 공통 DTO · 설정 (project deps 없음)</text><path d="M 635 180 L 635 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 805 180 L 860 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 950 180 L 720 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 990 180 L 960 240" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/><path d="M 670 300 L 670 360" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 925 300 L 925 360" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 570 180 L 550 200 L 550 340 L 570 360" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-muted)"/><path d="M 1030 180 L 1050 200 L 1050 340 L 1030 360" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-muted)"/><rect x="560" y="440" width="480" height="120" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="800.0" y="473.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">• 의존 방향 api → domain → core. 리포지토리가 컨트롤러를 import 하면 빌드가 깨진다</text><text x="800.0" y="491.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">• implementation 만 사용 — core 를 api 모듈이 따로 선언 (점선)</text><text x="800.0" y="509.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">• batch-api 는 두 도메인을 모두, api 는 자기 도메인 하나만</text><text x="800.0" y="527.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">• scanBasePackages 에 도메인 패키지 추가 — @EntityScan 불필요</text><path class="anim" d="M 950 180 L 720 240" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.50s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1333;0.1889;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.50s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1333;0.1383;1" values="0;0;1;1;0;0"/><animateMotion dur="4.50s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1333;1" path="M 950 180 L 720 240"/></circle><path class="anim" d="M 670 300 L 670 360" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacit