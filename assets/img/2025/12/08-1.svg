="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">잠김</text><rect x="420" y="366" width="260" height="34" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="550" y="388" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">잠김 — 지난 달, 11일부터</text><rect x="740" y="366" width="260" height="34" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="870" y="388" font-size="12" font-weight="700" fill="#059669" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">열림 (이번 달)</text><text x="836.4516129032259" y="360" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">▼ 오늘 (12일)</text><rect x="100" y="430" width="900" height="100" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="260" y="454" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">대상 월</text><text x="560" y="454" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">오늘 ≤ 10일</text><text x="820" y="454" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">오늘 ≥ 11일</text><text x="260" y="478" font-size="12" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">지지난 달 이전</text><text x="560" y="478" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Go