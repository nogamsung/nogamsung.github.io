<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">매달 10일까지는 지난 달이 열려 있고, 11일부터 잠긴다 — isPassedRequestDate(문서 날짜, 오늘)</text><rect x="100" y="96" width="260" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="230.0" y="126.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">10월</text><rect x="420" y="96" width="260" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="550.0" y="126.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">11월</text><rect x="740" y="96" width="260" height="60" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="870.0" y="126.0" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">12월</text><path d="M 828.0645161290322 96 L 828.0645161290322 156" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><text x="828.0645161290322" y="172" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">10일 | 11일 경계</text><text x="60" y="222" font-size="14" font-weight="700" fi