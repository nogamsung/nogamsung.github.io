f2937" stroke-width="2"/><text x="70" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  철강C        ACTIVE</text><rect x="60" y="322" width="290" height="26" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="205" y="339" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">(2번 행 사라짐)</text><rect x="405" y="270" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="415" y="287.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">1  철강A   deleted_at NULL</text><rect x="405" y="296" width="290" height="26" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="415" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">2  철강B   deleted_at 2025-06-16</text><rect x="405" y="322" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="415" y="339.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  철강C   deleted_at NULL</text><rect x="750" y="270" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760" y="287.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">1  철강A        ACTIVE</text><rect x="750" y="296" width="290" height="26" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="760" y="313.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">2  철강B        DEACTIVATE</text><rect x="750" y="322" width="290" height="26" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="760" y="339.0" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">3  철강C        ACTIVE</text><rect x="40" y="368" width="330" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="205.0" y="396.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">orders.company_id → 2 가 고아가 된다.</text><text x="205.0" y="414.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">FK 오류 또는 cascade 로 업무 기록까지 삭제.</text><text x="205.0" y="432.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">감사 추적 없음. 첫 커밋부터 선택지 밖.</text><rect x="385" y="368" width="330" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="396.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">상태가 둘뿐(있음/없음). 모든 조회에 IS NULL.</text><text x="550.0" y="414.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">"언제·누가"는 이미 update_* 감사 컬럼이 기록.</text><text x="550.0" y="432.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">보류 같은 업무 상태가 생기면 컬럼이 또 필요.</text><rect x="730" y="368" width="330" height="92" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="895.0" y="396.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">되돌릴 수 있다(ACTIVE 로 복귀).</text><text x="895.0" y="414.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">update_user_id·update_datetime 도 함께 갱신.</text><text x="895.0" y="432.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">같은 컬럼이 나중에 업무 상태까지 담는다.</text><rect x="40" y="490" width="1020" height="70" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550" y="518" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">조회는 리포지토리마다 where status = 'ACTIVE' 를 명시한다 (구현 10개, 30곳) — 전역 가드 대신 쿼리에 보이는 조건</text><text x="550" y="542" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">UNIQUE 제약 없음 · 자식은 서비스가 명시적으로 내림(cascade 없음) · DELETE 문은 저장소 어디에도 없음</text><path class="anim" d="M 205 222 L 205 262" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.1364;0.2273;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="4.40s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.1364;0.1414;1" values="0;0;1;1;0;0"/><animateMotion dur="4.40s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1364;1" path="M 205 222 L 205 262"/></circle>