<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker></defs><style>@media (prefers-reduced-motion: reduce){.anim{display:none}}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="550.0" y="36" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DELETE /company 요청은 UPDATE 세 묶음이 된다 — DELETE 문은 한 번도 나가지 않는다</text><rect x="40" y="200" width="150" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="115.0" y="216.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">클라이언트</text><text x="115.0" y="237.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DELETE /company</text><text x="115.0" y="253.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">{ companyId }</text><rect x="250" y="200" width="200" height="70" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="350.0" y="216.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CompanyController</text><text x="350.0" y="237.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">deactivateCompany()</text><text x="350.0" y="253.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">@DeleteMapping 유지</text><rect x="510" y="96" width="260" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="524" y="112" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">CompanyService  @Transactional</text><rect x="530" y="126" width="220" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="640.0" y="145.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">companyEntity</text><text x="640.0" y="166.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.deactivate(updateUser)</text><rect x="530" y="206" width="220" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="640.0" y="225.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">companyManager 들</text><text x="640.0" y="246.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.forEach { deactivate() }</text><rect x="530" y="286" width="220" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="640.0" y="305.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">shipmentReportApproval 들</text><text x="640.0" y="326.5" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">.forEach { deactivate() }</text><rect x="830" y="96" width="230" height="290" rx="14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/><text x="844" y="112" font-size="13" font-weight="700" fill="#6b7280" text-anchor="start" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">DB (커밋 시 더티 체킹)</text><rect x="850" y="126" width="190" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="945" y="150" font-size="9" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">UPDATE company SET</text><text x="945" y="168" font-size="9" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">status='DEACTIVATE', update_user_id=?</text><rect x="850" y="206" width="190" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="945" y="230" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">UPDATE company_manager</text><text x="945" y="248" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">SET status='DEACTIVATE'</text><rect x="850" y="286" width="190" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="945" y="310" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">UPDATE shipment_report_approval</text><text x="945" y="328" font-size="10" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">SET status='DEACTIVATE'</text><rect x="850" y="356" width="190" height="24" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/><text x="945" y="372" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle" dominant-baseline="middle" font-family="'SF Mono','JetBrains Mono',Menlo,monospace">DELETE FROM company  ✕</text><path d="M 190 235 L 250 235" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/><path d="M 450 235 L 480 235 L 480 156 L 530 156" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 450 235 L 480 235 L 530 235" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 450 235 L 480 235 L 480 316 L 530 316" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#a-gray)"/><path d="M 750 156 L 850 156" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><path d="M 750 236 L 850 236" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><path d="M 750 316 L 850 316" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/><text x="800" y="140" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">save() 없음</text><rect x="40" y="420" width="1020" height="50" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="550" y="450" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">응답 200  COMPANY_DEACTIVATE  "회사 비활성화를 완료했습니다."   (전: COMPANY_DELETE "회사 삭제를 완료했습니다.")</text><rect x="40" y="486" width="1020" height="56" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/><text x="550.0" y="505.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">HTTP 동사는 DELETE 를 유지했다 — "목록에서 없애 달라"는 의도 전달에 가장 맞고, 프론트 호출부를 같이 바꾸지 않기 위해.</text><text x="550.0" y="523.0" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle" dominant-baseline="middle" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">이름(비활성화)과 동사(DELETE)의 불일치는 알고 남긴 것. 상태를 직접 지정하는 요구가 오면 PATCH /company/{id}/status 로.</text><path class="anim" d="M 190 235 L 250 235" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.10s" repeatCount="indefinite" keyTimes="0;0.0000;0.0100;0.0980;0.1471;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.10s" repeatCount="indefinite" keyTimes="0;0.0000;0.0050;0.0980;0.1030;1" values="0;0;1;1;0;0"/><animateMotion dur="5.10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0980;1" path="M 190 235 L 250 235"/></circle><path class="anim" d="M 450 235 L 480 235 L 480 156 L 530 156" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="5.10s" repeatCount="indefinite" keyTimes="0;0.1471;0.1571;0.2647;0.3137;1" values="0;0;0.35;0.35;0;0"/></path><circle class="anim" r="7" fill="#1f2937" stroke="#ffffff" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="5.10s" repeatCount="indefinite" keyTimes="0;0.1471;0.1521;0.2647;0.2697;1" values="0;0;1;1;0;0"/><animateMotion dur="5.10s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;