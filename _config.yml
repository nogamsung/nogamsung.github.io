# The Site Configuration
# Chirpy 7.x (gem 기반) › https://github.com/cotes2020/jekyll-theme-chirpy

theme: jekyll-theme-chirpy

# 언어 › http://www.lingoes.net/en/translator/langcode.htm (_data/locales 의 파일명과 일치해야 함)
lang: ko-KR

timezone: Asia/Seoul

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: nogamsung # the main title

tagline: 프로덕트 엔지니어 안검성의 기술 블로그 # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  프로덕트 엔지니어 안검성(nogamsung)의 기술 블로그. Spring Boot, JPA, Next.js, 실시간 통신, 인증, 무중단 배포, AI 코딩 에이전트까지
  실무에서 겪은 문제와 결정의 이유를 기록합니다.

# 사이트 주소 (프로토콜 포함, 끝에 슬래시 없음)
url: "https://nogamsung.github.io"

github:
  username: nogamsung

social:
  # 글의 기본 작성자이자 푸터 저작권 표시 이름
  name: Geomseong Ahn
  email: gs97ahn@naver.com
  links:
    # 첫 번째 링크가 저작권자 링크로 쓰인다
    - https://github.com/nogamsung

# 구조화 데이터(JSON-LD)의 작성자 Person 엔티티 (jekyll-seo-tag). 글 by-line 은 social.name 을 쓴다.
author:
  name: Geomseong Ahn
  url: https://github.com/nogamsung

# 사이트 소유 확인 (jekyll-seo-tag) › Google Search Console / Bing 웹마스터 등
webmaster_verifications:
  google: 3H6l4VV0Rc5nDPkKUjzbE6IUrFOJJwCUviaoOYGSyGI
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# 네이버 서치어드바이저 › https://searchadvisor.naver.com/console/board
# 'HTML 태그' 방식의 content 값을 넣으면 _includes/metadata-hook.html 이 <meta name="naver-site-verification"> 을 출력한다.
# (현재는 루트의 naver*.html 파일 업로드 방식으로 인증되어 있으므로 비워 두어도 된다)
naver_site_verification:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: G-P06BXW4HP1
  goatcounter:
    id: nogamsung # GoatCounter 사이트 코드 (https://nogamsung.goatcounter.com)
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# 사이드바 방문자 수 (오늘 KST · 전체) — workers/visitor-counter 의 Cloudflare Worker 주소. 비우면 표시하지 않는다
visitor_counter:
  endpoint: https://blog-visitor-counter.blog-visitor-counter.workers.dev

# Page views settings
pageviews:
  provider: goatcounter # analytics.goatcounter.id 가 비어 있으면 표시하지 않는다

# Prefer color scheme setting.
# 비워 두면 시스템 설정을 따르고, 사이드바 토글로 바꿀 수 있다.
theme_mode: # [light | dark]

# 이미지 CDN. 비워 두면 /assets/img 로컬 경로를 그대로 쓴다.
cdn:

# 사이드바 아바타
avatar: https://avatars.githubusercontent.com/u/84578465?v=4

# 글에 썸네일(image)이 없을 때 쓰이는 기본 소셜 미리보기 이미지 (홈, 탭 페이지 등)
social_preview_image: /assets/img/og-default.jpg

# boolean type, the global switch for TOC in posts.
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  provider: giscus # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  # Giscus options › https://giscus.app
  giscus:
    repo: nogamsung/nogamsung.github.io
    repo_id: R_kgDOHSXcqg
    category: Announcements
    category_id: DIC_kwDOHSXcqs4DKWzU
    mapping: # optional, default to 'pathname'
    strict: # optional, default to '0'
    input_position: # optional, default to 'bottom'
    lang: ko
    reactions_enabled: # optional, default to the value of `1`

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # boolean, keep empty means false
    env: # [development | production]

pwa:
  enabled: true # The option for PWA feature (installable)
  cache:
    enabled: true # The option for PWA offline cache
    # Paths defined here will be excluded from the PWA cache.
    deny_paths:
      # - "/example"  # URLs match `<SITE_URL>/example/*` will not be cached by the PWA

paginate: 10

# The base URL of your site
baseurl: ""

plugins:
  - jekyll-redirect-from # Chirpy 7.x 는 더 이상 기본 포함하지 않으므로 직접 활성화
  - jekyll-polyglot

# 다국어 (jekyll-polyglot) › https://polyglot.untra.io
# 한국어가 기본(루트 경로), 영어는 /en/ 아래에 언어별로 따로 빌드된다.
# 번역 글은 원문과 같은 slug + `lang: en` 으로 _posts/en/ 아래에 둔다.
languages: ["ko-KR", "en"]
default_lang: "ko-KR"
lang_vars: ["lang"] # 빌드 중인 언어로 site.lang 을 바꿔 Chirpy 의 _data/locales 문구가 따라오게 한다
exclude_from_localization: ["assets/img", "assets/lib", "assets/css", "assets/js/dist", "assets/robots.txt", "sitemap.xml", "naver920c22dc31bd263f2a456b0e282b8137.html"]
# 영어 글이 없을 때 /en/ 에 대신 렌더되는 한국어 글은 canonical 을 한국어 주소로 둔다
fallback_canonical_to_default_lang: true
# 언어별 빌드를 fork 로 병렬 실행하면 .jekyll-cache 를 함께 써서 가끔 빌드가 깨진다. 순차로 돌린다
parallel_localization: false

# 언어별로 달라야 하는 설정 값 (_plugins/i18n-config.rb 가 해당 언어 빌드에서 덮어쓴다)
# UI 문구는 _data/<lang>/ui.yml (polyglot 이 site.data.ui 로 병합)
i18n:
  en:
    tagline: Engineering notes from product engineer Geomseong Ahn
    description: >-
      The engineering blog of product engineer Geomseong Ahn (nogamsung). Spring Boot, JPA, Next.js, real-time
      messaging, auth, zero-downtime deploys, and AI coding agents: the problems I hit in production and why I
      made the calls I did.
    comments:
      giscus:
        lang: en

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true # Enable comments in posts.
      toc: true # Display TOC column in posts.
      # DO NOT modify the following parameter unless you are confident enough
      # to update the code of all other post links in this project.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # see `site.collections`
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - workers
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
  - _posts/2023-01-01-title.md   # 로컬 전용 글 템플릿 (gitignore 됨)

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
