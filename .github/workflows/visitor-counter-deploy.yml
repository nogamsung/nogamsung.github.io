# 사이드바 방문자 수 Cloudflare Worker 배포 (workers/visitor-counter)
# 비밀값은 GitHub Secrets 에만 있다: CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · GOATCOUNTER_TOKEN
name: Deploy visitor counter worker

on:
  push:
    branches: [main]
    paths:
      - workers/visitor-counter/**
      - .github/workflows/visitor-counter-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visitor-counter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/visitor-counter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/visitor-counter
          wranglerVersion: "4.160.1"
          secrets: |
            GOATCOUNTER_TOKEN
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Smoke test
        run: |
          body=$(curl -fsS -H 'Origin: https://nogamsung.github.io' https://blog-visitor-counter.blog-visitor-counter.workers.dev/stats)
          echo "$body" | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(typeof d.total!=="number")process.exit(1);console.log("ok total=",d.total)'
